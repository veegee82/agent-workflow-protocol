  <rect x="20" y="360" width="340" height="60" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="190" y="382" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="500">spec/</text>
