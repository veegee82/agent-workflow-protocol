<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif" width="820" height="420">
  <defs>
    <marker id="arr4" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#60a5fa"/></marker>
  </defs>

  <rect width="820" height="420" rx="14" fill="#0b1e3a"/>
  <text x="410" y="32" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="700" letter-spacing="2">LOSS TRAJECTORY · CONVERGENCE GUARDS</text>
  <text x="410" y="50" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">best-so-far tracker · five short-circuits · session persisted on every exit</text>

  <!-- Axes -->
  <line x1="70" y1="330" x2="750" y2="330" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="70" y1="80" x2="70" y2="330" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Y axis labels -->
  <text x="60" y="86" text-anchor="end" fill="#94a3b8" font-size="10">loss</text>
  <line x1="66" y1="100" x2="74" y2="100" stroke="#3b82f6" stroke-width="1"/>
  <text x="60" y="104" text-anchor="end" fill="#64748b" font-size="9">0.60</text>
  <line x1="66" y1="160" x2="74" y2="160" stroke="#3b82f6" stroke-width="1"/>
  <text x="60" y="164" text-anchor="end" fill="#64748b" font-size="9">0.50</text>
  <line x1="66" y1="220" x2="74" y2="220" stroke="#3b82f6" stroke-width="1"/>
  <text x="60" y="224" text-anchor="end" fill="#64748b" font-size="9">0.40</text>
  <line x1="66" y1="280" x2="74" y2="280" stroke="#3b82f6" stroke-width="1"/>
  <text x="60" y="284" text-anchor="end" fill="#64748b" font-size="9">0.30</text>
  <text x="60" y="324" text-anchor="end" fill="#64748b" font-size="9">0.20</text>

  <!-- X axis labels -->
  <text x="140" y="348" text-anchor="middle" fill="#94a3b8" font-size="10">seed</text>
  <text x="270" y="348" text-anchor="middle" fill="#94a3b8" font-size="10">iter 1</text>
  <text x="400" y="348" text-anchor="middle" fill="#94a3b8" font-size="10">iter 2</text>
  <text x="530" y="348" text-anchor="middle" fill="#94a3b8" font-size="10">iter 3</text>
  <text x="660" y="348" text-anchor="middle" fill="#94a3b8" font-size="10">iter 4 (not run)</text>

  <!-- Grid lines -->
  <line x1="140" y1="80" x2="140" y2="330" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="270" y1="80" x2="270" y2="330" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="400" y1="80" x2="400" y2="330" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="530" y1="80" x2="530" y2="330" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 3"/>

  <!-- Trajectory line: seed=0.504, iter1=0.35, iter2=0.32, iter3=0.34 (regress) -->
  <!-- y = 330 - (loss - 0.20) * 600  ... at 0.50=160 ; 0.35=250 ; 0.32=268 ; 0.34=256 -->
  <polyline points="140,164 270,250 400,268 530,256" fill="none" stroke="#60a5fa" stroke-width="2.5"/>

  <!-- Markers -->
  <circle cx="140" cy="164" r="6" fill="#0b1e3a" stroke="#fca5a5" stroke-width="2.2"/>
  <text x="140" y="140" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="700">0.504</text>
  <text x="140" y="128" text-anchor="middle" fill="#64748b" font-size="9">baseline</text>

  <circle cx="270" cy="250" r="7" fill="#0b1e3a" stroke="#86efac" stroke-width="2.5"/>
  <text x="270" y="242" text-anchor="middle" fill="#86efac" font-size="10" font-weight="700">0.350</text>
  <text x="270" y="228" text-anchor="middle" fill="#86efac" font-size="10" font-weight="700">★ best</text>

  <circle cx="400" cy="268" r="5" fill="#0b1e3a" stroke="#60a5fa" stroke-width="2"/>
  <text x="400" y="260" text-anchor="middle" fill="#60a5fa" font-size="10">0.320</text>

  <circle cx="530" cy="256" r="5" fill="#0b1e3a" stroke="#60a5fa" stroke-width="2" stroke-dasharray="2 2"/>
  <text x="530" y="248" text-anchor="middle" fill="#fbbf24" font-size="10">0.340</text>
  <text x="530" y="304" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="700">regression #1</text>

  <!-- Stop condition band -->
  <rect x="600" y="80" width="150" height="250" rx="6" fill="#1a0f2a" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="675" y="100" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">STOP ZONE</text>
  <text x="675" y="118" text-anchor="middle" fill="#fbbf24" font-size="9">regression × 2 or</text>
  <text x="675" y="132" text-anchor="middle" fill="#fbbf24" font-size="9">plateau × 2 or</text>
  <text x="675" y="146" text-anchor="middle" fill="#fbbf24" font-size="9">wall ≥ 2× seed</text>
  <text x="675" y="170" text-anchor="middle" fill="#94a3b8" font-size="9" font-style="italic">session written</text>
  <text x="675" y="184" text-anchor="middle" fill="#94a3b8" font-size="9" font-style="italic">with stop_reason</text>

  <!-- Legend for stop reasons -->
  <rect x="40" y="370" width="740" height="40" rx="8" fill="#0f2644" stroke="#3b82f6" stroke-width="1"/>
  <text x="56" y="390" fill="#93c5fd" font-size="10" font-weight="600">stop_reason:</text>
  <text x="140" y="390" fill="#94a3b8" font-size="10">max_iterations</text>
  <text x="230" y="390" fill="#64748b" font-size="10">·</text>
  <text x="240" y="390" fill="#94a3b8" font-size="10">regression</text>
  <text x="310" y="390" fill="#64748b" font-size="10">·</text>
  <text x="320" y="390" fill="#94a3b8" font-size="10">plateau (|Δ|&lt;0.01 × 2)</text>
  <text x="455" y="390" fill="#64748b" font-size="10">·</text>
  <text x="465" y="390" fill="#94a3b8" font-size="10">wall_time_exhausted</text>
  <text x="596" y="390" fill="#64748b" font-size="10">·</text>
  <text x="606" y="390" fill="#94a3b8" font-size="10">empty_gradient</text>
  <text x="56" y="404" fill="#64748b" font-size="9" font-style="italic">best-so-far pointer is never overwritten by a worse iteration; BEST/ never regresses across sessions either</text>
</svg>
