<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="820" height="400" fill="url(#bg)" rx="10"/>

  <text x="410" y="30" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Stall Detection — Two Channels + Strategy Switching</text>

  <!-- Channel 1 -->
  <rect x="30" y="55" width="360" height="110" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <text x="210" y="78" text-anchor="middle" fill="#fca5a5" font-size="14" font-weight="700">Channel 1: Confidence Delta</text>
  <text x="210" y="100" text-anchor="middle" fill="#94a3b8" font-size="11">|recent[-1] - recent[0]| &lt; 0.05</text>
  <text x="210" y="118" text-anchor="middle" fill="#94a3b8" font-size="11">over sliding window (default 3 iters)</text>
  <text x="210" y="140" text-anchor="middle" fill="#64748b" font-size="10">+ oscillation: variance &lt; 0.01 AND mean &lt; 0.7</text>
  <text x="210" y="158" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">= confidence is flat or stuck</text>

  <!-- Channel 2 -->
  <rect x="430" y="55" width="360" height="110" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <text x="610" y="78" text-anchor="middle" fill="#fca5a5" font-size="14" font-weight="700">Channel 2: Output Similarity</text>
  <text x="610" y="100" text-anchor="middle" fill="#94a3b8" font-size="11">SequenceMatcher ratio &gt; 0.85</text>
  <text x="610" y="118" text-anchor="middle" fill="#94a3b8" font-size="11">first 2000 chars of worker output</text>
  <text x="610" y="140" text-anchor="middle" fill="#94a3b8" font-size="11">comparing oldest vs newest in window</text>
  <text x="610" y="158" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">= workers producing same thing</text>

  <!-- Arrows down -->
  <path d="M 210 165 L 210 185 L 360 205" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 610 165 L 610 185 L 460 205" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Decision -->
  <rect x="330" y="200" width="160" height="36" rx="8" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <text x="410" y="223" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Both stalled?</text>

  <!-- OK -->
  <path d="M 330 218 L 175 260" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <rect x="80" y="260" width="190" height="32" rx="7" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="175" y="281" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">"ok" — continue</text>
  <text x="175" y="255" fill="#10b981" font-size="10" text-anchor="middle">Neither stalled</text>

  <!-- Warn -->
  <path d="M 370 236 L 300 275" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="200" y="305" width="190" height="32" rx="7" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="295" y="326" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="600">"warn" — log + count</text>
  <text x="295" y="300" fill="#f59e0b" font-size="10" text-anchor="middle">One channel only</text>

  <!-- Switch Strategy -->
  <path d="M 450 236 L 520 275" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="430" y="305" width="190" height="32" rx="7" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="525" y="326" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">"switch_strategy"</text>
  <text x="525" y="300" fill="#8b5cf6" font-size="10" text-anchor="middle">Stalled + strategies left</text>

  <!-- Stop -->
  <path d="M 490 218 L 660 260" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="570" y="260" width="210" height="32" rx="7" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <text x="675" y="281" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">"stop" — terminate loop</text>
  <text x="675" y="255" fill="#ef4444" font-size="10" text-anchor="middle">Both stalled + all strategies used</text>

  <!-- Strategy pool -->
  <rect x="370" y="355" width="420" height="30" rx="7" fill="#1e293b" stroke="#8b5cf6" stroke-width="0.5"/>
  <text x="580" y="375" text-anchor="middle" fill="#c4b5fd" font-size="11">Strategy pool: decompose_finer → simplify → reframe → escalate</text>

  <path d="M 525 337 L 525 355" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3 2"/>
</svg>
