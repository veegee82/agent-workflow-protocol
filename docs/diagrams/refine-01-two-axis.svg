<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif" width="800" height="460">
  <defs>
    <marker id="arrTheta" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#60a5fa"/></marker>
    <marker id="arrY" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#93c5fd"/></marker>
    <marker id="arrDark" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#3b82f6"/></marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="460" rx="14" fill="#0b1e3a"/>
  <text x="400" y="32" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="700" letter-spacing="2">TWO AXES OF SGD IN AWP</text>

  <!-- Forward pass box -->
  <rect x="260" y="56" width="280" height="70" rx="10" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="400" y="82" text-anchor="middle" fill="#dbeafe" font-size="13" font-weight="600">forward pass</text>
  <text x="400" y="102" text-anchor="middle" fill="#93c5fd" font-size="11">run → deliverable → loss</text>
  <text x="400" y="118" text-anchor="middle" fill="#64748b" font-size="9" font-style="italic">compute_run_loss() → scalar</text>

  <!-- Center split arrow -->
  <line x1="400" y1="128" x2="400" y2="160" stroke="#3b82f6" stroke-width="2"/>
  <line x1="400" y1="160" x2="200" y2="200" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrTheta)"/>
  <line x1="400" y1="160" x2="600" y2="200" stroke="#93c5fd" stroke-width="2" marker-end="url(#arrY)"/>

  <!-- θ axis label -->
  <text x="280" y="172" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="700">θ-axis</text>
  <text x="280" y="187" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">(policy / prompts)</text>
  <!-- y axis label -->
  <text x="520" y="172" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">y-axis</text>
  <text x="520" y="187" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">(this run's deliverable)</text>

  <!-- Left column: awp optimize -->
  <rect x="60" y="210" width="280" height="190" rx="10" fill="#11294a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="200" y="236" text-anchor="middle" fill="#dbeafe" font-size="14" font-weight="700">awp optimize  (A5)</text>
  <text x="200" y="256" text-anchor="middle" fill="#93c5fd" font-size="11">SGD over 6 prompt artifacts</text>
  <text x="200" y="272" text-anchor="middle" fill="#64748b" font-size="10">across a task suite</text>

  <!-- Artifacts list -->
  <line x1="80" y1="284" x2="320" y2="284" stroke="#1e3a5f" stroke-width="1"/>
  <text x="200" y="300" text-anchor="middle" fill="#94a3b8" font-size="10" font-style="italic">moves:</text>
  <text x="200" y="316" text-anchor="middle" fill="#dbeafe" font-size="10" font-family="monospace">worker_pitfalls · pattern_library</text>
  <text x="200" y="331" text-anchor="middle" fill="#dbeafe" font-size="10" font-family="monospace">manager_planning_preamble</text>
  <text x="200" y="346" text-anchor="middle" fill="#dbeafe" font-size="10" font-family="monospace">critique_rubric · tool_templates</text>
  <text x="200" y="361" text-anchor="middle" fill="#dbeafe" font-size="10" font-family="monospace">experiment_context_hint</text>
  <text x="200" y="383" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="600">persists to ArtifactRegistry</text>

  <!-- Right column: awp refine -->
  <rect x="460" y="210" width="280" height="190" rx="10" fill="#11294a" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="600" y="236" text-anchor="middle" fill="#dbeafe" font-size="14" font-weight="700">awp refine</text>
  <text x="600" y="256" text-anchor="middle" fill="#93c5fd" font-size="11">test-time inference-compute</text>
  <text x="600" y="272" text-anchor="middle" fill="#64748b" font-size="10">scaling on a fixed task</text>

  <line x1="480" y1="284" x2="720" y2="284" stroke="#1e3a5f" stroke-width="1"/>
  <text x="600" y="300" text-anchor="middle" fill="#94a3b8" font-size="10" font-style="italic">moves:</text>
  <text x="600" y="320" text-anchor="middle" fill="#dbeafe" font-size="12" font-family="monospace">y = this task's deliverable</text>
  <text x="600" y="342" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">Self-Refine / Reflexion family</text>
  <text x="600" y="362" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">best-so-far tracker</text>
  <text x="600" y="383" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">persists to &lt;seed&gt;/BEST/</text>

  <!-- Footer: disjoint state -->
  <rect x="120" y="420" width="560" height="26" rx="6" fill="#0f2644" stroke="#3b82f6" stroke-width="1"/>
  <text x="400" y="437" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="500">disjoint state · compose cleanly · never interact in one invocation</text>
</svg>
