<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <marker id="f1" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#6366f1"/></marker>
    <marker id="f2" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#06b6d4"/></marker>
    <marker id="f3" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#94a3b8"/></marker>
    <marker id="f4" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#f59e0b"/></marker>
    <marker id="f5" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#ef4444"/></marker>
  </defs>

  <rect width="820" height="520" fill="url(#bg)" rx="10"/>

  <text x="410" y="30" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">How Feedback Flows — Manager Decision Cycle</text>

  <!-- Step 1: Manager reads -->
  <rect x="260" y="50" width="300" height="44" rx="10" fill="#6366f1"/>
  <text x="410" y="70" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Manager reads rolling summary</text>
  <text x="410" y="86" text-anchor="middle" fill="#c7d2fe" font-size="10">+ skill catalog + budget status</text>

  <!-- Arrow down -->
  <path d="M 410 94 L 410 115" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#f1)"/>

  <!-- Step 2: Decision -->
  <rect x="200" y="120" width="420" height="44" rx="10" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="410" y="140" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Manager decides next action</text>
  <text x="410" y="156" text-anchor="middle" fill="#94a3b8" font-size="10">DELEGATE | PLAN | DIAGNOSE | COMPLETE | FAIL</text>

  <!-- Five branches -->
  <!-- DELEGATE (main path, left-center) -->
  <path d="M 290 164 L 160 200" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#f1)"/>
  <rect x="70" y="205" width="180" height="34" rx="8" fill="#4f46e5"/>
  <text x="160" y="227" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">DELEGATE</text>
  <text x="290" y="195" fill="#a5b4fc" font-size="10">envelopes</text>

  <!-- PLAN -->
  <path d="M 350 164 L 320 200" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="270" y="205" width="100" height="34" rx="8" fill="#292524" stroke="#8b5cf6" stroke-width="1"/>
  <text x="320" y="227" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">PLAN</text>

  <!-- DIAGNOSE -->
  <path d="M 410 164 L 410 200" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="380" y="205" width="120" height="34" rx="8" fill="#292524" stroke="#f59e0b" stroke-width="1"/>
  <text x="440" y="227" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="600">DIAGNOSE</text>

  <!-- COMPLETE -->
  <path d="M 490 164 L 540 200" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <rect x="510" y="205" width="110" height="34" rx="8" fill="#292524" stroke="#10b981" stroke-width="1"/>
  <text x="565" y="227" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">COMPLETE</text>

  <!-- FAIL -->
  <path d="M 550 164 L 670 200" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="630" y="205" width="80" height="34" rx="8" fill="#292524" stroke="#ef4444" stroke-width="1"/>
  <text x="670" y="227" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">FAIL</text>

  <!-- Main path continues from DELEGATE -->
  <path d="M 160 239 L 160 265" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#f1)"/>

  <!-- Step 3: Workers -->
  <rect x="70" y="270" width="340" height="40" rx="10" fill="#0891b2"/>
  <text x="240" y="295" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Workers execute in parallel</text>

  <!-- Arrow down -->
  <path d="M 240 310 L 240 335" fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#f2)"/>

  <!-- Step 4: Results -->
  <rect x="70" y="340" width="340" height="44" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="240" y="358" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Results collected</text>
  <text x="240" y="376" text-anchor="middle" fill="#94a3b8" font-size="10">confidence, key_findings, artifacts, skills_created</text>

  <!-- Arrow down -->
  <path d="M 240 384 L 240 410" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#f3)"/>

  <!-- Step 5: Update summary -->
  <rect x="70" y="415" width="340" height="40" rx="10" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="240" y="440" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Rolling summary + stall detector updated</text>

  <!-- Feedback arrow back to top -->
  <path d="M 70 435 Q 30 435 30 300 Q 30 100 260 72" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#f3)"/>
  <text x="42" y="280" fill="#cbd5e1" font-size="12" font-weight="600">Feedback</text>

  <!-- Right side: Stall + Convergence -->
  <rect x="500" y="310" width="280" height="90" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <text x="640" y="332" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">Stall / Convergence Check</text>
  <text x="640" y="352" text-anchor="middle" fill="#94a3b8" font-size="10">Confidence delta &lt; 0.05?</text>
  <text x="640" y="367" text-anchor="middle" fill="#94a3b8" font-size="10">Output similarity &gt; 0.85?</text>
  <text x="640" y="387" text-anchor="middle" fill="#64748b" font-size="10">→ ok | warn | switch_strategy | stop</text>

  <!-- Arrow from results to stall check -->
  <path d="M 410 365 L 500 355" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#f5)"/>

  <!-- Right side: Accumulation -->
  <rect x="500" y="420" width="280" height="80" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="640" y="442" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">Capability Accumulation</text>
  <text x="640" y="462" text-anchor="middle" fill="#94a3b8" font-size="10">New tools → cached in registry</text>
  <text x="640" y="478" text-anchor="middle" fill="#94a3b8" font-size="10">New skills → persisted to disk</text>
  <text x="640" y="494" text-anchor="middle" fill="#64748b" font-size="10">Available for all future iterations</text>

  <!-- Arrow from results to accumulation -->
  <path d="M 410 380 L 500 445" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#f4)"/>
</svg>
