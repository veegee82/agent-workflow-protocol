<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <marker id="a1" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#6366f1"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#06b6d4"/></marker>
    <marker id="a3" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#94a3b8"/></marker>
    <marker id="a4" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#f59e0b"/></marker>
    <marker id="a5" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#10b981"/></marker>
  </defs>

  <rect width="820" height="420" fill="url(#bg)" rx="10"/>

  <text x="410" y="30" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Iterative Optimization — Feedback Loop</text>

  <!-- Manager box -->
  <rect x="310" y="50" width="200" height="50" rx="10" fill="#6366f1"/>
  <text x="410" y="75" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Manager</text>
  <text x="410" y="93" text-anchor="middle" fill="#c7d2fe" font-size="9">5 decisions: DELEGATE | PLAN | DIAGNOSE | COMPLETE | FAIL</text>

  <!-- Arrow Manager → Workers -->
  <path d="M 510 75 Q 610 75 645 125" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#a1)"/>
  <text x="590" y="90" fill="#a5b4fc" font-size="11" font-weight="600">Delegate</text>

  <!-- Workers box -->
  <rect x="580" y="130" width="180" height="42" rx="10" fill="#0891b2"/>
  <text x="670" y="156" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Workers (parallel)</text>

  <!-- Arrow Workers → Results -->
  <path d="M 670 172 L 670 210" fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#a2)"/>

  <!-- Results box -->
  <rect x="560" y="215" width="220" height="52" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="670" y="236" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Worker Results</text>
  <text x="670" y="252" text-anchor="middle" fill="#94a3b8" font-size="10">confidence, key_findings,</text>
  <text x="670" y="264" text-anchor="middle" fill="#94a3b8" font-size="10">artifacts, skills_created</text>

  <!-- Arrow Results → Rolling Summary -->
  <path d="M 560 245 L 480 285" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a3)"/>

  <!-- Rolling Summary box -->
  <rect x="280" y="280" width="200" height="52" rx="8" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <text x="380" y="301" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Rolling Summary</text>
  <text x="380" y="317" text-anchor="middle" fill="#94a3b8" font-size="10">confidence trend (last 6)</text>
  <text x="380" y="329" text-anchor="middle" fill="#94a3b8" font-size="10">key findings (last 3 detailed)</text>

  <!-- Arrow Rolling Summary → Manager -->
  <path d="M 330 280 Q 200 230 200 150 Q 200 85 310 75" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a3)"/>
  <text x="188" y="172" fill="#cbd5e1" font-size="11" font-weight="600">Feedback</text>

  <!-- Tool Registry -->
  <rect x="30" y="215" width="160" height="60" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="110" y="238" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">Tool Registry</text>
  <text x="110" y="254" text-anchor="middle" fill="#94a3b8" font-size="10">cached by content hash</text>
  <text x="110" y="268" text-anchor="middle" fill="#94a3b8" font-size="10">available to all workers</text>

  <!-- Arrow workers to tool registry -->
  <path d="M 580 155 Q 400 155 190 220" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#a4)"/>
  <text x="375" y="175" fill="#fbbf24" font-size="10">new tools</text>

  <!-- Skill Catalog -->
  <rect x="30" y="300" width="160" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="110" y="323" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">Skill Catalog</text>
  <text x="110" y="339" text-anchor="middle" fill="#94a3b8" font-size="10">workspace/skills/*.md</text>
  <text x="110" y="353" text-anchor="middle" fill="#94a3b8" font-size="10">persisted to disk</text>

  <!-- Arrow results to skill catalog -->
  <path d="M 560 260 Q 350 305 190 330" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#a5)"/>
  <text x="372" y="295" fill="#34d399" font-size="10">skills_created</text>

  <!-- Stall / Convergence -->
  <rect x="560" y="340" width="220" height="55" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <text x="670" y="360" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">Stall / Convergence</text>
  <text x="670" y="376" text-anchor="middle" fill="#94a3b8" font-size="10">confidence delta + output similarity</text>
  <text x="670" y="390" text-anchor="middle" fill="#64748b" font-size="10">→ ok | warn | switch_strategy | stop</text>

  <path d="M 480 315 L 560 355" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 3"/>
</svg>
