<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="cs" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="2" result="offsetBlur"/>
      <feFlood flood-color="#000" flood-opacity="0.2" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4fc3f7"/>
    </marker>
  </defs>

  <rect width="800" height="400" rx="12" fill="#0a0a1a"/>

  <text x="400" y="35" text-anchor="middle" fill="#e0e0e0" font-size="20" font-weight="bold">Agent Output Contract (Rule R17)</text>
  <text x="400" y="55" text-anchor="middle" fill="#888" font-size="12">Every agent must honor this contract — the foundation of trust in the system</text>

  <!-- Agent Box -->
  <rect x="50" y="85" width="200" height="100" rx="10" fill="#1a1a2e" stroke="#4fc3f7" stroke-width="2" filter="url(#cs)"/>
  <text x="150" y="115" text-anchor="middle" fill="#4fc3f7" font-size="14" font-weight="bold">Agent</text>
  <text x="150" y="135" text-anchor="middle" fill="#aaa" font-size="11">run(task, state)</text>
  <text x="150" y="155" text-anchor="middle" fill="#666" font-size="10">Any implementation</text>

  <!-- Arrow -->
  <line x1="250" y1="135" x2="340" y2="135" stroke="#4fc3f7" stroke-width="2" marker-end="url(#ca)"/>
  <text x="295" y="125" text-anchor="middle" fill="#4fc3f7" font-size="10">return</text>

  <!-- Output Contract -->
  <rect x="350" y="75" width="400" height="130" rx="10" fill="#1a1a2e" stroke="#FF9800" stroke-width="2" filter="url(#cs)"/>
  <text x="550" y="100" text-anchor="middle" fill="#FF9800" font-size="13" font-weight="bold">Required return format</text>

  <!-- JSON structure -->
  <text x="380" y="125" fill="#4CAF50" font-size="12" font-family="monospace">{</text>
  <text x="400" y="145" fill="#fff" font-size="12" font-family="monospace">"agent_name": {</text>
  <text x="420" y="165" fill="#f44336" font-size="12" font-family="monospace">"confidence": 0.0 - 1.0,</text>
  <text x="420" y="185" fill="#aaa" font-size="12" font-family="monospace">...additional fields</text>
  <text x="400" y="200" fill="#4CAF50" font-size="12" font-family="monospace">}</text>

  <!-- Confidence explanation -->
  <rect x="50" y="230" width="320" height="140" rx="8" fill="#111" stroke="#f44336" stroke-width="1"/>
  <text x="210" y="255" text-anchor="middle" fill="#f44336" font-size="13" font-weight="bold">Confidence: The trust signal</text>
  <text x="70" y="280" fill="#ccc" font-size="11">0.0 = "I don't know"</text>
  <text x="70" y="300" fill="#ccc" font-size="11">0.5 = "Uncertain, need review"</text>
  <text x="70" y="320" fill="#ccc" font-size="11">0.8 = "Fairly confident"</text>
  <text x="70" y="340" fill="#ccc" font-size="11">1.0 = "Completely confident"</text>

  <!-- Usage in systems -->
  <rect x="410" y="230" width="350" height="140" rx="8" fill="#111" stroke="#4CAF50" stroke-width="1"/>
  <text x="585" y="255" text-anchor="middle" fill="#4CAF50" font-size="13" font-weight="bold">What is confidence used for?</text>
  <text x="430" y="280" fill="#ccc" font-size="11">DAG: Aggregation across pipeline steps</text>
  <text x="430" y="300" fill="#ccc" font-size="11">Loop: Stall Detection (Delta &lt; 0.05?)</text>
  <text x="430" y="320" fill="#ccc" font-size="11">Validation: Semantic check needed?</text>
  <text x="430" y="340" fill="#ccc" font-size="11">Manager: Re-delegation or complete?</text>
</svg>