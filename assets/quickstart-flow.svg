<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="qA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4fc3f7"/>
    </marker>
</defs>
  <rect width="960" height="280" rx="12" fill="#0a0a1a"/>

  <text x="480" y="32" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="bold">Quickstart: 3 Lines to an Agent Workflow</text>

  <!-- Step 1 -->
  <rect x="30" y="60" width="180" height="80" rx="10" fill="#1a1a2e" stroke="#4fc3f7" stroke-width="2"/>
  <text x="120" y="88" text-anchor="middle" fill="#4fc3f7" font-size="24" font-weight="bold">1</text>
  <text x="120" y="110" text-anchor="middle" fill="#ccc" font-size="11">pip install</text>
  <text x="120" y="128" text-anchor="middle" fill="#888" font-size="10">awp-runtime[data]</text>

  <line x1="210" y1="100" x2="260" y2="100" stroke="#4fc3f7" stroke-width="2" marker-end="url(#qA)"/>

  <!-- Step 2 -->
  <rect x="265" y="60" width="180" height="80" rx="10" fill="#1a1a2e" stroke="#FF9800" stroke-width="2"/>
  <text x="355" y="88" text-anchor="middle" fill="#FF9800" font-size="24" font-weight="bold">2</text>
  <text x="355" y="110" text-anchor="middle" fill="#ccc" font-size="11">Set API key</text>
  <text x="355" y="128" text-anchor="middle" fill="#888" font-size="10">LLM_API_KEY=...</text>

  <line x1="445" y1="100" x2="495" y2="100" stroke="#4fc3f7" stroke-width="2" marker-end="url(#qA)"/>

  <!-- Step 3 -->
  <rect x="500" y="55" width="230" height="90" rx="10" fill="#1a1a2e" stroke="#4CAF50" stroke-width="2"/>
  <text x="615" y="83" text-anchor="middle" fill="#4CAF50" font-size="24" font-weight="bold">3</text>
  <text x="615" y="105" text-anchor="middle" fill="#ccc" font-size="11">AgentWorkflow(...).run()</text>
  <text x="615" y="123" text-anchor="middle" fill="#888" font-size="10">inputs + task + model</text>
  <text x="615" y="138" text-anchor="middle" fill="#888" font-size="9">Delegation loop starts</text>

  <line x1="730" y1="100" x2="780" y2="100" stroke="#4fc3f7" stroke-width="2" marker-end="url(#qA)"/>

  <!-- Step 4: Result -->
  <rect x="785" y="60" width="145" height="80" rx="10" fill="#1b5e20" stroke="#4CAF50" stroke-width="2"/>
  <text x="857" y="92" text-anchor="middle" fill="#4CAF50" font-size="16" font-weight="bold">Result</text>
  <text x="857" y="112" text-anchor="middle" fill="#aaa" font-size="10">JSON + Artifacts</text>
  <text x="857" y="128" text-anchor="middle" fill="#aaa" font-size="10">+ Audit Trail</text>

  <!-- Code below -->
  <rect x="60" y="170" width="840" height="90" rx="8" fill="#111" stroke="#333"/>
  <text x="80" y="195" fill="#4CAF50" font-size="12" font-family="monospace">from</text>
  <text x="117" y="195" fill="#ccc" font-size="12" font-family="monospace">awp.data</text>
  <text x="195" y="195" fill="#4CAF50" font-size="12" font-family="monospace">import</text>
  <text x="252" y="195" fill="#FF9800" font-size="12" font-family="monospace">AgentWorkflow</text>

  <text x="80" y="220" fill="#ccc" font-size="12" font-family="monospace">result = AgentWorkflow(</text>
  <text x="80" y="240" fill="#888" font-size="12" font-family="monospace">    inputs=&#123;&quot;data&quot;: df&#125;, task=&quot;Analyse&quot;, model=&quot;claude-sonnet-4&quot;</text>
  <text x="80" y="255" fill="#ccc" font-size="12" font-family="monospace">).run()</text>
</svg>