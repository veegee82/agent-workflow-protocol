<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <filter id="rs">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="900" height="600" rx="12" fill="#0a0a1a"/>

  <text x="450" y="35" text-anchor="middle" fill="#e0e0e0" font-size="22" font-weight="bold">Recursive Delegation (A4)</text>
  <text x="450" y="57" text-anchor="middle" fill="#888" font-size="13">Workers become sub-managers — each with their own budget that cannot exceed the parent budget</text>

  <!-- Root Manager -->
  <rect x="325" y="80" width="250" height="60" rx="10" fill="#1a1a2e" stroke="#9C27B0" stroke-width="2.5" filter="url(#rs)"/>
  <text x="450" y="107" text-anchor="middle" fill="#9C27B0" font-size="15" font-weight="bold">Root Manager</text>
  <text x="450" y="127" text-anchor="middle" fill="#888" font-size="10">Budget: 500k tokens | depth=0 | max_depth=3</text>

  <!-- Lines to Sub-Managers -->
  <line x1="370" y1="140" x2="200" y2="195" stroke="#888" stroke-width="1.5" marker-end="url(#ra)"/>
  <line x1="530" y1="140" x2="700" y2="195" stroke="#888" stroke-width="1.5" marker-end="url(#ra)"/>

  <!-- Sub-Manager A -->
  <rect x="75" y="200" width="250" height="60" rx="10" fill="#1a1a2e" stroke="#f44336" stroke-width="2" filter="url(#rs)"/>
  <text x="200" y="225" text-anchor="middle" fill="#f44336" font-size="14" font-weight="bold">Sub-Manager A</text>
  <text x="200" y="247" text-anchor="middle" fill="#888" font-size="10">Budget: 200k tokens | depth=1 | Financial Analysis</text>

  <!-- Sub-Manager B -->
  <rect x="575" y="200" width="250" height="60" rx="10" fill="#1a1a2e" stroke="#FF9800" stroke-width="2" filter="url(#rs)"/>
  <text x="700" y="225" text-anchor="middle" fill="#FF9800" font-size="14" font-weight="bold">Sub-Manager B</text>
  <text x="700" y="247" text-anchor="middle" fill="#888" font-size="10">Budget: 200k tokens | depth=1 | Market Analysis</text>

  <!-- Workers from Sub-Manager A -->
  <line x1="130" y1="260" x2="90" y2="325" stroke="#888" stroke-width="1" marker-end="url(#ra)"/>
  <line x1="200" y1="260" x2="200" y2="325" stroke="#888" stroke-width="1" marker-end="url(#ra)"/>
  <line x1="270" y1="260" x2="310" y2="325" stroke="#888" stroke-width="1" marker-end="url(#ra)"/>

  <rect x="30" y="330" width="120" height="45" rx="6" fill="#1a1a2e" stroke="#4fc3f7" stroke-width="1"/>
  <text x="90" y="350" text-anchor="middle" fill="#4fc3f7" font-size="11">Revenue Trends</text>
  <text x="90" y="366" text-anchor="middle" fill="#666" font-size="9">Worker (Leaf)</text>

  <rect x="140" y="330" width="120" height="45" rx="6" fill="#1a1a2e" stroke="#4fc3f7" stroke-width="1"/>
  <text x="200" y="350" text-anchor="middle" fill="#4fc3f7" font-size="11">Cost Analysis</text>
  <text x="200" y="366" text-anchor="middle" fill="#666" font-size="9">Worker (Leaf)</text>

  <rect x="250" y="330" width="120" height="45" rx="6" fill="#1a1a2e" stroke="#4fc3f7" stroke-width="1"/>
  <text x="310" y="350" text-anchor="middle" fill="#4fc3f7" font-size="11">Cashflow</text>
  <text x="310" y="366" text-anchor="middle" fill="#666" font-size="9">Worker (Leaf)</text>

  <!-- Workers/Sub-Sub-Manager from Sub-Manager B -->
  <line x1="640" y1="260" x2="550" y2="325" stroke="#888" stroke-width="1" marker-end="url(#ra)"/>
  <line x1="760" y1="260" x2="780" y2="325" stroke="#888" stroke-width="1" marker-end="url(#ra)"/>

  <rect x="490" y="330" width="120" height="45" rx="6" fill="#1a1a2e" stroke="#4fc3f7" stroke-width="1"/>
  <text x="550" y="350" text-anchor="middle" fill="#4fc3f7" font-size="11">Competitors</text>
  <text x="550" y="366" text-anchor="middle" fill="#666" font-size="9">Worker (Leaf)</text>

  <!-- Sub-Sub-Manager -->
  <rect x="700" y="330" width="160" height="45" rx="6" fill="#1a1a2e" stroke="#FF9800" stroke-width="1.5"/>
  <text x="780" y="350" text-anchor="middle" fill="#FF9800" font-size="11" font-weight="bold">Sub-Sub-Mgr</text>
  <text x="780" y="366" text-anchor="middle" fill="#888" font-size="9">depth=2 | 80k tokens</text>

  <!-- Sub-Sub workers -->
  <line x1="745" y1="375" x2="710" y2="420" stroke="#888" stroke-width="1" marker-end="url(#ra)"/>
  <line x1="815" y1="375" x2="840" y2="420" stroke="#888" stroke-width="1" marker-end="url(#ra)"/>

  <rect x="650" y="425" width="110" height="40" rx="6" fill="#1a1a2e" stroke="#7bc67e" stroke-width="1"/>
  <text x="705" y="448" text-anchor="middle" fill="#7bc67e" font-size="10">Trend APAC</text>

  <rect x="790" y="425" width="110" height="40" rx="6" fill="#1a1a2e" stroke="#7bc67e" stroke-width="1"/>
  <text x="845" y="448" text-anchor="middle" fill="#7bc67e" font-size="10">Trend EMEA</text>

  <!-- Budget cascade explanation -->
  <rect x="50" y="490" width="800" height="90" rx="8" fill="#111" stroke="#555" stroke-dasharray="4,2"/>
  <text x="450" y="515" text-anchor="middle" fill="#e0e0e0" font-size="13" font-weight="bold">Budget Cascade: Children can never exceed the parent budget</text>
  <text x="450" y="537" text-anchor="middle" fill="#aaa" font-size="11">Root: 500k tokens -> Sub-Manager A: 200k | Sub-Manager B: 200k | Reserve: 100k</text>
  <text x="450" y="557" text-anchor="middle" fill="#aaa" font-size="11">Sub-Manager B: 200k -> Workers: 80k | Sub-Sub-Manager: 80k | Reserve: 40k</text>
  <text x="450" y="572" text-anchor="middle" fill="#888" font-size="10">Each level partitions its budget — the sum of all children must not exceed the parent budget</text>
</svg>