<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="g0" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#1a1a6e"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#533483"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#533483"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5a623"/>
      <stop offset="100%" style="stop-color:#e94560"/>
    </linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7bc67e"/>
      <stop offset="100%" style="stop-color:#f5a623"/>
    </linearGradient>
    <linearGradient id="g6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#7bc67e"/>
    </linearGradient>
    <linearGradient id="gsec" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:0.05"/>
    </linearGradient>
</defs>

  <!-- Background -->
  <rect width="900" height="720" rx="12" fill="#0a0a1a"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="#e0e0e0" font-size="22" font-weight="bold">AWP 7-Layer Model</text>
  <text x="450" y="70" text-anchor="middle" fill="#888" font-size="13">Each layer answers a fundamental question of agent orchestration</text>

  <!-- Security cross-cutting bar -->
  <rect x="40" y="95" width="80" height="520" rx="8" fill="url(#gsec)" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="80" y="340" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="bold" transform="rotate(-90,80,340)">SECURITY (cross-cutting)</text>
  <text x="80" y="380" text-anchor="middle" fill="#ff6b6b" font-size="10" transform="rotate(-90,80,380)">Circuit Breaker | Rate Limiting | ACL | Secrets</text>

  <!-- Layer 6 -->
  <rect x="145" y="95" width="710" height="68" rx="8" fill="url(#g6)"/>
  <text x="165" y="122" fill="#fff" font-size="11" font-weight="bold" opacity="0.7">LAYER 6</text>
  <text x="165" y="140" fill="#fff" font-size="16" font-weight="bold">Observability</text>
  <text x="165" y="155" fill="#ddd" font-size="11">How do I monitor the system?</text>
  <text x="830" y="130" text-anchor="end" fill="#fff" font-size="11" opacity="0.8">Tracing (OpenTelemetry)</text>
  <text x="830" y="148" text-anchor="end" fill="#fff" font-size="11" opacity="0.8">Metrics | Audit Trail | Dual Logging</text>

  <!-- Layer 5 -->
  <rect x="145" y="173" width="710" height="68" rx="8" fill="url(#g5)"/>
  <text x="165" y="200" fill="#fff" font-size="11" font-weight="bold" opacity="0.7">LAYER 5</text>
  <text x="165" y="218" fill="#fff" font-size="16" font-weight="bold">Orchestration</text>
  <text x="165" y="233" fill="#ddd" font-size="11">In what order do agents run?</text>
  <text x="830" y="208" text-anchor="end" fill="#fff" font-size="11" opacity="0.8">DAG-Engine (A0-A1) | Delegation Loop (A2-A4)</text>
  <text x="830" y="226" text-anchor="end" fill="#fff" font-size="11" opacity="0.8">Budget | Stall Detection | Validation Gates</text>

  <!-- Layer 4 -->
  <rect x="145" y="251" width="710" height="68" rx="8" fill="url(#g4)"/>
  <text x="165" y="278" fill="#fff" font-size="11" font-weight="bold" opacity="0.7">LAYER 4</text>
  <text x="165" y="296" fill="#fff" font-size="16" font-weight="bold">Memory &amp; State</text>
  <text x="165" y="311" fill="#ddd" font-size="11">What does the system remember?</text>
  <text x="830" y="286" text-anchor="end" fill="#fff" font-size="11" opacity="0.8">Long-term | Daily | Episodic | Semantic</text>
  <text x="830" y="304" text-anchor="end" fill="#fff" font-size="11" opacity="0.8">State sharing between DAG nodes</text>

  <!-- Layer 3 -->
  <rect x="145" y="329" width="710" height="68" rx="8" fill="url(#g3)"/>
  <text x="165" y="356" fill="#fff" font-size="11" font-weight="bold" opacity="0.7">LAYER 3</text>
  <text x="165" y="374" fill="#fff" font-size="16" font-weight="bold">Communication</text>
  <text x="165" y="389" fill="#ddd" font-size="11">How do agents communicate?</text>
  <text x="830" y="364" text-anchor="end" fill="#fff" font-size="11" opacity="0.8">Message Bus | Typed Channels</text>
  <text x="830" y="382" text-anchor="end" fill="#fff" font-size="11" opacity="0.8">JSON Schema | Pub/Sub</text>

  <!-- Layer 2 -->
  <rect x="145" y="407" width="710" height="68" rx="8" fill="url(#g2)"/>
  <text x="165" y="434" fill="#fff" font-size="11" font-weight="bold" opacity="0.7">LAYER 2</text>
  <text x="165" y="452" fill="#fff" font-size="16" font-weight="bold">Capabilities</text>
  <text x="165" y="467" fill="#ddd" font-size="11">What can an agent do?</text>
  <text x="830" y="442" text-anchor="end" fill="#fff" font-size="11" opacity="0.8">Tools (MCP) | Skills | Code Mode</text>
  <text x="830" y="460" text-anchor="end" fill="#fff" font-size="11" opacity="0.8">Sandbox | Dynamic Tool Creation</text>

  <!-- Layer 1 -->
  <rect x="145" y="485" width="710" height="68" rx="8" fill="url(#g1)"/>
  <text x="165" y="512" fill="#fff" font-size="11" font-weight="bold" opacity="0.7">LAYER 1</text>
  <text x="165" y="530" fill="#fff" font-size="16" font-weight="bold">Agent Identity</text>
  <text x="165" y="545" fill="#ddd" font-size="11">Who is this agent?</text>
  <text x="830" y="520" text-anchor="end" fill="#fff" font-size="11" opacity="0.8">ID | Role | Model | Prompt | Output Contract</text>
  <text x="830" y="538" text-anchor="end" fill="#fff" font-size="11" opacity="0.8">Confidence 0.0-1.0 (Rule R17)</text>

  <!-- Layer 0 -->
  <rect x="145" y="563" width="710" height="68" rx="8" fill="url(#g0)"/>
  <text x="165" y="590" fill="#fff" font-size="11" font-weight="bold" opacity="0.7">LAYER 0</text>
  <text x="165" y="608" fill="#fff" font-size="16" font-weight="bold">Manifest</text>
  <text x="165" y="623" fill="#ddd" font-size="11">What is this workflow?</text>
  <text x="830" y="598" text-anchor="end" fill="#fff" font-size="11" opacity="0.8">Name | Version | Description</text>
  <text x="830" y="616" text-anchor="end" fill="#fff" font-size="11" opacity="0.8">Dependencies | Environment</text>

  <!-- Required markers -->
  <text x="450" y="660" text-anchor="middle" fill="#666" font-size="12">Layer 0 + 1 = always required | Layer 2-6 = opt-in | Security = cross-cutting</text>

  <!-- Arrows showing dependency -->
  <text x="450" y="690" text-anchor="middle" fill="#555" font-size="11">Higher layers depend on lower ones -- Observability requires Orchestration requires Identity requires Manifest</text>
</svg>