<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="is" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="2" result="offsetBlur"/>
      <feFlood flood-color="#000" flood-opacity="0.2" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="650" rx="12" fill="#0a0a1a"/>

  <text x="450" y="38" text-anchor="middle" fill="#e0e0e0" font-size="22" font-weight="bold">Impact Analysis: All Levels</text>
  <text x="450" y="60" text-anchor="middle" fill="#888" font-size="13">From individual productivity to societal transformation</text>

  <!-- Concentric circles concept -->
  <!-- Level 5: Society -->
  <ellipse cx="450" cy="370" rx="410" ry="240" fill="none" stroke="#9C27B0" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.4"/>
  <text x="450" y="140" text-anchor="middle" fill="#9C27B0" font-size="13" font-weight="bold">Society</text>

  <!-- Level 4: Industry -->
  <ellipse cx="450" cy="370" rx="340" ry="195" fill="none" stroke="#f44336" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.5"/>
  <text x="450" y="185" text-anchor="middle" fill="#f44336" font-size="13" font-weight="bold">Industry</text>

  <!-- Level 3: Organization -->
  <ellipse cx="450" cy="370" rx="265" ry="150" fill="none" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.6"/>
  <text x="450" y="232" text-anchor="middle" fill="#FF9800" font-size="13" font-weight="bold">Organization</text>

  <!-- Level 2: Team -->
  <ellipse cx="450" cy="370" rx="185" ry="105" fill="none" stroke="#4CAF50" stroke-width="2" opacity="0.7"/>
  <text x="450" y="278" text-anchor="middle" fill="#4CAF50" font-size="13" font-weight="bold">Team</text>

  <!-- Level 1: Individual (center) -->
  <ellipse cx="450" cy="370" rx="100" ry="55" fill="#1a1a2e" stroke="#4fc3f7" stroke-width="2.5"/>
  <text x="450" y="365" text-anchor="middle" fill="#4fc3f7" font-size="14" font-weight="bold">Individual</text>
  <text x="450" y="385" text-anchor="middle" fill="#aaa" font-size="10">Data Scientist</text>

  <!-- Annotations around the circles -->
  <!-- Individual -->
  <rect x="600" y="345" width="230" height="50" rx="6" fill="#111" stroke="#4fc3f7" stroke-width="1" filter="url(#is)"/>
  <text x="715" y="365" text-anchor="middle" fill="#4fc3f7" font-size="10" font-weight="bold">10x Productivity</text>
  <text x="715" y="382" text-anchor="middle" fill="#888" font-size="9">Routine analyses: hours -> minutes</text>
  <line x1="550" y1="370" x2="600" y2="370" stroke="#4fc3f7" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Team -->
  <rect x="65" y="265" width="230" height="50" rx="6" fill="#111" stroke="#4CAF50" stroke-width="1" filter="url(#is)"/>
  <text x="180" y="285" text-anchor="middle" fill="#4CAF50" font-size="10" font-weight="bold">Standardization &amp; Knowledge Transfer</text>
  <text x="180" y="302" text-anchor="middle" fill="#888" font-size="9">YAML workflows are self-documenting</text>
  <line x1="295" y1="310" x2="320" y2="330" stroke="#4CAF50" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Organization -->
  <rect x="620" y="225" width="230" height="55" rx="6" fill="#111" stroke="#FF9800" stroke-width="1" filter="url(#is)"/>
  <text x="735" y="245" text-anchor="middle" fill="#FF9800" font-size="10" font-weight="bold">Governance &amp; Cost Control</text>
  <text x="735" y="262" text-anchor="middle" fill="#888" font-size="9">Audit Trail + Budget Enforcement</text>
  <text x="735" y="274" text-anchor="middle" fill="#888" font-size="9">Time-to-insight: days -> minutes</text>
  <line x1="620" y1="260" x2="580" y2="290" stroke="#FF9800" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Industry -->
  <rect x="65" y="170" width="230" height="50" rx="6" fill="#111" stroke="#f44336" stroke-width="1" filter="url(#is)"/>
  <text x="180" y="190" text-anchor="middle" fill="#f44336" font-size="10" font-weight="bold">Open standard, no lock-in</text>
  <text x="180" y="207" text-anchor="middle" fill="#888" font-size="9">A0-A4 taxonomy as a common language</text>
  <line x1="295" y1="195" x2="340" y2="240" stroke="#f44336" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Society -->
  <rect x="600" y="120" width="250" height="55" rx="6" fill="#111" stroke="#9C27B0" stroke-width="1" filter="url(#is)"/>
  <text x="725" y="140" text-anchor="middle" fill="#9C27B0" font-size="10" font-weight="bold">Democratization + Transparency</text>
  <text x="725" y="157" text-anchor="middle" fill="#888" font-size="9">Powerful AI workflows for everyone</text>
  <text x="725" y="169" text-anchor="middle" fill="#888" font-size="9">Safety scales with autonomy</text>
  <line x1="600" y1="155" x2="560" y2="195" stroke="#9C27B0" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Bottom summary -->
  <rect x="100" y="590" width="700" height="40" rx="6" fill="#111" stroke="#555"/>
  <text x="450" y="615" text-anchor="middle" fill="#ccc" font-size="12">Each level benefits differently -- but the effect cascades from inside out</text>
</svg>