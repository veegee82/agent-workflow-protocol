<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="autoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#9C27B0;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="safeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#f44336;stop-opacity:0.4"/>
    </linearGradient>
  </defs>

  <rect width="900" height="520" rx="12" fill="#0a0a1a"/>

  <text x="450" y="35" text-anchor="middle" fill="#e0e0e0" font-size="22" font-weight="bold">Safety Scales with Autonomy</text>
  <text x="450" y="57" text-anchor="middle" fill="#888" font-size="13">The core design principle of AWP: More freedom requires proportionally more control</text>

  <!-- Axes -->
  <line x1="120" y1="430" x2="830" y2="430" stroke="#555" stroke-width="2"/>
  <line x1="120" y1="430" x2="120" y2="90" stroke="#555" stroke-width="2"/>

  <!-- X axis label -->
  <text x="475" y="470" text-anchor="middle" fill="#aaa" font-size="13" font-weight="bold">Autonomy Level</text>

  <!-- Y axis label -->
  <text x="50" y="260" text-anchor="middle" fill="#aaa" font-size="13" font-weight="bold" transform="rotate(-90,50,260)">Safety Requirements</text>

  <!-- Grid -->
  <line x1="120" y1="370" x2="830" y2="370" stroke="#222" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="120" y1="310" x2="830" y2="310" stroke="#222" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="120" y1="250" x2="830" y2="250" stroke="#222" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="120" y1="190" x2="830" y2="190" stroke="#222" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="120" y1="130" x2="830" y2="130" stroke="#222" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Y axis ticks -->
  <text x="110" y="374" text-anchor="end" fill="#666" font-size="10">Schema</text>
  <text x="110" y="314" text-anchor="end" fill="#666" font-size="10">Budget</text>
  <text x="110" y="254" text-anchor="end" fill="#666" font-size="10">Sandbox</text>
  <text x="110" y="194" text-anchor="end" fill="#666" font-size="10">Envelope</text>
  <text x="110" y="134" text-anchor="end" fill="#666" font-size="10">Observability</text>

  <!-- X axis ticks -->
  <text x="200" y="450" text-anchor="middle" fill="#2196F3" font-size="13" font-weight="bold">A0</text>
  <text x="355" y="450" text-anchor="middle" fill="#4CAF50" font-size="13" font-weight="bold">A1</text>
  <text x="510" y="450" text-anchor="middle" fill="#FF9800" font-size="13" font-weight="bold">A2</text>
  <text x="665" y="450" text-anchor="middle" fill="#f44336" font-size="13" font-weight="bold">A3</text>
  <text x="810" y="450" text-anchor="middle" fill="#9C27B0" font-size="13" font-weight="bold">A4</text>

  <!-- Area fill under curve -->
  <path d="M 200,400 L 355,390 L 510,290 L 665,180 L 810,110 L 810,430 L 200,430 Z" fill="url(#safeGrad)" opacity="0.5"/>

  <!-- The safety curve -->
  <path d="M 200,400 L 355,390 L 510,290 L 665,180 L 810,110" stroke="#ff6b6b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data points -->
  <circle cx="200" cy="400" r="8" fill="#2196F3" stroke="#fff" stroke-width="2"/>
  <circle cx="355" cy="390" r="8" fill="#4CAF50" stroke="#fff" stroke-width="2"/>
  <circle cx="510" cy="290" r="8" fill="#FF9800" stroke="#fff" stroke-width="2"/>
  <circle cx="665" cy="180" r="8" fill="#f44336" stroke="#fff" stroke-width="2"/>
  <circle cx="810" cy="110" r="8" fill="#9C27B0" stroke="#fff" stroke-width="2"/>

  <!-- Annotations -->
  <text x="200" y="393" text-anchor="middle" fill="#2196F3" font-size="9">Schema</text>
  <text x="200" y="383" text-anchor="middle" fill="#2196F3" font-size="9">Validation</text>

  <text x="355" y="380" text-anchor="middle" fill="#4CAF50" font-size="9">+ State</text>
  <text x="355" y="370" text-anchor="middle" fill="#4CAF50" font-size="9">Sharing</text>

  <text x="510" y="278" text-anchor="middle" fill="#FF9800" font-size="9">+ Budget</text>
  <text x="510" y="268" text-anchor="middle" fill="#FF9800" font-size="9">Enforcement</text>

  <text x="665" y="168" text-anchor="middle" fill="#f44336" font-size="9">+ Immutable</text>
  <text x="665" y="158" text-anchor="middle" fill="#f44336" font-size="9">Safety Envelope</text>

  <text x="810" y="100" text-anchor="middle" fill="#9C27B0" font-size="9">+ Full</text>
  <text x="810" y="90" text-anchor="middle" fill="#9C27B0" font-size="9">Observability</text>

  <!-- Key insight box -->
  <rect x="140" y="485" width="680" height="25" rx="4" fill="#111" stroke="#555"/>
  <text x="480" y="502" text-anchor="middle" fill="#ccc" font-size="11">No level can be skipped: A3 includes A2 budget + its own envelope. A4 includes everything.</text>
</svg>