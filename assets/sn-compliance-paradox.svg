<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="gGray" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#37474f"/>
      <stop offset="100%" style="stop-color:#546e7a"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b71c1c"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
    <linearGradient id="gA0" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1b5e20"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <linearGradient id="gA1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2e7d32"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
    <linearGradient id="gA2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#388e3c"/>
      <stop offset="100%" style="stop-color:#43a047"/>
    </linearGradient>
    <linearGradient id="gA3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#43a047"/>
      <stop offset="100%" style="stop-color:#4caf50"/>
    </linearGradient>
    <linearGradient id="gA4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#66bb6a"/>
    </linearGradient>
    <linearGradient id="gArrowUp" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1b5e20"/>
      <stop offset="100%" style="stop-color:#66bb6a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="2" dy="3" result="offsetBlur"/>
      <feFlood flood-color="#000" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="#ef5350"/>
    </marker>
    <marker id="arrowGreenUp" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="#66bb6a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="450" rx="12" fill="#0a0a1a"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#e0e0e0" font-size="22" font-weight="bold">The Compliance Paradox</text>
  <text x="500" y="60" text-anchor="middle" fill="#888" font-size="13">Why enterprises need graduated trust, not binary choices</text>

  <!-- Divider -->
  <line x1="490" y1="80" x2="490" y2="430" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ===== LEFT PANEL: Without AWP ===== -->
  <text x="240" y="95" text-anchor="middle" fill="#ef5350" font-size="16" font-weight="bold">Without AWP: Binary Choice</text>

  <!-- No AI Agents box (gray) -->
  <rect x="50" y="130" width="380" height="100" rx="10" fill="url(#gGray)" filter="url(#shadow)"/>
  <text x="240" y="165" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">No AI Agents</text>
  <text x="240" y="188" text-anchor="middle" fill="#b0bec5" font-size="13">Safe but slow</text>
  <text x="240" y="210" text-anchor="middle" fill="#78909c" font-size="11">Manual processes, full human oversight, no automation</text>

  <!-- Unrestricted Agents box (red) -->
  <rect x="50" y="260" width="380" height="100" rx="10" fill="url(#gRed)" filter="url(#shadow)"/>
  <text x="240" y="295" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">Unrestricted Agents</text>
  <text x="240" y="318" text-anchor="middle" fill="#ef9a9a" font-size="13">Fast but risky</text>
  <text x="240" y="340" text-anchor="middle" fill="#e57373" font-size="11">No guardrails, no budget limits, no audit trail</text>

  <!-- Arrow pointing to gray box -->
  <path d="M440,310 Q460,310 460,230 Q460,180 440,180" fill="none" stroke="#ef5350" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="467" y="230" fill="#ef5350" font-size="11" font-weight="bold" transform="rotate(-90,467,230)">enterprise chooses</text>

  <!-- X mark on red box -->
  <text x="420" y="310" fill="#ef5350" font-size="28" font-weight="bold" opacity="0.6">X</text>

  <!-- Check on gray box -->
  <text x="415" y="185" fill="#78909c" font-size="22" font-weight="bold" opacity="0.6">?</text>

  <!-- ===== RIGHT PANEL: With AWP ===== -->
  <text x="740" y="95" text-anchor="middle" fill="#66bb6a" font-size="16" font-weight="bold">With AWP: Graduated Trust</text>

  <!-- A0 -->
  <rect x="540" y="320" width="340" height="44" rx="8" fill="url(#gA0)" filter="url(#shadow)"/>
  <text x="560" y="347" fill="#a5d6a7" font-size="12" font-weight="bold">A0</text>
  <text x="590" y="347" fill="#fff" font-size="13" font-weight="bold">Prescribed</text>
  <text x="860" y="347" text-anchor="end" fill="#c8e6c9" font-size="10">Fixed DAG, no decisions</text>

  <!-- A1 -->
  <rect x="540" y="268" width="340" height="44" rx="8" fill="url(#gA1)" filter="url(#shadow)"/>
  <text x="560" y="295" fill="#a5d6a7" font-size="12" font-weight="bold">A1</text>
  <text x="590" y="295" fill="#fff" font-size="13" font-weight="bold">Adaptive</text>
  <text x="860" y="295" text-anchor="end" fill="#c8e6c9" font-size="10">Branching on confidence</text>

  <!-- A2 -->
  <rect x="540" y="216" width="340" height="44" rx="8" fill="url(#gA2)" filter="url(#shadow)"/>
  <text x="560" y="243" fill="#fff" font-size="12" font-weight="bold">A2</text>
  <text x="590" y="243" fill="#fff" font-size="13" font-weight="bold">Delegation</text>
  <text x="860" y="243" text-anchor="end" fill="#e8f5e9" font-size="10">Manager-worker loops</text>

  <!-- A3 -->
  <rect x="540" y="164" width="340" height="44" rx="8" fill="url(#gA3)" filter="url(#shadow)"/>
  <text x="560" y="191" fill="#fff" font-size="12" font-weight="bold">A3</text>
  <text x="590" y="191" fill="#fff" font-size="13" font-weight="bold">Tool Creation</text>
  <text x="860" y="191" text-anchor="end" fill="#e8f5e9" font-size="10">Dynamic tool creation</text>

  <!-- A4 -->
  <rect x="540" y="112" width="340" height="44" rx="8" fill="url(#gA4)" filter="url(#shadow)"/>
  <text x="560" y="139" fill="#fff" font-size="12" font-weight="bold">A4</text>
  <text x="590" y="139" fill="#fff" font-size="13" font-weight="bold">Self-Organizing</text>
  <text x="860" y="139" text-anchor="end" fill="#e8f5e9" font-size="10">Recursive delegation</text>

  <!-- Upward arrow showing progression -->
  <line x1="910" y1="355" x2="910" y2="125" stroke="url(#gArrowUp)" stroke-width="3" marker-end="url(#arrowGreenUp)"/>
  <text x="935" y="200" fill="#66bb6a" font-size="11" font-weight="bold" transform="rotate(-90,935,200)">Increasing Autonomy</text>
  <text x="955" y="200" fill="#888" font-size="9" transform="rotate(-90,955,200)">Each level adds capabilities + guardrails</text>

  <!-- Bottom summary -->
  <rect x="540" y="385" width="340" height="45" rx="8" fill="#1a1a2e" opacity="0.7"/>
  <text x="710" y="405" text-anchor="middle" fill="#a5d6a7" font-size="11" font-weight="bold">Start at A0, graduate upward as trust grows</text>
  <text x="710" y="420" text-anchor="middle" fill="#888" font-size="10">Budget limits + validation gates at every level</text>

  <!-- Left bottom summary -->
  <rect x="50" y="385" width="380" height="45" rx="8" fill="#1a1a2e" opacity="0.7"/>
  <text x="240" y="405" text-anchor="middle" fill="#ef5350" font-size="11" font-weight="bold">Result: most enterprises choose "no agents"</text>
  <text x="240" y="420" text-anchor="middle" fill="#888" font-size="10">Missing out on automation benefits entirely</text>
</svg>