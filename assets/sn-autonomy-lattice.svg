<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <!-- A0: Green -->
    <linearGradient id="a0-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a6b40"/>
      <stop offset="100%" style="stop-color:#2d8659"/>
    </linearGradient>
    <!-- A1: Teal/blue-green -->
    <linearGradient id="a1-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f6674"/>
      <stop offset="100%" style="stop-color:#1a8a9e"/>
    </linearGradient>
    <!-- A2: Blue -->
    <linearGradient id="a2-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a5ab8"/>
      <stop offset="100%" style="stop-color:#2979d6"/>
    </linearGradient>
    <!-- A3: Orange/pink -->
    <linearGradient id="a3-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c44020"/>
      <stop offset="100%" style="stop-color:#e94560"/>
    </linearGradient>
    <!-- A4: Purple -->
    <linearGradient id="a4-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c3ec7"/>
      <stop offset="100%" style="stop-color:#9b59b6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="2" dy="3" result="offsetBlur"/>
      <feFlood flood-color="#000" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="0" result="offsetBlur"/>
      <feFlood flood-color="#2d8659" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset dx="0" dy="0" result="offsetBlur"/>
      <feFlood flood-color="#9b59b6" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr-up" viewBox="0 0 10 7" refX="5" refY="0" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 7, 5 0, 10 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" rx="12" fill="#0a0a1a"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#e0e0e0" font-size="22" font-weight="bold">The Autonomy Lattice</text>
  <text x="450" y="60" text-anchor="middle" fill="#888" font-size="13">Each level gains capabilities but requires stronger safety guarantees</text>

  <!-- Column headers -->
  <text x="120" y="88" text-anchor="middle" fill="#aaa" font-size="12" font-weight="bold">LEVEL</text>
  <text x="390" y="88" text-anchor="middle" fill="#7bc67e" font-size="12" font-weight="bold">CAPABILITIES GAINED</text>
  <text x="720" y="88" text-anchor="middle" fill="#e94560" font-size="12" font-weight="bold">SAFETY REQUIREMENTS</text>

  <!-- Divider line -->
  <line x1="40" y1="96" x2="860" y2="96" stroke="#333" stroke-width="1"/>

  <!-- Up arrows on left side -->
  <line x1="40" y1="530" x2="40" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#arr-up)"/>
  <text x="36" y="330" text-anchor="middle" fill="#555" font-size="10" font-weight="bold" transform="rotate(-90,36,330)">INCREASING AUTONOMY</text>

  <!-- ===== A0 (bottom) ===== -->
  <rect x="70" y="495" width="100" height="60" rx="8" fill="url(#a0-grad)" filter="url(#shadow)"/>
  <text x="120" y="522" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">A0</text>
  <text x="120" y="542" text-anchor="middle" fill="#ddd" font-size="10">Prescribed</text>

  <!-- Capabilities -->
  <rect x="200" y="500" width="350" height="50" rx="6" fill="#0f1f15" stroke="#2d8659" stroke-width="1" filter="url(#shadow)"/>
  <text x="215" y="521" fill="#7bc67e" font-size="13" font-weight="bold">Fixed topology</text>
  <text x="215" y="538" fill="#5a9a6a" font-size="11">DAG execution, deterministic ordering</text>

  <!-- Safety -->
  <rect x="570" y="500" width="280" height="50" rx="6" fill="#1f0f0f" stroke="#e94560" stroke-width="1" filter="url(#shadow)"/>
  <text x="585" y="521" fill="#e94560" font-size="13" font-weight="bold">Schema validation</text>
  <text x="585" y="538" fill="#c05050" font-size="11">Rules R1-R10, type checking</text>

  <!-- Arrow A0 -> A1 -->
  <line x1="120" y1="492" x2="120" y2="462" stroke="#444" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- ===== A1 ===== -->
  <rect x="60" y="398" width="120" height="60" rx="8" fill="url(#a1-grad)" filter="url(#shadow)"/>
  <text x="120" y="425" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">A1</text>
  <text x="120" y="445" text-anchor="middle" fill="#ddd" font-size="10">Branching</text>

  <!-- Capabilities -->
  <rect x="200" y="403" width="350" height="50" rx="6" fill="#0f1a1f" stroke="#1a8a9e" stroke-width="1" filter="url(#shadow)"/>
  <text x="215" y="424" fill="#4fc3f7" font-size="13" font-weight="bold">Branching logic</text>
  <text x="215" y="441" fill="#3a9ab0" font-size="11">Conditional paths, state-dependent routing</text>

  <!-- Safety -->
  <rect x="570" y="403" width="280" height="50" rx="6" fill="#1f0f0f" stroke="#e94560" stroke-width="1" filter="url(#shadow)"/>
  <text x="585" y="424" fill="#e94560" font-size="13" font-weight="bold">+ State validation</text>
  <text x="585" y="441" fill="#c05050" font-size="11">R11-R15, share_output contracts</text>

  <!-- Arrow A1 -> A2 -->
  <line x1="120" y1="395" x2="120" y2="365" stroke="#444" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- ===== A2 ===== -->
  <rect x="50" y="301" width="140" height="60" rx="8" fill="url(#a2-grad)" filter="url(#shadow)"/>
  <text x="120" y="328" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">A2</text>
  <text x="120" y="348" text-anchor="middle" fill="#ddd" font-size="10">Delegation</text>

  <!-- Capabilities -->
  <rect x="200" y="306" width="350" height="50" rx="6" fill="#0f0f1f" stroke="#2979d6" stroke-width="1" filter="url(#shadow)"/>
  <text x="215" y="327" fill="#4fc3f7" font-size="13" font-weight="bold">Dynamic agents</text>
  <text x="215" y="344" fill="#3a7ab0" font-size="11">Manager spawns ephemeral workers at runtime</text>

  <!-- Safety -->
  <rect x="570" y="306" width="280" height="50" rx="6" fill="#1f0f0f" stroke="#e94560" stroke-width="1" filter="url(#shadow)"/>
  <text x="585" y="327" fill="#e94560" font-size="13" font-weight="bold">+ Budget system</text>
  <text x="585" y="344" fill="#c05050" font-size="11">max_loops, max_tokens, max_wall_time</text>

  <!-- Arrow A2 -> A3 -->
  <line x1="120" y1="298" x2="120" y2="268" stroke="#444" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- ===== A3 ===== -->
  <rect x="40" y="204" width="160" height="60" rx="8" fill="url(#a3-grad)" filter="url(#shadow)"/>
  <text x="120" y="231" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">A3</text>
  <text x="120" y="251" text-anchor="middle" fill="#ddd" font-size="10">Tool Creation</text>

  <!-- Capabilities -->
  <rect x="200" y="209" width="350" height="50" rx="6" fill="#1f150f" stroke="#e94560" stroke-width="1" filter="url(#shadow)"/>
  <text x="215" y="230" fill="#f5a623" font-size="13" font-weight="bold">Dynamic tools</text>
  <text x="215" y="247" fill="#c08030" font-size="11">Agents create new tools, code execution sandbox</text>

  <!-- Safety -->
  <rect x="570" y="209" width="280" height="50" rx="6" fill="#1f0f0f" stroke="#e94560" stroke-width="1" filter="url(#shadow)"/>
  <text x="585" y="230" fill="#e94560" font-size="13" font-weight="bold">+ Safety envelope</text>
  <text x="585" y="247" fill="#c05050" font-size="11">forbidden_tools, sandbox isolation, ACL</text>

  <!-- Arrow A3 -> A4 -->
  <line x1="120" y1="201" x2="120" y2="171" stroke="#444" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- ===== A4 (top) ===== -->
  <rect x="30" y="107" width="180" height="60" rx="8" fill="url(#a4-grad)" filter="url(#glow-purple)"/>
  <text x="120" y="134" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">A4</text>
  <text x="120" y="154" text-anchor="middle" fill="#ddd" font-size="10">Self-Organizing</text>

  <!-- Capabilities -->
  <rect x="200" y="112" width="350" height="50" rx="6" fill="#1a0f2a" stroke="#9b59b6" stroke-width="1" filter="url(#shadow)"/>
  <text x="215" y="133" fill="#d4b0ff" font-size="13" font-weight="bold">Dynamic hierarchy</text>
  <text x="215" y="150" fill="#9a70c0" font-size="11">Recursive delegation, emergent structure</text>

  <!-- Safety -->
  <rect x="570" y="112" width="280" height="50" rx="6" fill="#1f0f0f" stroke="#e94560" stroke-width="1" filter="url(#shadow)"/>
  <text x="585" y="133" fill="#e94560" font-size="13" font-weight="bold">+ Full observability</text>
  <text x="585" y="150" fill="#c05050" font-size="11">OTel tracing, audit trail, max_depth</text>

  <!-- Footer -->
  <text x="450" y="578" text-anchor="middle" fill="#555" font-size="11">Safety requirements are cumulative -- each level inherits all constraints from levels below</text>
</svg>