<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="gWarm1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#bf360c"/>
      <stop offset="100%" style="stop-color:#e65100"/>
    </linearGradient>
    <linearGradient id="gWarm2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d84315"/>
      <stop offset="100%" style="stop-color:#f4511e"/>
    </linearGradient>
    <linearGradient id="gWarm3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e64a19"/>
      <stop offset="100%" style="stop-color:#ff7043"/>
    </linearGradient>
    <linearGradient id="gCool1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d47a1"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <linearGradient id="gCool2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1565c0"/>
      <stop offset="100%" style="stop-color:#1e88e5"/>
    </linearGradient>
    <linearGradient id="gCool3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e88e5"/>
      <stop offset="100%" style="stop-color:#42a5f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="2" dy="3" result="offsetBlur"/>
      <feFlood flood-color="#000" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowWarm" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ff8a65"/>
    </marker>
    <marker id="arrowCool" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64b5f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="500" rx="12" fill="#0a0a1a"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" fill="#e0e0e0" font-size="22" font-weight="bold">Organizational Isomorphism</text>
  <text x="550" y="60" text-anchor="middle" fill="#888" font-size="13">Human org charts map directly to AWP A4 agent hierarchies</text>

  <!-- ===== LEFT: Human Organization ===== -->
  <text x="260" y="90" text-anchor="middle" fill="#ff8a65" font-size="15" font-weight="bold">Human Organization</text>

  <!-- CEO -->
  <rect x="195" y="105" width="130" height="36" rx="8" fill="url(#gWarm1)" filter="url(#shadow)"/>
  <text x="260" y="128" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">CEO</text>

  <!-- VPs -->
  <line x1="230" y1="141" x2="155" y2="175" stroke="#ff8a65" stroke-width="2" marker-end="url(#arrowWarm)"/>
  <line x1="290" y1="141" x2="365" y2="175" stroke="#ff8a65" stroke-width="2" marker-end="url(#arrowWarm)"/>

  <rect x="70" y="180" width="160" height="36" rx="8" fill="url(#gWarm2)" filter="url(#shadow)"/>
  <text x="150" y="203" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">VP Engineering</text>

  <rect x="280" y="180" width="160" height="36" rx="8" fill="url(#gWarm2)" filter="url(#shadow)"/>
  <text x="360" y="203" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">VP Analytics</text>

  <!-- Engineers -->
  <line x1="120" y1="216" x2="90" y2="260" stroke="#ff8a65" stroke-width="1.5" marker-end="url(#arrowWarm)"/>
  <line x1="180" y1="216" x2="215" y2="260" stroke="#ff8a65" stroke-width="1.5" marker-end="url(#arrowWarm)"/>

  <rect x="35" y="265" width="120" height="32" rx="7" fill="url(#gWarm3)" filter="url(#shadow)"/>
  <text x="95" y="286" text-anchor="middle" fill="#fff" font-size="11">Senior Engineer</text>

  <rect x="170" y="265" width="120" height="32" rx="7" fill="url(#gWarm3)" filter="url(#shadow)"/>
  <text x="230" y="286" text-anchor="middle" fill="#fff" font-size="11">Junior Engineer</text>

  <!-- Data team -->
  <line x1="330" y1="216" x2="300" y2="260" stroke="#ff8a65" stroke-width="1.5" marker-end="url(#arrowWarm)"/>
  <line x1="390" y1="216" x2="420" y2="260" stroke="#ff8a65" stroke-width="1.5" marker-end="url(#arrowWarm)"/>

  <rect x="245" y="265" width="120" height="32" rx="7" fill="url(#gWarm3)" filter="url(#shadow)"/>
  <text x="305" y="286" text-anchor="middle" fill="#fff" font-size="11">Data Scientist</text>

  <rect x="380" y="265" width="110" height="32" rx="7" fill="url(#gWarm3)" filter="url(#shadow)"/>
  <text x="435" y="286" text-anchor="middle" fill="#fff" font-size="11">Analyst</text>

  <!-- ===== RIGHT: AWP Agent Hierarchy ===== -->
  <text x="830" y="90" text-anchor="middle" fill="#64b5f6" font-size="15" font-weight="bold">AWP Agent Hierarchy (A4)</text>

  <!-- Root Manager -->
  <rect x="765" y="105" width="130" height="36" rx="8" fill="url(#gCool1)" filter="url(#shadow)"/>
  <text x="830" y="128" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Root Manager</text>

  <!-- Sub-managers -->
  <line x1="800" y1="141" x2="715" y2="175" stroke="#64b5f6" stroke-width="2" marker-end="url(#arrowCool)"/>
  <line x1="860" y1="141" x2="940" y2="175" stroke="#64b5f6" stroke-width="2" marker-end="url(#arrowCool)"/>

  <rect x="615" y="180" width="190" height="36" rx="8" fill="url(#gCool2)" filter="url(#shadow)"/>
  <text x="710" y="203" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Sub-Mgr Engineering</text>

  <rect x="845" y="180" width="175" height="36" rx="8" fill="url(#gCool2)" filter="url(#shadow)"/>
  <text x="933" y="203" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Sub-Mgr Analytics</text>

  <!-- Engineering workers -->
  <line x1="680" y1="216" x2="650" y2="260" stroke="#64b5f6" stroke-width="1.5" marker-end="url(#arrowCool)"/>
  <line x1="740" y1="216" x2="775" y2="260" stroke="#64b5f6" stroke-width="1.5" marker-end="url(#arrowCool)"/>

  <rect x="600" y="265" width="110" height="32" rx="7" fill="url(#gCool3)" filter="url(#shadow)"/>
  <text x="655" y="286" text-anchor="middle" fill="#fff" font-size="11">Code Gen</text>

  <rect x="725" y="265" width="110" height="32" rx="7" fill="url(#gCool3)" filter="url(#shadow)"/>
  <text x="780" y="286" text-anchor="middle" fill="#fff" font-size="11">Testing</text>

  <!-- Analytics workers -->
  <line x1="903" y1="216" x2="873" y2="260" stroke="#64b5f6" stroke-width="1.5" marker-end="url(#arrowCool)"/>
  <line x1="963" y1="216" x2="993" y2="260" stroke="#64b5f6" stroke-width="1.5" marker-end="url(#arrowCool)"/>

  <rect x="823" y="265" width="110" height="32" rx="7" fill="url(#gCool3)" filter="url(#shadow)"/>
  <text x="878" y="286" text-anchor="middle" fill="#fff" font-size="11">Statistical</text>

  <rect x="948" y="265" width="110" height="32" rx="7" fill="url(#gCool3)" filter="url(#shadow)"/>
  <text x="1003" y="286" text-anchor="middle" fill="#fff" font-size="11">Report</text>

  <!-- ===== Dashed lines between corresponding levels ===== -->
  <!-- CEO <-> Root Manager -->
  <line x1="325" y1="123" x2="765" y2="123" stroke="#888" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="545" y="118" text-anchor="middle" fill="#aaa" font-size="10" font-style="italic">Strategic direction</text>

  <!-- VP <-> Sub-Manager -->
  <line x1="440" y1="198" x2="615" y2="198" stroke="#888" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="528" y="193" text-anchor="middle" fill="#aaa" font-size="10" font-style="italic">Domain oversight</text>

  <!-- Workers <-> Workers -->
  <line x1="490" y1="281" x2="600" y2="281" stroke="#888" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="545" y="276" text-anchor="middle" fill="#aaa" font-size="10" font-style="italic">Task execution</text>

  <!-- ===== Level labels on right side ===== -->
  <rect x="30" y="330" width="1040" height="1" fill="#333"/>

  <!-- Bottom annotations -->
  <text x="550" y="360" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">Structural Parallels</text>

  <rect x="60" y="380" width="300" height="90" rx="8" fill="#1a1a2e" filter="url(#shadow)"/>
  <text x="210" y="403" text-anchor="middle" fill="#ff8a65" font-size="12" font-weight="bold">Span of Control</text>
  <text x="210" y="422" text-anchor="middle" fill="#bbb" font-size="11">Each manager oversees 2-7 reports</text>
  <text x="210" y="440" text-anchor="middle" fill="#bbb" font-size="11">in both human and agent orgs.</text>
  <text x="210" y="458" text-anchor="middle" fill="#888" font-size="10">max_total_workers enforces this</text>

  <rect x="400" y="380" width="300" height="90" rx="8" fill="#1a1a2e" filter="url(#shadow)"/>
  <text x="550" y="403" text-anchor="middle" fill="#64b5f6" font-size="12" font-weight="bold">Delegation Depth</text>
  <text x="550" y="422" text-anchor="middle" fill="#bbb" font-size="11">Sub-managers can spawn their own</text>
  <text x="550" y="440" text-anchor="middle" fill="#bbb" font-size="11">workers -- recursive like org trees.</text>
  <text x="550" y="458" text-anchor="middle" fill="#888" font-size="10">max_depth controls recursion limit</text>

  <rect x="740" y="380" width="300" height="90" rx="8" fill="#1a1a2e" filter="url(#shadow)"/>
  <text x="890" y="403" text-anchor="middle" fill="#ab47bc" font-size="12" font-weight="bold">Budget Partitioning</text>
  <text x="890" y="422" text-anchor="middle" fill="#bbb" font-size="11">Each level gets a budget slice, just</text>
  <text x="890" y="440" text-anchor="middle" fill="#bbb" font-size="11">like departmental cost centers.</text>
  <text x="890" y="458" text-anchor="middle" fill="#888" font-size="10">max_total_tokens splits across depth</text>
</svg>