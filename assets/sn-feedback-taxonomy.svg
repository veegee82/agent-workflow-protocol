<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="gA1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b5e20"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <linearGradient id="gA2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e65100"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <linearGradient id="gA3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ad1457"/>
      <stop offset="100%" style="stop-color:#e91e63"/>
    </linearGradient>
    <linearGradient id="gA4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a148c"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#66bb6a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ffa726"/>
    </marker>
    <marker id="arrowPink" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f48fb1"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ce93d8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" rx="12" fill="#0a0a1a"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#e0e0e0" font-size="22" font-weight="bold">Data Science Feedback Loop Taxonomy</text>
  <text x="500" y="62" text-anchor="middle" fill="#888" font-size="13">How each autonomy level handles iteration and self-correction</text>

  <!-- ===== A1 Conditional (top-left, green) ===== -->
  <rect x="30" y="85" width="460" height="230" rx="10" fill="url(#gA1)" filter="url(#shadow)" opacity="0.92"/>
  <rect x="30" y="85" width="460" height="30" rx="10" fill="none"/>
  <text x="50" y="108" fill="#a5d6a7" font-size="12" font-weight="bold">A1</text>
  <text x="75" y="108" fill="#fff" font-size="16" font-weight="bold">Conditional</text>
  <text x="460" y="108" text-anchor="end" fill="#a5d6a7" font-size="11">Prescribed branching</text>

  <!-- Flow boxes -->
  <rect x="60" y="130" width="120" height="40" rx="6" fill="#0a0a1a" opacity="0.5"/>
  <text x="120" y="155" text-anchor="middle" fill="#e0e0e0" font-size="12">Quality Check</text>

  <!-- pass arrow -->
  <line x1="180" y1="150" x2="240" y2="150" stroke="#66bb6a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="210" y="142" text-anchor="middle" fill="#a5d6a7" font-size="10">pass</text>

  <rect x="248" y="130" width="100" height="40" rx="6" fill="#0a0a1a" opacity="0.5"/>
  <text x="298" y="155" text-anchor="middle" fill="#66bb6a" font-size="12" font-weight="bold">Continue</text>

  <!-- fail arrow -->
  <line x1="120" y1="170" x2="120" y2="220" stroke="#ef5350" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="135" y="200" fill="#ef9a9a" font-size="10">fail</text>

  <rect x="60" y="228" width="120" height="40" rx="6" fill="#0a0a1a" opacity="0.5"/>
  <text x="120" y="253" text-anchor="middle" fill="#ef9a9a" font-size="12">Fallback Agent</text>

  <text x="260" y="200" fill="#c8e6c9" font-size="11" opacity="0.8">No loops -- single pass with</text>
  <text x="260" y="215" fill="#c8e6c9" font-size="11" opacity="0.8">conditional branching only.</text>
  <text x="260" y="235" fill="#c8e6c9" font-size="11" opacity="0.8">DAG engine selects path based</text>
  <text x="260" y="250" fill="#c8e6c9" font-size="11" opacity="0.8">on confidence threshold.</text>

  <!-- ===== A2 Iterative (top-right, orange) ===== -->
  <rect x="510" y="85" width="460" height="230" rx="10" fill="url(#gA2)" filter="url(#shadow)" opacity="0.92"/>
  <text x="530" y="108" fill="#ffe0b2" font-size="12" font-weight="bold">A2</text>
  <text x="555" y="108" fill="#fff" font-size="16" font-weight="bold">Iterative</text>
  <text x="940" y="108" text-anchor="end" fill="#ffe0b2" font-size="11">Manager-worker loop</text>

  <!-- Flow: Manager reviews -->
  <rect x="540" y="135" width="130" height="40" rx="6" fill="#0a0a1a" opacity="0.5"/>
  <text x="605" y="160" text-anchor="middle" fill="#e0e0e0" font-size="12">Manager Reviews</text>

  <!-- low conf arrow down -->
  <line x1="570" y1="175" x2="570" y2="220" stroke="#ffa726" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="545" y="200" fill="#ffe0b2" font-size="10">low</text>
  <text x="545" y="211" fill="#ffe0b2" font-size="10">conf</text>

  <!-- high conf arrow right -->
  <line x1="670" y1="155" x2="760" y2="155" stroke="#66bb6a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="715" y="147" text-anchor="middle" fill="#c8e6c9" font-size="10">high conf</text>

  <rect x="768" y="135" width="90" height="40" rx="6" fill="#0a0a1a" opacity="0.5"/>
  <text x="813" y="160" text-anchor="middle" fill="#66bb6a" font-size="12" font-weight="bold">Accept</text>

  <!-- Delegate rework -->
  <rect x="530" y="228" width="140" height="40" rx="6" fill="#0a0a1a" opacity="0.5"/>
  <text x="600" y="253" text-anchor="middle" fill="#ffa726" font-size="12">Delegate Rework</text>

  <!-- loop back arrow -->
  <path d="M670,248 Q740,248 740,200 Q740,145 670,145" fill="none" stroke="#ffa726" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
  <text x="752" y="200" fill="#ffe0b2" font-size="10">loop</text>

  <text x="540" y="290" fill="#fff3e0" font-size="11" opacity="0.8">Budget-bounded: max_loops, max_total_tokens</text>

  <!-- ===== A3 Adaptive (bottom-left, pink) ===== -->
  <rect x="30" y="335" width="460" height="240" rx="10" fill="url(#gA3)" filter="url(#shadow)" opacity="0.92"/>
  <text x="50" y="358" fill="#f8bbd0" font-size="12" font-weight="bold">A3</text>
  <text x="75" y="358" fill="#fff" font-size="16" font-weight="bold">Adaptive</text>
  <text x="460" y="358" text-anchor="end" fill="#f8bbd0" font-size="11">Dynamic tool creation</text>

  <rect x="55" y="380" width="140" height="36" rx="6" fill="#0a0a1a" opacity="0.5"/>
  <text x="125" y="403" text-anchor="middle" fill="#e0e0e0" font-size="11">Encounter Novel Pattern</text>

  <line x1="195" y1="398" x2="250" y2="398" stroke="#f48fb1" stroke-width="2" marker-end="url(#arrowPink)"/>

  <rect x="258" y="380" width="120" height="36" rx="6" fill="#0a0a1a" opacity="0.5"/>
  <text x="318" y="403" text-anchor="middle" fill="#f48fb1" font-size="11" font-weight="bold">Create New Tool</text>

  <line x1="318" y1="416" x2="318" y2="445" stroke="#f48fb1" stroke-width="2" marker-end="url(#arrowPink)"/>

  <rect x="258" y="452" width="120" height="36" rx="6" fill="#0a0a1a" opacity="0.5"/>
  <text x="318" y="475" text-anchor="middle" fill="#e0e0e0" font-size="11">Apply Tool</text>

  <line x1="318" y1="488" x2="318" y2="517" stroke="#f48fb1" stroke-width="2" marker-end="url(#arrowPink)"/>

  <rect x="230" y="524" width="175" height="36" rx="6" fill="#0a0a1a" opacity="0.5"/>
  <text x="318" y="547" text-anchor="middle" fill="#c8e6c9" font-size="11">Report + New Capabilities</text>

  <text x="55" y="445" fill="#fce4ec" font-size="11" opacity="0.8">Worker adapts</text>
  <text x="55" y="460" fill="#fce4ec" font-size="11" opacity="0.8">its own toolset</text>
  <text x="55" y="475" fill="#fce4ec" font-size="11" opacity="0.8">at runtime via</text>
  <text x="55" y="490" fill="#fce4ec" font-size="11" opacity="0.8">code_mode and</text>
  <text x="55" y="505" fill="#fce4ec" font-size="11" opacity="0.8">tool_creation.</text>

  <!-- ===== A4 Hierarchical (bottom-right, purple) ===== -->
  <rect x="510" y="335" width="460" height="240" rx="10" fill="url(#gA4)" filter="url(#shadow)" opacity="0.92"/>
  <text x="530" y="358" fill="#e1bee7" font-size="12" font-weight="bold">A4</text>
  <text x="555" y="358" fill="#fff" font-size="16" font-weight="bold">Hierarchical</text>
  <text x="940" y="358" text-anchor="end" fill="#e1bee7" font-size="11">Recursive delegation</text>

  <!-- Root manager -->
  <rect x="680" y="375" width="120" height="32" rx="6" fill="#0a0a1a" opacity="0.5"/>
  <text x="740" y="396" text-anchor="middle" fill="#ce93d8" font-size="12" font-weight="bold">Root Manager</text>

  <!-- Sub-managers -->
  <line x1="710" y1="407" x2="660" y2="430" stroke="#ce93d8" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <line x1="770" y1="407" x2="820" y2="430" stroke="#ce93d8" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <rect x="600" y="435" width="120" height="30" rx="6" fill="#0a0a1a" opacity="0.5"/>
  <text x="660" y="455" text-anchor="middle" fill="#e0e0e0" font-size="10">Sub-Mgr Region A</text>

  <rect x="760" y="435" width="120" height="30" rx="6" fill="#0a0a1a" opacity="0.5"/>
  <text x="820" y="455" text-anchor="middle" fill="#e0e0e0" font-size="10">Sub-Mgr Region B</text>

  <!-- Workers -->
  <line x1="640" y1="465" x2="610" y2="490" stroke="#ce93d8" stroke-width="1" marker-end="url(#arrowPurple)"/>
  <line x1="680" y1="465" x2="710" y2="490" stroke="#ce93d8" stroke-width="1" marker-end="url(#arrowPurple)"/>
  <line x1="800" y1="465" x2="775" y2="490" stroke="#ce93d8" stroke-width="1" marker-end="url(#arrowPurple)"/>
  <line x1="840" y1="465" x2="870" y2="490" stroke="#ce93d8" stroke-width="1" marker-end="url(#arrowPurple)"/>

  <rect x="580" y="495" width="60" height="26" rx="5" fill="#0a0a1a" opacity="0.5"/>
  <text x="610" y="513" text-anchor="middle" fill="#e0e0e0" font-size="9">Worker</text>
  <rect x="680" y="495" width="60" height="26" rx="5" fill="#0a0a1a" opacity="0.5"/>
  <text x="710" y="513" text-anchor="middle" fill="#e0e0e0" font-size="9">Worker</text>
  <rect x="748" y="495" width="60" height="26" rx="5" fill="#0a0a1a" opacity="0.5"/>
  <text x="778" y="513" text-anchor="middle" fill="#e0e0e0" font-size="9">Worker</text>
  <rect x="842" y="495" width="60" height="26" rx="5" fill="#0a0a1a" opacity="0.5"/>
  <text x="872" y="513" text-anchor="middle" fill="#e0e0e0" font-size="9">Worker</text>

  <!-- Results cascade back -->
  <path d="M610,521 Q610,545 740,545 Q870,545 870,521" fill="none" stroke="#a5d6a7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="740" y="560" text-anchor="middle" fill="#a5d6a7" font-size="10">Results cascade back up through hierarchy</text>

  <text x="530" y="415" fill="#e1bee7" font-size="11" opacity="0.8">Recursive</text>
  <text x="530" y="430" fill="#e1bee7" font-size="11" opacity="0.8">sub-managers</text>
  <text x="530" y="445" fill="#e1bee7" font-size="11" opacity="0.8">spawn their</text>
  <text x="530" y="460" fill="#e1bee7" font-size="11" opacity="0.8">own workers</text>
  <text x="530" y="475" fill="#e1bee7" font-size="11" opacity="0.8">with budget</text>
  <text x="530" y="490" fill="#e1bee7" font-size="11" opacity="0.8">partitioning.</text>
</svg>