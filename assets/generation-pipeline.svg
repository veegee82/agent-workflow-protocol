<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="gp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gp-user" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="gp-llm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="gp-phase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="gp-output" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="gp-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="520" fill="url(#gp-bg)" rx="12"/>

  <text x="450" y="38" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">Workflow Generation Pipeline</text>
  <text x="450" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Natural language → LLM analysis → validated workflow files</text>

  <!-- Step 1: User Input -->
  <rect x="30" y="80" width="160" height="90" rx="10" fill="url(#gp-user)" opacity="0.9"/>
  <text x="110" y="108" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">User Input</text>
  <text x="110" y="128" text-anchor="middle" fill="#e0e7ff" font-size="10">"Build a research</text>
  <text x="110" y="142" text-anchor="middle" fill="#e0e7ff" font-size="10">pipeline that analyzes</text>
  <text x="110" y="156" text-anchor="middle" fill="#e0e7ff" font-size="10">market trends"</text>

  <!-- Arrow 1 -->
  <line x1="190" y1="125" x2="225" y2="125" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-gp)"/>
  <defs><marker id="arrow-gp" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#94a3b8"/></marker></defs>

  <!-- Step 2: Pattern Detection -->
  <rect x="230" y="80" width="160" height="90" rx="10" fill="url(#gp-llm)" opacity="0.9"/>
  <text x="310" y="105" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="700">Phase 0: Analysis</text>
  <text x="310" y="122" text-anchor="middle" fill="#451a03" font-size="10">Pattern detection</text>
  <text x="310" y="136" text-anchor="middle" fill="#451a03" font-size="10">Autonomy level → A2</text>
  <text x="310" y="150" text-anchor="middle" fill="#451a03" font-size="10">Engine → delegation_loop</text>
  <text x="310" y="164" text-anchor="middle" fill="#451a03" font-size="10">Capability planning</text>

  <!-- Arrow 2 -->
  <line x1="390" y1="125" x2="425" y2="125" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-gp)"/>

  <!-- Step 3: Interactive Plan -->
  <rect x="430" y="80" width="160" height="90" rx="10" fill="url(#gp-phase)" opacity="0.9"/>
  <text x="510" y="105" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Phase 1-2: Plan</text>
  <text x="510" y="122" text-anchor="middle" fill="#d1fae5" font-size="10">Questionnaire</text>
  <text x="510" y="136" text-anchor="middle" fill="#d1fae5" font-size="10">Architecture design</text>
  <text x="510" y="150" text-anchor="middle" fill="#d1fae5" font-size="10">Data flow contracts</text>
  <text x="510" y="164" text-anchor="middle" fill="#d1fae5" font-size="10">User validation ✓</text>

  <!-- Arrow 3 -->
  <line x1="590" y1="125" x2="625" y2="125" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-gp)"/>

  <!-- Step 4: File Generation -->
  <rect x="630" y="80" width="160" height="90" rx="10" fill="url(#gp-output)" opacity="0.9"/>
  <text x="710" y="105" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Phase 3: Generate</text>
  <text x="710" y="122" text-anchor="middle" fill="#fce7f3" font-size="10">workflow.awp.yaml</text>
  <text x="710" y="136" text-anchor="middle" fill="#fce7f3" font-size="10">agent configs + code</text>
  <text x="710" y="150" text-anchor="middle" fill="#fce7f3" font-size="10">prompts + schemas</text>
  <text x="710" y="164" text-anchor="middle" fill="#fce7f3" font-size="10">tools + skills</text>

  <!-- LLM brain in center -->
  <rect x="250" y="210" width="400" height="55" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="450" y="234" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">LLM decides architecture at every stage</text>
  <text x="450" y="252" text-anchor="middle" fill="#94a3b8" font-size="10">Pattern → Autonomy Level → Engine → Agents → Tools → Budget → Files</text>

  <!-- Bottom: Output file tree -->
  <rect x="30" y="290" width="840" height="210" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="50" y="315" fill="#e2e8f0" font-size="13" font-weight="700">Generated Output</text>

  <!-- Column 1: Structure -->
  <text x="50" y="340" fill="#6366f1" font-size="11" font-weight="600">Workflow Structure</text>
  <text x="50" y="358" fill="#94a3b8" font-size="10" font-family="monospace">workflow.awp.yaml</text>
  <text x="50" y="374" fill="#64748b" font-size="9">  manifest, graph, orchestration</text>
  <text x="50" y="392" fill="#64748b" font-size="9">  budget, safety, state sharing</text>
  <text x="50" y="410" fill="#94a3b8" font-size="10" font-family="monospace">agents/{id}/agent.awp.yaml</text>
  <text x="50" y="426" fill="#64748b" font-size="9">  identity, capabilities, tools</text>

  <!-- Column 2: Intelligence -->
  <text x="310" y="340" fill="#f59e0b" font-size="11" font-weight="600">Agent Intelligence</text>
  <text x="310" y="358" fill="#94a3b8" font-size="10" font-family="monospace">SYSTEM_PROMPT.md</text>
  <text x="310" y="374" fill="#64748b" font-size="9">  role, responsibilities, format</text>
  <text x="310" y="392" fill="#94a3b8" font-size="10" font-family="monospace">output_schema.json</text>
  <text x="310" y="408" fill="#64748b" font-size="9">  typed contract with confidence</text>
  <text x="310" y="426" fill="#94a3b8" font-size="10" font-family="monospace">skills/SKILL.md</text>
  <text x="310" y="442" fill="#64748b" font-size="9">  domain knowledge injection</text>

  <!-- Column 3: Runtime -->
  <text x="580" y="340" fill="#10b981" font-size="11" font-weight="600">Runtime &amp; Tools</text>
  <text x="580" y="358" fill="#94a3b8" font-size="10" font-family="monospace">agent.py</text>
  <text x="580" y="374" fill="#64748b" font-size="9">  StandaloneAgent subclass</text>
  <text x="580" y="392" fill="#94a3b8" font-size="10" font-family="monospace">mcp/*.py</text>
  <text x="580" y="408" fill="#64748b" font-size="9">  tool implementations</text>
  <text x="580" y="426" fill="#94a3b8" font-size="10" font-family="monospace">secrets.yaml.example</text>
  <text x="580" y="442" fill="#64748b" font-size="9">  API key placeholders</text>

  <!-- Validation badge -->
  <rect x="630" y="460" width="230" height="30" rx="6" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="745" y="480" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">Phase 4: awp validate → R1-R26 ✓</text>
</svg>