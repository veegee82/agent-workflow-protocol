<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="gOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e65100"/>
      <stop offset="100%" style="stop-color:#bf360c"/>
    </linearGradient>
    <linearGradient id="gOrangeLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff8f00"/>
      <stop offset="100%" style="stop-color:#e65100"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00695c"/>
      <stop offset="100%" style="stop-color:#004d40"/>
    </linearGradient>
    <linearGradient id="gTealLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#26a69a"/>
      <stop offset="100%" style="stop-color:#00897b"/>
    </linearGradient>
    <linearGradient id="gTealNode" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00bfa5"/>
      <stop offset="100%" style="stop-color:#00897b"/>
    </linearGradient>
    <linearGradient id="gValidation" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#66bb6a"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="2" dy="3" result="offsetBlur"/>
      <feFlood flood-color="#000" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef5350"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="500" rx="12" fill="#0a0a1a"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" fill="#e0e0e0" font-size="22" font-weight="bold">Notebook vs Cognitive Pipeline</text>
  <text x="550" y="58" text-anchor="middle" fill="#888" font-size="13">From linear single-intelligence to graph-based multi-intelligence</text>

  <!-- Divider line -->
  <line x1="545" y1="75" x2="545" y2="480" stroke="#333" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="545" y="490" text-anchor="middle" fill="#555" font-size="10">VS</text>

  <!-- ==================== LEFT PANEL: Traditional Notebook ==================== -->
  <rect x="20" y="75" width="510" height="400" rx="10" fill="#0d0d1f" stroke="#e65100" stroke-width="1" opacity="0.6"/>
  <text x="275" y="100" text-anchor="middle" fill="#ff8f00" font-size="16" font-weight="bold">Traditional Notebook</text>

  <!-- Person icon -->
  <circle cx="70" cy="270" r="15" fill="none" stroke="#ff8f00" stroke-width="2"/>
  <line x1="70" y1="285" x2="70" y2="320" stroke="#ff8f00" stroke-width="2"/>
  <line x1="55" y1="300" x2="85" y2="300" stroke="#ff8f00" stroke-width="2"/>
  <line x1="70" y1="320" x2="55" y2="345" stroke="#ff8f00" stroke-width="2"/>
  <line x1="70" y1="320" x2="85" y2="345" stroke="#ff8f00" stroke-width="2"/>
  <text x="70" y="365" text-anchor="middle" fill="#ff8f00" font-size="9">Single User</text>

  <!-- Vertical line connecting cells -->
  <line x1="300" y1="140" x2="300" y2="420" stroke="#e65100" stroke-width="2" opacity="0.3"/>

  <!-- Cell 1: Load -->
  <rect x="200" y="120" width="200" height="45" rx="8" fill="url(#gOrangeLight)" filter="url(#shadow)"/>
  <text x="210" y="140" fill="#fff" font-size="10" opacity="0.7">[1]</text>
  <text x="300" y="148" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Load Data</text>

  <!-- Cell 2: Clean -->
  <rect x="200" y="180" width="200" height="45" rx="8" fill="url(#gOrangeLight)" filter="url(#shadow)"/>
  <text x="210" y="200" fill="#fff" font-size="10" opacity="0.7">[2]</text>
  <text x="300" y="208" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Clean</text>

  <!-- Cell 3: Stats -->
  <rect x="200" y="240" width="200" height="45" rx="8" fill="url(#gOrangeLight)" filter="url(#shadow)"/>
  <text x="210" y="260" fill="#fff" font-size="10" opacity="0.7">[3]</text>
  <text x="300" y="268" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Statistics</text>

  <!-- Cell 4: Viz -->
  <rect x="200" y="300" width="200" height="45" rx="8" fill="url(#gOrangeLight)" filter="url(#shadow)"/>
  <text x="210" y="320" fill="#fff" font-size="10" opacity="0.7">[4]</text>
  <text x="300" y="328" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Visualize</text>

  <!-- Cell 5: Interpret -->
  <rect x="200" y="360" width="200" height="45" rx="8" fill="url(#gOrangeLight)" filter="url(#shadow)"/>
  <text x="210" y="380" fill="#fff" font-size="10" opacity="0.7">[5]</text>
  <text x="300" y="388" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Interpret</text>

  <!-- Down arrows between cells -->
  <line x1="300" y1="165" x2="300" y2="175" stroke="#888" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="300" y1="225" x2="300" y2="235" stroke="#888" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="300" y1="285" x2="300" y2="295" stroke="#888" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="300" y1="345" x2="300" y2="355" stroke="#888" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Label -->
  <rect x="130" y="425" width="280" height="30" rx="6" fill="#1a1a2e" stroke="#ff8f00" stroke-width="1"/>
  <text x="270" y="445" text-anchor="middle" fill="#ff8f00" font-size="12" font-weight="bold">Linear, Single-Intelligence</text>

  <!-- ==================== RIGHT PANEL: AWP Cognitive Pipeline ==================== -->
  <rect x="560" y="75" width="525" height="400" rx="10" fill="#0d0d1f" stroke="#00897b" stroke-width="1" opacity="0.6"/>
  <text x="822" y="100" text-anchor="middle" fill="#26a69a" font-size="16" font-weight="bold">AWP Cognitive Pipeline</text>

  <!-- Dataset node -->
  <rect x="580" y="120" width="100" height="35" rx="8" fill="url(#gTealNode)" filter="url(#shadow)"/>
  <text x="630" y="142" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Dataset</text>

  <!-- Ingestion node -->
  <rect x="710" y="120" width="100" height="35" rx="8" fill="url(#gTealNode)" filter="url(#shadow)"/>
  <text x="760" y="142" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Ingestion</text>

  <!-- Cleaning node -->
  <rect x="840" y="120" width="100" height="35" rx="8" fill="url(#gTealNode)" filter="url(#shadow)"/>
  <text x="890" y="142" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Cleaning</text>

  <!-- Arrows: Dataset -> Ingestion -> Cleaning -->
  <line x1="680" y1="138" x2="705" y2="138" stroke="#888" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="810" y1="138" x2="835" y2="138" stroke="#888" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- Branch nodes -->
  <!-- Statistical -->
  <rect x="600" y="200" width="115" height="35" rx="8" fill="url(#gTealNode)" filter="url(#shadow)"/>
  <text x="657" y="222" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Statistical</text>

  <!-- Visualization -->
  <rect x="740" y="200" width="115" height="35" rx="8" fill="url(#gTealNode)" filter="url(#shadow)"/>
  <text x="797" y="222" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Visualization</text>

  <!-- Feature Engineering -->
  <rect x="880" y="200" width="135" height="35" rx="8" fill="url(#gTealNode)" filter="url(#shadow)"/>
  <text x="947" y="222" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">Feature Eng.</text>

  <!-- Arrows from Cleaning to branches -->
  <line x1="870" y1="155" x2="657" y2="195" stroke="#888" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="890" y1="155" x2="797" y2="195" stroke="#888" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="910" y1="155" x2="947" y2="195" stroke="#888" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- Validation Agent -->
  <rect x="720" y="280" width="140" height="40" rx="8" fill="url(#gValidation)" filter="url(#shadow)"/>
  <text x="790" y="300" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Validation Agent</text>
  <text x="790" y="313" text-anchor="middle" fill="#dfd" font-size="9">confidence gate</text>

  <!-- Arrows from branches to Validation -->
  <line x1="657" y1="235" x2="755" y2="275" stroke="#888" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="797" y1="235" x2="790" y2="275" stroke="#888" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="947" y1="235" x2="830" y2="275" stroke="#888" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- Report node -->
  <rect x="755" y="360" width="100" height="35" rx="8" fill="url(#gTealLight)" filter="url(#shadow)"/>
  <text x="805" y="382" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Report</text>

  <!-- Arrow Validation -> Report -->
  <line x1="790" y1="320" x2="800" y2="355" stroke="#888" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- Feedback arrow: Validation back to Cleaning -->
  <path d="M 720,295 Q 580,295 580,175 Q 580,138 840,138" fill="none" stroke="#ef5350" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <rect x="570" y="218" width="125" height="22" rx="4" fill="#1a1a2e" stroke="#ef5350" stroke-width="1"/>
  <text x="632" y="233" text-anchor="middle" fill="#ef5350" font-size="9" font-weight="bold">confidence &lt; threshold</text>

  <!-- Label -->
  <rect x="680" y="425" width="280" height="30" rx="6" fill="#1a1a2e" stroke="#26a69a" stroke-width="1"/>
  <text x="820" y="445" text-anchor="middle" fill="#26a69a" font-size="12" font-weight="bold">Graph, Multi-Intelligence</text>
</svg>
