<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="dsA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4fc3f7"/>
    </marker>
    <filter id="dsS" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="2" result="offsetBlur"/>
      <feFlood flood-color="#000" flood-opacity="0.25" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="520" rx="12" fill="#0a0a1a"/>
  <text x="480" y="35" text-anchor="middle" fill="#e0e0e0" font-size="20" font-weight="bold">Data Science with AWP: From DataFrame to Result</text>

  <!-- Step 1: Data -->
  <rect x="30" y="80" width="160" height="110" rx="10" fill="#1a1a2e" stroke="#4fc3f7" stroke-width="2" filter="url(#dsS)"/>
  <text x="110" y="108" text-anchor="middle" fill="#4fc3f7" font-size="13" font-weight="bold">Data Sources</text>
  <text x="50" y="132" fill="#aaa" font-size="10">pd.DataFrame</text>
  <text x="50" y="150" fill="#aaa" font-size="10">CSV / JSON / Parquet</text>
  <text x="50" y="168" fill="#aaa" font-size="10">API-Responses</text>
  <text x="50" y="186" fill="#aaa" font-size="10">File paths</text>

  <line x1="190" y1="135" x2="235" y2="135" stroke="#4fc3f7" stroke-width="2" marker-end="url(#dsA)"/>

  <!-- Step 2: AgentWorkflow -->
  <rect x="240" y="65" width="200" height="140" rx="10" fill="#1a1a2e" stroke="#FF9800" stroke-width="2.5" filter="url(#dsS)"/>
  <text x="340" y="93" text-anchor="middle" fill="#FF9800" font-size="14" font-weight="bold">AgentWorkflow</text>
  <text x="260" y="117" fill="#ccc" font-size="10">inputs = {"{data: df}"}</text>
  <text x="260" y="135" fill="#ccc" font-size="10">task = "Analyze..."</text>
  <text x="260" y="153" fill="#ccc" font-size="10">model = "claude-sonnet"</text>
  <text x="260" y="171" fill="#ccc" font-size="10">packages = ["sklearn"]</text>
  <text x="260" y="189" fill="#888" font-size="9">3 lines of Python code</text>

  <line x1="440" y1="135" x2="485" y2="135" stroke="#4fc3f7" stroke-width="2" marker-end="url(#dsA)"/>

  <!-- Step 3: Delegation Loop -->
  <rect x="490" y="55" width="220" height="165" rx="10" fill="#1a1a2e" stroke="#9C27B0" stroke-width="2" filter="url(#dsS)"/>
  <text x="600" y="80" text-anchor="middle" fill="#9C27B0" font-size="13" font-weight="bold">Delegation Loop (A4)</text>
  <line x1="510" y1="90" x2="690" y2="90" stroke="#333" stroke-width="1"/>

  <!-- Mini manager-worker diagram -->
  <rect x="555" y="100" width="90" height="28" rx="5" fill="#222" stroke="#FF9800" stroke-width="1"/>
  <text x="600" y="119" text-anchor="middle" fill="#FF9800" font-size="10">Manager</text>

  <line x1="570" y1="128" x2="535" y2="150" stroke="#666" stroke-width="1"/>
  <line x1="600" y1="128" x2="600" y2="150" stroke="#666" stroke-width="1"/>
  <line x1="630" y1="128" x2="665" y2="150" stroke="#666" stroke-width="1"/>

  <rect x="510" y="153" width="55" height="24" rx="4" fill="#222" stroke="#4fc3f7" stroke-width="1"/>
  <text x="537" y="169" text-anchor="middle" fill="#4fc3f7" font-size="8">EDA</text>

  <rect x="572" y="153" width="55" height="24" rx="4" fill="#222" stroke="#4fc3f7" stroke-width="1"/>
  <text x="600" y="169" text-anchor="middle" fill="#4fc3f7" font-size="8">Model</text>

  <rect x="635" y="153" width="55" height="24" rx="4" fill="#222" stroke="#4fc3f7" stroke-width="1"/>
  <text x="662" y="169" text-anchor="middle" fill="#4fc3f7" font-size="8">Report</text>

  <text x="600" y="210" text-anchor="middle" fill="#888" font-size="9">Code Mode + Sandbox</text>

  <line x1="710" y1="135" x2="755" y2="135" stroke="#4fc3f7" stroke-width="2" marker-end="url(#dsA)"/>

  <!-- Step 4: Results -->
  <rect x="760" y="70" width="170" height="130" rx="10" fill="#1a1a2e" stroke="#4CAF50" stroke-width="2" filter="url(#dsS)"/>
  <text x="845" y="98" text-anchor="middle" fill="#4CAF50" font-size="13" font-weight="bold">Result</text>
  <text x="780" y="122" fill="#aaa" font-size="10">status: "complete"</text>
  <text x="780" y="140" fill="#aaa" font-size="10">result: {"{...}"}</text>
  <text x="780" y="158" fill="#aaa" font-size="10">artifacts: [charts]</text>
  <text x="780" y="176" fill="#aaa" font-size="10">metadata: {"{loops,</text>
  <text x="780" y="192" fill="#aaa" font-size="10">  tokens, wall_time}"}</text>

  <!-- Bottom: Use Cases -->
  <text x="480" y="270" text-anchor="middle" fill="#e0e0e0" font-size="15" font-weight="bold">Typical Data Science Workflows</text>

  <rect x="30" y="295" width="175" height="85" rx="8" fill="#111" stroke="#4fc3f7" stroke-width="1"/>
  <text x="117" y="320" text-anchor="middle" fill="#4fc3f7" font-size="12" font-weight="bold">Exploratory Analysis</text>
  <text x="40" y="340" fill="#888" font-size="9">Data quality, statistics,</text>
  <text x="40" y="355" fill="#888" font-size="9">correlation, visualization</text>
  <text x="40" y="370" fill="#888" font-size="9">Recommendations</text>

  <rect x="220" y="295" width="175" height="85" rx="8" fill="#111" stroke="#FF9800" stroke-width="1"/>
  <text x="307" y="320" text-anchor="middle" fill="#FF9800" font-size="12" font-weight="bold">Feature Engineering</text>
  <text x="230" y="340" fill="#888" font-size="9">Model training (XGBoost,</text>
  <text x="230" y="355" fill="#888" font-size="9">Random Forest, LogReg),</text>
  <text x="230" y="370" fill="#888" font-size="9">Cross-validation, selection</text>

  <rect x="410" y="295" width="175" height="85" rx="8" fill="#111" stroke="#4CAF50" stroke-width="1"/>
  <text x="497" y="320" text-anchor="middle" fill="#4CAF50" font-size="12" font-weight="bold">Reporting</text>
  <text x="420" y="340" fill="#888" font-size="9">Quarterly comparison, KPI</text>
  <text x="420" y="355" fill="#888" font-size="9">tracking, deviation</text>
  <text x="420" y="370" fill="#888" font-size="9">analysis, executive summary</text>

  <rect x="600" y="295" width="175" height="85" rx="8" fill="#111" stroke="#9C27B0" stroke-width="1"/>
  <text x="687" y="320" text-anchor="middle" fill="#9C27B0" font-size="12" font-weight="bold">NLP &amp; Sentiment</text>
  <text x="610" y="340" fill="#888" font-size="9">Sentiment analysis, topic</text>
  <text x="610" y="355" fill="#888" font-size="9">modeling, word clouds,</text>
  <text x="610" y="370" fill="#888" font-size="9">temporal trends</text>

  <!-- Pipeline integration -->
  <text x="480" y="420" text-anchor="middle" fill="#e0e0e0" font-size="15" font-weight="bold">Pipeline Integration</text>

  <rect x="120" y="440" width="160" height="50" rx="6" fill="#111" stroke="#FF9800" stroke-width="1"/>
  <text x="200" y="462" text-anchor="middle" fill="#FF9800" font-size="11" font-weight="bold">Jupyter Notebook</text>
  <text x="200" y="479" text-anchor="middle" fill="#888" font-size="9">Interactive analysis</text>

  <rect x="310" y="440" width="160" height="50" rx="6" fill="#111" stroke="#4CAF50" stroke-width="1"/>
  <text x="390" y="462" text-anchor="middle" fill="#4CAF50" font-size="11" font-weight="bold">Airflow / Prefect</text>
  <text x="390" y="479" text-anchor="middle" fill="#888" font-size="9">Batch-Pipelines</text>

  <rect x="500" y="440" width="160" height="50" rx="6" fill="#111" stroke="#4fc3f7" stroke-width="1"/>
  <text x="580" y="462" text-anchor="middle" fill="#4fc3f7" font-size="11" font-weight="bold">FastAPI / Flask</text>
  <text x="580" y="479" text-anchor="middle" fill="#888" font-size="9">REST-Endpoints</text>

  <rect x="690" y="440" width="160" height="50" rx="6" fill="#111" stroke="#9C27B0" stroke-width="1"/>
  <text x="770" y="462" text-anchor="middle" fill="#9C27B0" font-size="11" font-weight="bold">CI/CD Pipeline</text>
  <text x="770" y="479" text-anchor="middle" fill="#888" font-size="9">Automated reports</text>
</svg>