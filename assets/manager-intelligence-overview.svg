<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4CAF50"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f44336"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF9800"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4fc3f7"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#CE93D8"/>
    </marker>
  </defs>

  <rect width="900" height="700" rx="12" fill="#0a0a1a"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#e0e0e0" font-size="22" font-weight="bold">Manager Intelligence — Feature Overview</text>
  <text x="450" y="60" text-anchor="middle" fill="#888" font-size="13">Five subsystems enhancing manager problem-solving capabilities</text>

  <!-- ===== Central Flow ===== -->

  <!-- Task Input (blue pill) -->
  <rect x="370" y="85" width="160" height="38" rx="19" fill="#1a1a2e" stroke="#4fc3f7" stroke-width="2"/>
  <text x="450" y="109" text-anchor="middle" fill="#4fc3f7" font-size="13" font-weight="bold">Task Input</text>
  <line x1="450" y1="123" x2="450" y2="155" stroke="#4fc3f7" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Manager Decision (orange) -->
  <rect x="330" y="160" width="240" height="80" rx="10" fill="#1a1a2e" stroke="#FF9800" stroke-width="2"/>
  <text x="450" y="192" text-anchor="middle" fill="#FF9800" font-size="16" font-weight="bold">Manager Decision</text>
  <text x="450" y="212" text-anchor="middle" fill="#aaa" font-size="11">DELEGATE | COMPLETE | FAIL</text>

  <!-- DELEGATE path (center down) -->
  <line x1="450" y1="240" x2="450" y2="310" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="470" y="280" fill="#FF9800" font-size="11" font-weight="bold">DELEGATE</text>

  <!-- COMPLETE path (right) -->
  <line x1="570" y1="220" x2="680" y2="220" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="625" y="213" fill="#4CAF50" font-size="11" font-weight="bold">COMPLETE</text>
  <rect x="685" y="200" width="110" height="38" rx="19" fill="#1b5e20" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="740" y="224" text-anchor="middle" fill="#4CAF50" font-size="12" font-weight="bold">Result</text>

  <!-- FAIL path (left) -->
  <line x1="330" y1="220" x2="220" y2="220" stroke="#f44336" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="275" y="213" fill="#f44336" font-size="11" font-weight="bold">FAIL</text>
  <rect x="105" y="200" width="110" height="38" rx="19" fill="#4a1a1a" stroke="#f44336" stroke-width="1.5"/>
  <text x="160" y="224" text-anchor="middle" fill="#f44336" font-size="12" font-weight="bold">Failed</text>

  <!-- Workers box -->
  <rect x="340" y="315" width="220" height="60" rx="8" fill="#1a1a2e" stroke="#888" stroke-width="1.5"/>
  <text x="450" y="340" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="bold">Workers</text>
  <text x="450" y="358" text-anchor="middle" fill="#888" font-size="10">Parallel execution</text>

  <!-- Feedback loop arrow back to Manager -->
  <path d="M 560,345 L 620,345 L 620,200 L 570,200" fill="none" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowOrange)"/>
  <text x="635" y="278" fill="#FF9800" font-size="10" transform="rotate(-90,635,278)">feedback</text>

  <!-- ===== Five Purple Callout Boxes ===== -->

  <!-- 1. LEFT TOP: Task Decomposition -->
  <rect x="30" y="90" width="200" height="70" rx="8" fill="#1a1a2e" stroke="#CE93D8" stroke-width="2"/>
  <text x="130" y="118" text-anchor="middle" fill="#CE93D8" font-size="13" font-weight="bold">Task Decomposition</text>
  <text x="130" y="138" text-anchor="middle" fill="#888" font-size="10">Plan before delegating</text>
  <text x="130" y="150" text-anchor="middle" fill="#888" font-size="10">explicit subtask graph</text>
  <!-- dashed connection to Manager (before decision) -->
  <line x1="230" y1="125" x2="330" y2="175" stroke="#CE93D8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>

  <!-- 2. LEFT BOTTOM: Hypothesis Debugging -->
  <rect x="30" y="370" width="200" height="70" rx="8" fill="#1a1a2e" stroke="#CE93D8" stroke-width="2"/>
  <text x="130" y="398" text-anchor="middle" fill="#CE93D8" font-size="13" font-weight="bold">Hypothesis Debugging</text>
  <text x="130" y="418" text-anchor="middle" fill="#888" font-size="10">Diagnose failures before retry</text>
  <text x="130" y="430" text-anchor="middle" fill="#888" font-size="10">ranked hypotheses + testing</text>
  <!-- dashed connection to Workers (after failure) -->
  <line x1="230" y1="395" x2="340" y2="360" stroke="#CE93D8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>

  <!-- 3. RIGHT TOP: Strategy Switching -->
  <rect x="670" y="90" width="200" height="70" rx="8" fill="#1a1a2e" stroke="#CE93D8" stroke-width="2"/>
  <text x="770" y="118" text-anchor="middle" fill="#CE93D8" font-size="13" font-weight="bold">Strategy Switching</text>
  <text x="770" y="138" text-anchor="middle" fill="#888" font-size="10">Rotate approaches on stall</text>
  <text x="770" y="150" text-anchor="middle" fill="#888" font-size="10">meta-reasoning over tactics</text>
  <!-- dashed connection to feedback loop -->
  <line x1="670" y1="135" x2="625" y2="290" stroke="#CE93D8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>

  <!-- 4. RIGHT BOTTOM: Budget Reservation -->
  <rect x="670" y="370" width="200" height="70" rx="8" fill="#1a1a2e" stroke="#CE93D8" stroke-width="2"/>
  <text x="770" y="398" text-anchor="middle" fill="#CE93D8" font-size="13" font-weight="bold">Budget Reservation</text>
  <text x="770" y="418" text-anchor="middle" fill="#888" font-size="10">Phase-based allocation</text>
  <text x="770" y="430" text-anchor="middle" fill="#888" font-size="10">guaranteed reserves per phase</text>
  <!-- Mini bar chart sidebar -->
  <rect x="700" y="450" width="30" height="50" rx="2" fill="#4fc3f7" opacity="0.6"/>
  <rect x="735" y="460" width="30" height="40" rx="2" fill="#FF9800" opacity="0.6"/>
  <rect x="770" y="470" width="30" height="30" rx="2" fill="#4CAF50" opacity="0.6"/>
  <rect x="805" y="485" width="30" height="15" rx="2" fill="#f44336" opacity="0.6"/>
  <text x="770" y="514" text-anchor="middle" fill="#888" font-size="9">budget phases</text>
  <!-- dashed connection to budget check -->
  <line x1="670" y1="410" x2="560" y2="360" stroke="#CE93D8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>

  <!-- 5. BOTTOM CENTER: Decision Journal -->
  <rect x="325" y="480" width="250" height="70" rx="8" fill="#1a1a2e" stroke="#CE93D8" stroke-width="2"/>
  <text x="450" y="508" text-anchor="middle" fill="#CE93D8" font-size="13" font-weight="bold">Decision Journal</text>
  <text x="450" y="528" text-anchor="middle" fill="#888" font-size="10">Track decisions + outcomes for learning</text>
  <text x="450" y="540" text-anchor="middle" fill="#888" font-size="10">reflective memory across iterations</text>
  <!-- dashed connection to Manager (persistent sidebar) -->
  <line x1="450" y1="480" x2="450" y2="375" stroke="#CE93D8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>

  <!-- Legend -->
  <rect x="30" y="600" width="840" height="75" rx="8" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="50" y="622" fill="#888" font-size="11">Legend:</text>
  <rect x="105" y="610" width="14" height="14" rx="3" fill="#FF9800" opacity="0.8"/>
  <text x="125" y="622" fill="#e0e0e0" font-size="11">Manager</text>
  <rect x="195" y="610" width="14" height="14" rx="3" fill="#4fc3f7" opacity="0.8"/>
  <text x="215" y="622" fill="#e0e0e0" font-size="11">Input</text>
  <rect x="265" y="610" width="14" height="14" rx="3" fill="#CE93D8" opacity="0.8"/>
  <text x="285" y="622" fill="#e0e0e0" font-size="11">Intelligence Feature</text>
  <rect x="420" y="610" width="14" height="14" rx="3" fill="#4CAF50" opacity="0.8"/>
  <text x="440" y="622" fill="#e0e0e0" font-size="11">Success</text>
  <rect x="510" y="610" width="14" height="14" rx="3" fill="#f44336" opacity="0.8"/>
  <text x="530" y="622" fill="#e0e0e0" font-size="11">Failure</text>
  <rect x="595" y="610" width="14" height="14" rx="3" fill="#888" opacity="0.8"/>
  <text x="615" y="622" fill="#e0e0e0" font-size="11">Worker</text>
  <line x1="50" y1="645" x2="100" y2="645" stroke="#CE93D8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="110" y="649" fill="#888" font-size="10">Dashed lines = intelligence feature connections to core loop</text>
</svg>