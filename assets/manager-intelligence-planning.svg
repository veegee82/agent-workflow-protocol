<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF9800"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4fc3f7"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#CE93D8"/>
    </marker>
  </defs>

  <rect width="900" height="500" rx="12" fill="#0a0a1a"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#e0e0e0" font-size="22" font-weight="bold">Task Decomposition — Planning Phase</text>
  <text x="450" y="60" text-anchor="middle" fill="#888" font-size="13">Manager creates explicit task graph before delegation</text>

  <!-- Step 1: Task Input (blue pill) -->
  <rect x="20" y="160" width="100" height="38" rx="19" fill="#1a1a2e" stroke="#4fc3f7" stroke-width="2"/>
  <text x="70" y="184" text-anchor="middle" fill="#4fc3f7" font-size="12" font-weight="bold">Task Input</text>
  <line x1="120" y1="179" x2="148" y2="179" stroke="#4fc3f7" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Step 2: Manager PLAN (orange) -->
  <rect x="155" y="150" width="120" height="58" rx="8" fill="#1a1a2e" stroke="#FF9800" stroke-width="2"/>
  <text x="215" y="174" text-anchor="middle" fill="#FF9800" font-size="14" font-weight="bold">Manager</text>
  <text x="215" y="194" text-anchor="middle" fill="#FF9800" font-size="11">PLAN</text>
  <line x1="275" y1="179" x2="303" y2="179" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Step 3: Task Plan — mini DAG (purple) -->
  <rect x="310" y="115" width="170" height="130" rx="8" fill="#1a1a2e" stroke="#CE93D8" stroke-width="2"/>
  <text x="395" y="138" text-anchor="middle" fill="#CE93D8" font-size="13" font-weight="bold">Task Plan</text>

  <!-- Mini DAG: 3 subtasks -->
  <rect x="335" y="148" width="55" height="26" rx="5" fill="#2a1a3e" stroke="#CE93D8" stroke-width="1.2"/>
  <text x="362" y="165" text-anchor="middle" fill="#CE93D8" font-size="9">T1: Parse</text>

  <rect x="410" y="148" width="55" height="26" rx="5" fill="#2a1a3e" stroke="#CE93D8" stroke-width="1.2"/>
  <text x="437" y="165" text-anchor="middle" fill="#CE93D8" font-size="9">T2: Analyze</text>

  <rect x="370" y="196" width="55" height="26" rx="5" fill="#2a1a3e" stroke="#CE93D8" stroke-width="1.2"/>
  <text x="397" y="213" text-anchor="middle" fill="#CE93D8" font-size="9">T3: Merge</text>

  <!-- DAG edges -->
  <line x1="362" y1="174" x2="385" y2="196" stroke="#CE93D8" stroke-width="1" opacity="0.7"/>
  <line x1="437" y1="174" x2="410" y2="196" stroke="#CE93D8" stroke-width="1" opacity="0.7"/>

  <line x1="480" y1="179" x2="508" y2="179" stroke="#CE93D8" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- Step 4: Manager DELEGATE (orange) -->
  <rect x="515" y="150" width="120" height="58" rx="8" fill="#1a1a2e" stroke="#FF9800" stroke-width="2"/>
  <text x="575" y="174" text-anchor="middle" fill="#FF9800" font-size="14" font-weight="bold">Manager</text>
  <text x="575" y="194" text-anchor="middle" fill="#FF9800" font-size="11">DELEGATE</text>
  <text x="575" y="225" text-anchor="middle" fill="#888" font-size="9">Uses plan to assign workers</text>

  <!-- Arrows to 3 parallel workers -->
  <line x1="635" y1="165" x2="680" y2="120" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="635" y1="179" x2="680" y2="179" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="635" y1="193" x2="680" y2="238" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5: Worker boxes (gray) -->
  <rect x="688" y="100" width="90" height="38" rx="6" fill="#1a1a2e" stroke="#888" stroke-width="1.5"/>
  <text x="733" y="124" text-anchor="middle" fill="#e0e0e0" font-size="11">Worker A</text>

  <rect x="688" y="160" width="90" height="38" rx="6" fill="#1a1a2e" stroke="#888" stroke-width="1.5"/>
  <text x="733" y="184" text-anchor="middle" fill="#e0e0e0" font-size="11">Worker B</text>

  <rect x="688" y="220" width="90" height="38" rx="6" fill="#1a1a2e" stroke="#888" stroke-width="1.5"/>
  <text x="733" y="244" text-anchor="middle" fill="#e0e0e0" font-size="11">Worker C</text>

  <!-- Arrows from workers to Update Plan Status -->
  <line x1="778" y1="119" x2="820" y2="170" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="778" y1="179" x2="810" y2="179" stroke="#888" stroke-width="1.5"/>
  <line x1="778" y1="239" x2="820" y2="188" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 6: Update Plan Status (purple) -->
  <rect x="810" y="295" width="70" height="105" rx="8" fill="#1a1a2e" stroke="#CE93D8" stroke-width="2" transform="translate(0,-140)"/>
  <text x="845" y="175" text-anchor="middle" fill="#CE93D8" font-size="10" font-weight="bold">Update</text>
  <text x="845" y="188" text-anchor="middle" fill="#CE93D8" font-size="10" font-weight="bold">Plan</text>

  <!-- Check/X marks -->
  <text x="830" y="210" fill="#4CAF50" font-size="14">&#x2713;</text>
  <text x="850" y="210" fill="#4CAF50" font-size="10">T1</text>
  <text x="830" y="228" fill="#4CAF50" font-size="14">&#x2713;</text>
  <text x="850" y="228" fill="#4CAF50" font-size="10">T2</text>
  <text x="830" y="246" fill="#f44336" font-size="14">&#x2717;</text>
  <text x="850" y="246" fill="#f44336" font-size="10">T3</text>

  <!-- Step 7: Feedback arrow back to Manager DELEGATE -->
  <path d="M 845,260 L 845,290 L 575,290 L 575,213" fill="none" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowOrange)"/>
  <text x="710" y="284" text-anchor="middle" fill="#FF9800" font-size="10">incomplete tasks retry</text>

  <!-- Phase labels along bottom -->
  <rect x="30" y="340" width="840" height="50" rx="8" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="70" y="362" fill="#4fc3f7" font-size="11" font-weight="bold">1. Input</text>
  <text x="185" y="362" fill="#FF9800" font-size="11" font-weight="bold">2. Plan</text>
  <text x="340" y="362" fill="#CE93D8" font-size="11" font-weight="bold">3. Task Graph</text>
  <text x="515" y="362" fill="#FF9800" font-size="11" font-weight="bold">4. Delegate</text>
  <text x="665" y="362" fill="#888" font-size="11" font-weight="bold">5. Workers</text>
  <text x="800" y="362" fill="#CE93D8" font-size="11" font-weight="bold">6. Update</text>
  <text x="450" y="380" text-anchor="middle" fill="#888" font-size="10">Manager iterates through plan until all subtasks complete or budget exhausted</text>

  <!-- Key insight box -->
  <rect x="30" y="410" width="840" height="65" rx="8" fill="#1a1a2e" stroke="#CE93D8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="50" y="435" fill="#CE93D8" font-size="12" font-weight="bold">Key Insight:</text>
  <text x="155" y="435" fill="#e0e0e0" font-size="12">Planning creates a structured task graph that makes delegation targeted and progress measurable.</text>
  <text x="50" y="458" fill="#888" font-size="11">Without planning, the manager delegates blindly and cannot track which subtasks remain incomplete.</text>
</svg>