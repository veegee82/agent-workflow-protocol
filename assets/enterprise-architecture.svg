<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="eaS"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.25"/></filter>
    <marker id="eaA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="960" height="620" rx="12" fill="#0a0a1a"/>
  <text x="480" y="35" text-anchor="middle" fill="#e0e0e0" font-size="20" font-weight="bold">Enterprise Architecture: AWP in Corporate Infrastructure</text>

  <!-- AWP Core (center) -->
  <rect x="310" y="200" width="340" height="180" rx="12" fill="#1a1a2e" stroke="#FF9800" stroke-width="2.5" filter="url(#eaS)"/>
  <text x="480" y="228" text-anchor="middle" fill="#FF9800" font-size="16" font-weight="bold">AWP Runtime</text>
  <line x1="330" y1="238" x2="630" y2="238" stroke="#333"/>

  <rect x="330" y="250" width="130" height="35" rx="5" fill="#222" stroke="#4fc3f7" stroke-width="1"/>
  <text x="395" y="272" text-anchor="middle" fill="#4fc3f7" font-size="10">DAG Engine</text>

  <rect x="480" y="250" width="150" height="35" rx="5" fill="#222" stroke="#9C27B0" stroke-width="1"/>
  <text x="555" y="272" text-anchor="middle" fill="#9C27B0" font-size="10">Delegation Loop</text>

  <rect x="330" y="295" width="130" height="35" rx="5" fill="#222" stroke="#4CAF50" stroke-width="1"/>
  <text x="395" y="317" text-anchor="middle" fill="#4CAF50" font-size="10">Tool Registry</text>

  <rect x="480" y="295" width="150" height="35" rx="5" fill="#222" stroke="#f44336" stroke-width="1"/>
  <text x="555" y="317" text-anchor="middle" fill="#f44336" font-size="10">Safety Envelope</text>

  <rect x="330" y="340" width="300" height="28" rx="5" fill="#222" stroke="#7bc67e" stroke-width="1"/>
  <text x="480" y="358" text-anchor="middle" fill="#7bc67e" font-size="10">Validation R1-R26 + Compliance A0-A4</text>

  <!-- Left side: Data Sources -->
  <rect x="20" y="70" width="230" height="180" rx="10" fill="#111" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="135" y="95" text-anchor="middle" fill="#4fc3f7" font-size="13" font-weight="bold">Data Sources</text>
  <line x1="40" y1="105" x2="230" y2="105" stroke="#222"/>
  <text x="40" y="125" fill="#aaa" font-size="10">Data Warehouse (Snowflake, BQ)</text>
  <text x="40" y="145" fill="#aaa" font-size="10">Data Lake (S3, ADLS)</text>
  <text x="40" y="165" fill="#aaa" font-size="10">Streaming (Kafka, Kinesis)</text>
  <text x="40" y="185" fill="#aaa" font-size="10">REST APIs / GraphQL</text>
  <text x="40" y="205" fill="#aaa" font-size="10">Databases (Postgres, Mongo)</text>
  <text x="40" y="225" fill="#aaa" font-size="10">File Systems (CSV, Parquet)</text>

  <line x1="250" y1="200" x2="310" y2="280" stroke="#666" stroke-width="1.5" marker-end="url(#eaA)"/>

  <!-- Right side: LLM Providers -->
  <rect x="710" y="70" width="230" height="150" rx="10" fill="#111" stroke="#9C27B0" stroke-width="1.5"/>
  <text x="825" y="95" text-anchor="middle" fill="#9C27B0" font-size="13" font-weight="bold">LLM Providers</text>
  <line x1="730" y1="105" x2="920" y2="105" stroke="#222"/>
  <text x="730" y="125" fill="#aaa" font-size="10">OpenRouter (Multi-Provider)</text>
  <text x="730" y="145" fill="#aaa" font-size="10">Anthropic (Claude)</text>
  <text x="730" y="165" fill="#aaa" font-size="10">OpenAI (GPT-4o)</text>
  <text x="730" y="185" fill="#aaa" font-size="10">Ollama (Local / On-Prem)</text>
  <text x="730" y="205" fill="#aaa" font-size="10">Azure OpenAI / AWS Bedrock</text>

  <line x1="710" y1="180" x2="650" y2="260" stroke="#666" stroke-width="1.5" marker-end="url(#eaA)"/>

  <!-- Top: CI/CD -->
  <rect x="340" y="70" width="280" height="100" rx="10" fill="#111" stroke="#7bc67e" stroke-width="1.5"/>
  <text x="480" y="95" text-anchor="middle" fill="#7bc67e" font-size="13" font-weight="bold">CI/CD Pipeline</text>
  <line x1="360" y1="105" x2="600" y2="105" stroke="#222"/>
  <text x="360" y="125" fill="#aaa" font-size="10">awp validate  (Pre-Commit Hook)</text>
  <text x="360" y="145" fill="#aaa" font-size="10">awp compliance --level A2  (Gate)</text>
  <text x="360" y="165" fill="#aaa" font-size="10">pytest + awp conformance  (Tests)</text>

  <line x1="480" y1="170" x2="480" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#eaA)"/>

  <!-- Bottom Left: Execution -->
  <rect x="20" y="300" width="230" height="130" rx="10" fill="#111" stroke="#FF9800" stroke-width="1.5"/>
  <text x="135" y="325" text-anchor="middle" fill="#FF9800" font-size="13" font-weight="bold">Execution</text>
  <line x1="40" y1="335" x2="230" y2="335" stroke="#222"/>
  <text x="40" y="355" fill="#aaa" font-size="10">Kubernetes (Docker Sandbox)</text>
  <text x="40" y="375" fill="#aaa" font-size="10">Serverless (Cloudflare)</text>
  <text x="40" y="395" fill="#aaa" font-size="10">On-Premise (subprocess)</text>
  <text x="40" y="415" fill="#aaa" font-size="10">Jupyter (AgentWorkflow API)</text>

  <line x1="250" y1="360" x2="310" y2="320" stroke="#666" stroke-width="1.5" marker-end="url(#eaA)"/>

  <!-- Bottom Right: Observability -->
  <rect x="710" y="280" width="230" height="130" rx="10" fill="#111" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="825" y="305" text-anchor="middle" fill="#4CAF50" font-size="13" font-weight="bold">Observability</text>
  <line x1="730" y1="315" x2="920" y2="315" stroke="#222"/>
  <text x="730" y="335" fill="#aaa" font-size="10">OpenTelemetry Tracing</text>
  <text x="730" y="355" fill="#aaa" font-size="10">Datadog / Grafana / Splunk</text>
  <text x="730" y="375" fill="#aaa" font-size="10">Dual Logging (JSON + MD)</text>
  <text x="730" y="395" fill="#aaa" font-size="10">Audit Trail (Compliance)</text>

  <line x1="650" y1="320" x2="710" y2="340" stroke="#666" stroke-width="1.5" marker-end="url(#eaA)"/>

  <!-- Bottom Center: Outputs -->
  <rect x="310" y="420" width="340" height="80" rx="10" fill="#111" stroke="#f44336" stroke-width="1.5"/>
  <text x="480" y="448" text-anchor="middle" fill="#f44336" font-size="13" font-weight="bold">Enterprise Integration</text>
  <line x1="330" y1="458" x2="630" y2="458" stroke="#222"/>
  <text x="330" y="478" fill="#aaa" font-size="10">Secrets: Vault / AWS SSM / Azure KV</text>
  <text x="330" y="495" fill="#aaa" font-size="10">Distribution: .awp.zip Registry | Git | ClawHub</text>

  <line x1="480" y1="380" x2="480" y2="420" stroke="#666" stroke-width="1.5" marker-end="url(#eaA)"/>

  <!-- Bottom: MCP Tools Bridge -->
  <rect x="100" y="530" width="760" height="60" rx="8" fill="#111" stroke="#555" stroke-dasharray="4,2"/>
  <text x="480" y="555" text-anchor="middle" fill="#ccc" font-size="12" font-weight="bold">MCP Tool Layer: Interchangeable Backends Behind Standardized Tool Interfaces</text>
  <text x="480" y="575" text-anchor="middle" fill="#888" font-size="10">memory.search -> Pinecone | web.search -> Internal API | custom.erp -> SAP | file.read -> S3</text>
</svg>
