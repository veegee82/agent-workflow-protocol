<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#0d0d24"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7b2ff7"/>
      <stop offset="100%" style="stop-color:#9b59b6"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1565c0"/>
      <stop offset="100%" style="stop-color:#1e88e5"/>
    </linearGradient>
    <linearGradient id="blueLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d47a1"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2e7d32"/>
      <stop offset="100%" style="stop-color:#43a047"/>
    </linearGradient>
    <linearGradient id="greenLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1b5e20"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e65100"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
    <linearGradient id="orangeLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#bf360c"/>
      <stop offset="100%" style="stop-color:#e65100"/>
    </linearGradient>
    <linearGradient id="gov" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="2" dy="3" result="offsetBlur"/>
      <feFlood flood-color="#000" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="2" result="offsetBlur"/>
      <feFlood flood-color="#000" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="650" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" fill="#e0e0e0" font-size="22" font-weight="bold">Enterprise Agent Ecosystem</text>
  <text x="550" y="58" text-anchor="middle" fill="#888" font-size="12">Multi-domain orchestration with hierarchical delegation and governance</text>

  <!-- Executive Orchestrator -->
  <rect x="370" y="72" width="360" height="52" rx="10" fill="url(#purple)" filter="url(#shadow)"/>
  <text x="550" y="95" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">Executive Orchestrator</text>
  <text x="550" y="114" text-anchor="middle" fill="#ddd" font-size="11">A4 Self-Organizing | Budget: 10M tokens/day (incl. 3.5M reserve)</text>

  <!-- Connection lines from orchestrator to domains -->
  <line x1="445" y1="124" x2="195" y2="155" stroke="#7b2ff7" stroke-width="2" opacity="0.6"/>
  <line x1="550" y1="124" x2="550" y2="155" stroke="#7b2ff7" stroke-width="2" opacity="0.6"/>
  <line x1="655" y1="124" x2="905" y2="155" stroke="#7b2ff7" stroke-width="2" opacity="0.6"/>

  <!-- === FINANCE DOMAIN === -->
  <rect x="30" y="155" width="330" height="395" rx="10" fill="none" stroke="#1e88e5" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="195" y="175" text-anchor="middle" fill="#64b5f6" font-size="11" font-weight="bold">FINANCE DOMAIN</text>

  <!-- Finance Manager -->
  <rect x="60" y="185" width="270" height="42" rx="8" fill="url(#blue)" filter="url(#shadowSm)"/>
  <text x="195" y="207" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Finance Manager</text>
  <text x="195" y="221" text-anchor="middle" fill="#ddd" font-size="10">A3 Delegation Loop</text>

  <!-- Finance agents -->
  <line x1="130" y1="227" x2="130" y2="247" stroke="#1565c0" stroke-width="1.5" opacity="0.5"/>
  <line x1="195" y1="227" x2="195" y2="297" stroke="#1565c0" stroke-width="1.5" opacity="0.5"/>
  <line x1="260" y1="227" x2="260" y2="367" stroke="#1565c0" stroke-width="1.5" opacity="0.5"/>

  <rect x="55" y="247" width="150" height="42" rx="6" fill="url(#blueLight)" filter="url(#shadowSm)"/>
  <text x="130" y="268" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Revenue Forecasting</text>
  <text x="130" y="282" text-anchor="middle" fill="#aaa" font-size="9">A2 Bounded</text>

  <rect x="120" y="297" width="150" height="42" rx="6" fill="url(#blueLight)" filter="url(#shadowSm)"/>
  <text x="195" y="318" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Cost Analysis</text>
  <text x="195" y="332" text-anchor="middle" fill="#aaa" font-size="9">A1 DAG</text>

  <rect x="185" y="367" width="150" height="42" rx="6" fill="url(#blueLight)" filter="url(#shadowSm)"/>
  <text x="260" y="388" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Audit</text>
  <text x="260" y="402" text-anchor="middle" fill="#aaa" font-size="9">A0 Prescribed</text>

  <!-- Decorative token indicators -->
  <rect x="55" y="430" width="280" height="28" rx="5" fill="#0d47a1" fill-opacity="0.3"/>
  <text x="195" y="449" text-anchor="middle" fill="#64b5f6" font-size="10">Budget: 2M tokens | Workers: 15 max</text>

  <!-- === PRODUCT DOMAIN === -->
  <rect x="385" y="155" width="330" height="395" rx="10" fill="none" stroke="#43a047" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="550" y="175" text-anchor="middle" fill="#81c784" font-size="11" font-weight="bold">PRODUCT DOMAIN</text>

  <!-- Product Manager -->
  <rect x="415" y="185" width="270" height="42" rx="8" fill="url(#green)" filter="url(#shadowSm)"/>
  <text x="550" y="207" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Product Manager</text>
  <text x="550" y="221" text-anchor="middle" fill="#ddd" font-size="10">A3 Delegation Loop</text>

  <!-- Product agents -->
  <line x1="485" y1="227" x2="485" y2="247" stroke="#2e7d32" stroke-width="1.5" opacity="0.5"/>
  <line x1="550" y1="227" x2="550" y2="297" stroke="#2e7d32" stroke-width="1.5" opacity="0.5"/>
  <line x1="615" y1="227" x2="615" y2="367" stroke="#2e7d32" stroke-width="1.5" opacity="0.5"/>

  <rect x="410" y="247" width="150" height="42" rx="6" fill="url(#greenLight)" filter="url(#shadowSm)"/>
  <text x="485" y="268" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Feature Prioritization</text>
  <text x="485" y="282" text-anchor="middle" fill="#aaa" font-size="9">A3 Recursive</text>

  <rect x="475" y="297" width="150" height="42" rx="6" fill="url(#greenLight)" filter="url(#shadowSm)"/>
  <text x="550" y="318" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">User Analytics</text>
  <text x="550" y="332" text-anchor="middle" fill="#aaa" font-size="9">A2 Bounded</text>

  <rect x="540" y="367" width="150" height="42" rx="6" fill="url(#greenLight)" filter="url(#shadowSm)"/>
  <text x="615" y="388" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">A/B Testing</text>
  <text x="615" y="402" text-anchor="middle" fill="#aaa" font-size="9">A1 DAG</text>

  <rect x="410" y="430" width="280" height="28" rx="5" fill="#1b5e20" fill-opacity="0.3"/>
  <text x="550" y="449" text-anchor="middle" fill="#81c784" font-size="10">Budget: 3M tokens | Workers: 20 max</text>

  <!-- === OPERATIONS DOMAIN === -->
  <rect x="740" y="155" width="330" height="395" rx="10" fill="none" stroke="#f57c00" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="905" y="175" text-anchor="middle" fill="#ffb74d" font-size="11" font-weight="bold">OPERATIONS DOMAIN</text>

  <!-- Ops Manager -->
  <rect x="770" y="185" width="270" height="42" rx="8" fill="url(#orange)" filter="url(#shadowSm)"/>
  <text x="905" y="207" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Ops Manager</text>
  <text x="905" y="221" text-anchor="middle" fill="#ddd" font-size="10">A3 Delegation Loop</text>

  <!-- Ops agents -->
  <line x1="855" y1="227" x2="855" y2="247" stroke="#e65100" stroke-width="1.5" opacity="0.5"/>
  <line x1="955" y1="227" x2="955" y2="317" stroke="#e65100" stroke-width="1.5" opacity="0.5"/>

  <rect x="780" y="247" width="150" height="42" rx="6" fill="url(#orangeLight)" filter="url(#shadowSm)"/>
  <text x="855" y="268" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Incident Response</text>
  <text x="855" y="282" text-anchor="middle" fill="#aaa" font-size="9">A2 Bounded</text>

  <rect x="880" y="317" width="150" height="42" rx="6" fill="url(#orangeLight)" filter="url(#shadowSm)"/>
  <text x="955" y="338" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Capacity Planning</text>
  <text x="955" y="352" text-anchor="middle" fill="#aaa" font-size="9">A1 DAG</text>

  <rect x="765" y="430" width="280" height="28" rx="5" fill="#bf360c" fill-opacity="0.3"/>
  <text x="905" y="449" text-anchor="middle" fill="#ffb74d" font-size="10">Budget: 1.5M tokens | Workers: 10 max</text>

  <!-- === GOVERNANCE LAYER === -->
  <rect x="30" y="570" width="1040" height="60" rx="10" fill="url(#gov)" filter="url(#shadow)" stroke="#ff6b6b" stroke-width="1" stroke-opacity="0.5"/>
  <text x="550" y="593" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="bold">Governance Layer</text>

  <!-- Governance items -->
  <rect x="65" y="600" width="150" height="22" rx="4" fill="#ff6b6b" fill-opacity="0.15"/>
  <text x="140" y="615" text-anchor="middle" fill="#ff8a80" font-size="10">Budget Enforcement</text>

  <rect x="240" y="600" width="150" height="22" rx="4" fill="#ff6b6b" fill-opacity="0.15"/>
  <text x="315" y="615" text-anchor="middle" fill="#ff8a80" font-size="10">Safety Envelope</text>

  <rect x="415" y="600" width="150" height="22" rx="4" fill="#ff6b6b" fill-opacity="0.15"/>
  <text x="490" y="615" text-anchor="middle" fill="#ff8a80" font-size="10">Observability</text>

  <rect x="590" y="600" width="150" height="22" rx="4" fill="#ff6b6b" fill-opacity="0.15"/>
  <text x="665" y="615" text-anchor="middle" fill="#ff8a80" font-size="10">Compliance</text>

  <rect x="765" y="600" width="170" height="22" rx="4" fill="#ff6b6b" fill-opacity="0.15"/>
  <text x="850" y="615" text-anchor="middle" fill="#ff8a80" font-size="10">Audit Trail &amp; Tracing</text>
</svg>