<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#0d0d24"/>
    </linearGradient>
    <linearGradient id="l0" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d47a1"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <linearGradient id="l1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1565c0"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <linearGradient id="l2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1976d2"/>
      <stop offset="100%" style="stop-color:#1e88e5"/>
    </linearGradient>
    <linearGradient id="l3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e88e5"/>
      <stop offset="100%" style="stop-color:#2196f3"/>
    </linearGradient>
    <linearGradient id="l4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196f3"/>
      <stop offset="100%" style="stop-color:#42a5f5"/>
    </linearGradient>
    <linearGradient id="l5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#42a5f5"/>
      <stop offset="100%" style="stop-color:#64b5f6"/>
    </linearGradient>
    <linearGradient id="l6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#64b5f6"/>
      <stop offset="100%" style="stop-color:#90caf9"/>
    </linearGradient>
    <linearGradient id="future1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7b1fa2;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#9c27b0;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="future2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9c27b0;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ab47bc;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="2" dy="3" result="offsetBlur"/>
      <feFlood flood-color="#000" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#e0e0e0" font-size="20" font-weight="bold">The Cognitive Architecture Stack</text>
  <text x="400" y="56" text-anchor="middle" fill="#888" font-size="11">Current AWP layers and future extensions for meta-cognitive capabilities</text>

  <!-- Side labels -->
  <text x="25" y="310" text-anchor="middle" fill="#64b5f6" font-size="12" font-weight="bold" transform="rotate(-90,25,310)">CURRENT AWP (Layers 0-6)</text>
  <text x="25" y="120" text-anchor="middle" fill="#ab47bc" font-size="12" font-weight="bold" transform="rotate(-90,25,120)">FUTURE</text>

  <!-- Dashed separator line -->
  <line x1="50" y1="168" x2="760" y2="168" stroke="#9c27b0" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.6"/>
  <rect x="330" y="158" width="140" height="20" rx="4" fill="#0a0a1a"/>
  <text x="400" y="173" text-anchor="middle" fill="#ce93d8" font-size="10" font-weight="bold">FUTURE BOUNDARY</text>

  <!-- === FUTURE LAYERS (top, dashed) === -->

  <!-- Layer 8: Meta-Learning -->
  <rect x="110" y="75" width="580" height="40" rx="8" fill="url(#future2)" stroke="#ab47bc" stroke-width="1.5" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <text x="130" y="98" fill="#ce93d8" font-size="10" font-weight="bold" opacity="0.7">LAYER 8</text>
  <text x="260" y="99" fill="#e1bee7" font-size="14" font-weight="bold">Meta-Learning</text>
  <text x="670" y="99" text-anchor="end" fill="#ce93d8" font-size="10">Self-improving workflow strategies</text>

  <!-- Layer 7: Cross-Workflow Knowledge Transfer -->
  <rect x="95" y="122" width="610" height="40" rx="8" fill="url(#future1)" stroke="#9c27b0" stroke-width="1.5" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <text x="115" y="145" fill="#ce93d8" font-size="10" font-weight="bold" opacity="0.7">LAYER 7</text>
  <text x="290" y="146" fill="#e1bee7" font-size="14" font-weight="bold">Cross-Workflow Knowledge Transfer</text>
  <text x="685" y="146" text-anchor="end" fill="#ce93d8" font-size="10">Shared insights across workflows</text>

  <!-- === CURRENT AWP LAYERS (solid, bottom to top, widening) === -->

  <!-- Layer 6: Observability -->
  <rect x="80" y="190" width="640" height="46" rx="8" fill="url(#l6)" filter="url(#shadow)"/>
  <text x="100" y="211" fill="#fff" font-size="10" font-weight="bold" opacity="0.7">LAYER 6</text>
  <text x="210" y="213" fill="#fff" font-size="14" font-weight="bold">Observability</text>
  <text x="700" y="213" text-anchor="end" fill="#fff" font-size="10" opacity="0.8">Tracing, metrics, audit trail</text>
  <text x="700" y="228" text-anchor="end" fill="#ddd" font-size="9" opacity="0.7">OpenTelemetry, dual logging</text>

  <!-- Layer 5: Orchestration -->
  <rect x="95" y="244" width="610" height="46" rx="8" fill="url(#l5)" filter="url(#shadow)"/>
  <text x="115" y="265" fill="#fff" font-size="10" font-weight="bold" opacity="0.7">LAYER 5</text>
  <text x="225" y="267" fill="#fff" font-size="14" font-weight="bold">Orchestration</text>
  <text x="685" y="267" text-anchor="end" fill="#fff" font-size="10" opacity="0.8">DAG engine, delegation loop</text>
  <text x="685" y="282" text-anchor="end" fill="#ddd" font-size="9" opacity="0.7">Budget enforcement, validation gates</text>

  <!-- Layer 4: Memory & State -->
  <rect x="110" y="298" width="580" height="46" rx="8" fill="url(#l4)" filter="url(#shadow)"/>
  <text x="130" y="319" fill="#fff" font-size="10" font-weight="bold" opacity="0.7">LAYER 4</text>
  <text x="240" y="321" fill="#fff" font-size="14" font-weight="bold">Memory &amp; State</text>
  <text x="670" y="321" text-anchor="end" fill="#fff" font-size="10" opacity="0.8">Long-term, episodic, semantic</text>
  <text x="670" y="336" text-anchor="end" fill="#ddd" font-size="9" opacity="0.7">State sharing between DAG nodes</text>

  <!-- Layer 3: Communication -->
  <rect x="125" y="352" width="550" height="46" rx="8" fill="url(#l3)" filter="url(#shadow)"/>
  <text x="145" y="373" fill="#fff" font-size="10" font-weight="bold" opacity="0.7">LAYER 3</text>
  <text x="255" y="375" fill="#fff" font-size="14" font-weight="bold">Communication</text>
  <text x="655" y="375" text-anchor="end" fill="#fff" font-size="10" opacity="0.8">Message bus, typed channels</text>
  <text x="655" y="390" text-anchor="end" fill="#ddd" font-size="9" opacity="0.7">JSON Schema, pub/sub</text>

  <!-- Layer 2: Capabilities -->
  <rect x="140" y="406" width="520" height="46" rx="8" fill="url(#l2)" filter="url(#shadow)"/>
  <text x="160" y="427" fill="#fff" font-size="10" font-weight="bold" opacity="0.7">LAYER 2</text>
  <text x="270" y="429" fill="#fff" font-size="14" font-weight="bold">Capabilities</text>
  <text x="640" y="429" text-anchor="end" fill="#fff" font-size="10" opacity="0.8">Tools, skills, code mode</text>
  <text x="640" y="444" text-anchor="end" fill="#ddd" font-size="9" opacity="0.7">MCP, sandbox, dynamic tools</text>

  <!-- Layer 1: Identity -->
  <rect x="155" y="460" width="490" height="46" rx="8" fill="url(#l1)" filter="url(#shadow)"/>
  <text x="175" y="481" fill="#fff" font-size="10" font-weight="bold" opacity="0.7">LAYER 1</text>
  <text x="285" y="483" fill="#fff" font-size="14" font-weight="bold">Agent Identity</text>
  <text x="625" y="483" text-anchor="end" fill="#fff" font-size="10" opacity="0.8">ID, role, model, prompt</text>
  <text x="625" y="498" text-anchor="end" fill="#ddd" font-size="9" opacity="0.7">Output contract, confidence R17</text>

  <!-- Layer 0: Manifest -->
  <rect x="170" y="514" width="460" height="46" rx="8" fill="url(#l0)" filter="url(#shadow)"/>
  <text x="190" y="535" fill="#fff" font-size="10" font-weight="bold" opacity="0.7">LAYER 0</text>
  <text x="300" y="537" fill="#fff" font-size="14" font-weight="bold">Manifest</text>
  <text x="610" y="537" text-anchor="end" fill="#fff" font-size="10" opacity="0.8">Name, version, description</text>
  <text x="610" y="552" text-anchor="end" fill="#ddd" font-size="9" opacity="0.7">Dependencies, environment</text>

  <!-- Bottom note -->
  <text x="400" y="585" text-anchor="middle" fill="#666" font-size="11">Layers 0-1 required | Layers 2-6 opt-in | Layers 7-8 future extensions</text>
</svg>