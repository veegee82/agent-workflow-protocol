<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="as-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow-as" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="url(#as-bg)" rx="12"/>
  <text x="450" y="36" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">LLM Architecture Selection</text>
  <text x="450" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">How the skill chooses the optimal workflow architecture for your task</text>

  <!-- Task input -->
  <rect x="340" y="75" width="220" height="40" rx="8" fill="#6366f1" opacity="0.9"/>
  <text x="450" y="100" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Your task description</text>

  <!-- Arrow down -->
  <line x1="450" y1="115" x2="450" y2="140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-as)"/>

  <!-- Decision 1 -->
  <polygon points="450,145 570,185 450,225 330,185" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="182" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">Steps known</text>
  <text x="450" y="196" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">upfront?</text>

  <!-- YES branch (left) -->
  <text x="320" y="178" fill="#34d399" font-size="10" font-weight="700">YES</text>
  <line x1="330" y1="185" x2="240" y2="185" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-as)"/>

  <!-- Decision 2 (left) -->
  <polygon points="150,185 240,215 150,245 60,215" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="150" y="212" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">Conditions?</text>
  <text x="150" y="226" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">Parallel?</text>

  <!-- A0 -->
  <text x="55" y="210" fill="#ec4899" font-size="10" font-weight="700">NO</text>
  <line x1="60" y1="215" x2="30" y2="265" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arrow-as)"/>
  <rect x="5" y="270" width="120" height="55" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
  <text x="65" y="292" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="700">A0 Prescribed</text>
  <text x="65" y="308" text-anchor="middle" fill="#64748b" font-size="9">Static DAG</text>
  <text x="65" y="320" text-anchor="middle" fill="#64748b" font-size="9">dag engine</text>

  <!-- A1 -->
  <text x="195" y="252" fill="#34d399" font-size="10" font-weight="700">YES</text>
  <line x1="150" y1="245" x2="150" y2="265" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-as)"/>
  <rect x="85" y="270" width="130" height="55" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="150" y="292" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">A1 Adaptive</text>
  <text x="150" y="308" text-anchor="middle" fill="#64748b" font-size="9">DAG + conditions</text>
  <text x="150" y="320" text-anchor="middle" fill="#64748b" font-size="9">dag engine</text>

  <!-- NO branch (right) -->
  <text x="580" y="178" fill="#f472b6" font-size="10" font-weight="700">NO</text>
  <line x1="570" y1="185" x2="660" y2="185" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arrow-as)"/>

  <!-- Decision 3 (right) -->
  <polygon points="750,185 840,215 750,245 660,215" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
  <text x="750" y="212" text-anchor="middle" fill="#f472b6" font-size="10" font-weight="600">Runtime tool</text>
  <text x="750" y="226" text-anchor="middle" fill="#f472b6" font-size="10" font-weight="600">creation?</text>

  <!-- A2 -->
  <text x="655" y="252" fill="#34d399" font-size="10" font-weight="700">NO</text>
  <line x1="660" y1="215" x2="600" y2="265" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-as)"/>
  <rect x="530" y="270" width="140" height="55" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="600" y="292" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">A2 Delegating</text>
  <text x="600" y="308" text-anchor="middle" fill="#64748b" font-size="9">Manager-worker loop</text>
  <text x="600" y="320" text-anchor="middle" fill="#64748b" font-size="9">delegation_loop engine</text>

  <!-- YES to tool creation -->
  <text x="845" y="210" fill="#f472b6" font-size="10" font-weight="700">YES</text>
  <line x1="840" y1="215" x2="840" y2="255" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arrow-as)"/>

  <!-- Decision 4 -->
  <polygon points="840,260 890,280 840,300 790,280" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="840" y="284" text-anchor="middle" fill="#c084fc" font-size="9" font-weight="600">Sub-teams?</text>

  <!-- A3 -->
  <text x="785" y="300" fill="#34d399" font-size="10" font-weight="700">NO</text>
  <line x1="790" y1="280" x2="740" y2="340" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-as)"/>
  <rect x="680" y="345" width="130" height="55" rx="8" fill="#0f172a" stroke="#ec4899" stroke-width="1.5"/>
  <text x="745" y="367" text-anchor="middle" fill="#f472b6" font-size="12" font-weight="700">A3 Self-Tooling</text>
  <text x="745" y="383" text-anchor="middle" fill="#64748b" font-size="9">Dynamic tools + skills</text>
  <text x="745" y="395" text-anchor="middle" fill="#64748b" font-size="9">delegation_loop engine</text>

  <!-- A4 -->
  <text x="865" y="305" fill="#f472b6" font-size="10" font-weight="700">YES</text>
  <line x1="840" y1="300" x2="840" y2="340" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arrow-as)"/>
  <rect x="775" y="345" width="130" height="55" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
  <text x="840" y="367" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="700">A4 Self-Org</text>
  <text x="840" y="383" text-anchor="middle" fill="#64748b" font-size="9">Recursive delegation</text>
  <text x="840" y="395" text-anchor="middle" fill="#64748b" font-size="9">delegation_loop engine</text>

  <!-- Bottom: principle -->
  <rect x="200" y="430" width="500" height="35" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="450" y="452" text-anchor="middle" fill="#94a3b8" font-size="11">Minimum Autonomy Principle: start at A0, escalate only when the task demands it</text>
</svg>