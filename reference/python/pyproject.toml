[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awp-protocol"
version = "1.0.0"
description = "Agent Workflow Protocol - Reference Implementation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "AWP Contributors"}]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.25",
]

[project.scripts]
awp = "awp.cli:_main"

[tool.setuptools.packages.find]
where = ["src"]
