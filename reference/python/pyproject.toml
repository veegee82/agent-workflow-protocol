[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awp-agents"
version = "1.0.22"
description = "Agent Workflow Protocol — an open standard for orchestrating multi-agent AI workflows with YAML definitions, DAG execution, and recursive delegation loops (A0-A4 autonomy)"
readme = "PYPI_README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Silvio Jurk"}, {name = "AWP Contributors"}]
keywords = [
    "agents", "multi-agent", "workflow", "orchestration", "llm",
    "delegation", "dag", "protocol", "awp", "ai", "autonomous",
    "agent-framework", "yaml-workflows", "openai", "claude",
    "openrouter", "ollama", "data-science", "pipeline",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.25",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "websockets>=12.0",
    "aiosqlite>=0.19",
    "python-multipart>=0.0.6",
    "pandas>=2.0",
    "numpy>=1.24",
    "Pillow>=10.0",
    "sqlalchemy>=2.0",
    "boto3>=1.28",
    "docker>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.0"]

[project.urls]
Homepage = "https://github.com/veegee82/agent-workflow-protocol"
Repository = "https://github.com/veegee82/agent-workflow-protocol"
Documentation = "https://github.com/veegee82/agent-workflow-protocol/tree/main/docs"
Issues = "https://github.com/veegee82/agent-workflow-protocol/issues"
Changelog = "https://github.com/veegee82/agent-workflow-protocol/blob/main/CHANGELOG.md"

[project.scripts]
awp = "awp.cli:_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["awp*", "server*"]

[tool.setuptools.package-data]
server = ["frontend/dist/**/*"]
