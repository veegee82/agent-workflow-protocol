repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: local
    hooks:
      - id: no-db-files
        name: Block .db files from being committed
        entry: "Found .db file(s) — database files must not be committed"
        language: fail
        types: [binary]
        files: '\.db$'
