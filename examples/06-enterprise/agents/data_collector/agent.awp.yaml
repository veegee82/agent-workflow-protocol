awp_agent: "1.0.0"

identity:
  id: data_collector
  role: data_collection_specialist
  description: "Collects data from web sources and files"

model:
  name: ""
  parameters:
    temperature: 0.1
    max_tokens: 2048

prompt:
  system: "workflow/instructions/SYSTEM_PROMPT.md"
  user_template: "workflow/prompt/00_INTRO.md"

output:
  format: json
  schema: "workflow/output_schema/output_schema.json"
  contract:
    collected_data:
      type: object
      description: "Structured collected data"
      required: true
    data_summary:
      type: string
      description: "Summary of collected data"
      required: true
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: "Confidence in data quality"
      required: true
  validation:
    mode: strict
    on_invalid: retry
    max_retries: 2

capabilities:
  tools:
    enabled: true
    max_calls: 15
    allowed:
      - "web.search"
      - "http.request"
      - "file.read"
