awp_agent: "1.0.0"

identity:
  id: communicator
  role: communication_hub
  description: "Aggregates results and coordinates inter-agent communication"

model:
  name: ""
  parameters:
    temperature: 0.3
    max_tokens: 1536

prompt:
  system: "workflow/instructions/SYSTEM_PROMPT.md"
  user_template: "workflow/prompt/00_INTRO.md"

output:
  format: json
  schema: "workflow/output_schema/output_schema.json"
  contract:
    communication_log:
      type: array
      description: "Log of all communications processed"
      required: true
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: "Confidence in communication completeness"
      required: true
  validation:
    mode: strict
    on_invalid: retry
    max_retries: 2

capabilities:
  tools:
    enabled: true
    max_calls: 10
    allowed:
      - "agent.send_message"
      - "agent.list_messages"
