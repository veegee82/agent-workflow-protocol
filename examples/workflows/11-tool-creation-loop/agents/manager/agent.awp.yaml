awp_agent: "1.0.0"

identity:
  id: manager
  role: tool_creation_manager
  description: "Manages a two-phase workflow: Phase 1 creates scoring tools, Phase 2 uses them to analyze items."

model:
  name: ""
  parameters:
    temperature: 0.1
    max_tokens: 32768

prompt:
  system: "workflow/instructions/SYSTEM_PROMPT.md"
  user_template: "workflow/prompt/00_INTRO.md"

output:
  format: json
  schema: "workflow/output_schema/output_schema.json"
  contract:
    decision:
      type: string
      required: true
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      required: true
  validation:
    mode: lenient
    on_invalid: retry
    max_retries: 2

capabilities:
  tools:
    enabled: false
