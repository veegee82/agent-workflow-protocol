awp_agent: "1.0.0"

identity:
  id: code_executor
  role: computation_specialist
  description: "Executes code and computations on collected data"

model:
  name: ""
  parameters:
    temperature: 0.0
    max_tokens: 2048

prompt:
  system: "workflow/instructions/SYSTEM_PROMPT.md"
  user_template: "workflow/prompt/00_INTRO.md"

output:
  format: json
  schema: "workflow/output_schema/output_schema.json"
  contract:
    computation_result:
      type: object
      description: "Results of data computations"
      required: true
    metrics:
      type: object
      description: "Calculated metrics and statistics"
      required: true
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: "Confidence in computation accuracy"
      required: true
  validation:
    mode: strict
    on_invalid: retry
    max_retries: 2

capabilities:
  tools:
    enabled: true
    max_calls: 10
    allowed:
      - "code.execute"
      - "shell.execute"
      - "arithmetic.*"
  sandbox:
    type: subprocess
    constraints:
      max_memory_mb: 256
      max_cpu_seconds: 30
  codemode:
    enabled: true
    language: python
