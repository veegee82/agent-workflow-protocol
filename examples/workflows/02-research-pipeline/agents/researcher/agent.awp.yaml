awp_agent: "1.0.0"

identity:
  id: researcher
  role: research_analyst
  description: "Conducts research based on the plan using web search tools"

model:
  name: ""
  parameters:
    temperature: 0.2
    max_tokens: 2048

prompt:
  system: "workflow/instructions/SYSTEM_PROMPT.md"
  user_template: "workflow/prompt/00_INTRO.md"

output:
  format: json
  schema: "workflow/output_schema/output_schema.json"
  contract:
    findings:
      type: array
      description: "Key research findings"
      required: true
    sources:
      type: array
      description: "Sources and references used"
      required: true
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: "Confidence in research findings quality"
      required: true
  validation:
    mode: strict
    on_invalid: retry
    max_retries: 2

capabilities:
  tools:
    enabled: true
    max_calls: 10
    allowed:
      - "web.search"
      - "http.request"
