awp_agent: "1.0.0"

identity:
  id: planner
  role: research_planner
  description: "Analyzes research topics and creates structured research plans"

model:
  name: ""
  parameters:
    temperature: 0.3
    max_tokens: 1024

prompt:
  system: "workflow/instructions/SYSTEM_PROMPT.md"
  user_template: "workflow/prompt/00_INTRO.md"

output:
  format: json
  schema: "workflow/output_schema/output_schema.json"
  contract:
    research_questions:
      type: array
      description: "List of specific research questions to investigate"
      required: true
    search_strategy:
      type: string
      description: "Strategy for conducting the research"
      required: true
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: "Confidence in the research plan quality"
      required: true
  validation:
    mode: strict
    on_invalid: retry
    max_retries: 2
