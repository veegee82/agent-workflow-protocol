awp_agent: "1.0.0"

identity:
  id: analyzer
  role: analyst
  description: "Analyzes the given task and produces a structured result"

model:
  name: ""
  parameters:
    temperature: 0.1
    max_tokens: 1024

prompt:
  system: "workflow/instructions/SYSTEM_PROMPT.md"
  user_template: "workflow/prompt/00_INTRO.md"

output:
  format: json
  schema: "workflow/output_schema/output_schema.json"
  contract:
    analysis:
      type: string
      description: "Analysis text"
      required: true
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: "Confidence score"
      required: true
