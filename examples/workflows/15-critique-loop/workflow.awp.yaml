awp: "1.0.0"

workflow:
  name: critique-loop
  version: "1.0.0"
  description: >
    Demonstrates the Reflective Critique Loop (RCL): structured critique of
    worker outputs, targeted repair cycles for critical defects, and
    cross-worker pattern learning. Workers are intentionally given tasks
    that produce incomplete results to trigger critique and repair.
  author: "AWP Examples"
  tags: ["example", "a2", "critique", "repair", "patterns", "feedback-loop"]

orchestration:
  engine: delegation_loop
  delegation_loop:
    manager: agents/manager
    budget:
      max_loops: 4
      max_total_workers: 12
      max_total_tokens: 100000
      max_wall_time: 180
      max_tool_calls: 50
    models:
      manager: "openai/gpt-5-nano"
      worker: "openai/gpt-5-nano"
    worker_policy:
      enforced:
        sandbox:
          type: subprocess
          max_memory_mb: 256
          max_cpu_seconds: 15
          network: false
        codemode:
          max_tools_per_worker: 5
        forbidden_tools:
          - file.write_outside_workspace
          - shell.execute
      manager_controlled:
        - instructions
        - skills
        - tools_allowed
        - output_contract
        - temperature
    termination:
      enabled: true
      window: 3
      min_confidence_delta: 0.05
    validation:
      deterministic:
        always: true
        checks: [schema, required_fields, confidence, budget]
    history:
      full_results_window: 3
    logging:
      format: dual
      persist_artifacts: true

    # --- Reflective Critique Loop config ---
    critique:
      enabled: true
      mode: inline
      max_repair_attempts: 2
      repair_budget_fraction: 0.20
      pattern_memory: true
      defect_categories:
        - missing_data
        - wrong_format
        - incomplete
        - hallucinated
        - policy_violation

observability:
  logging:
    level: INFO
  evaluation:
    enabled: true
    metrics:
      - name: has_findings
        kind: deterministic_test
        weight: 2.0
        params:
          expr: "result.confidence > 0.5"
      - name: completeness
        kind: deterministic_assertion
        weight: 1.5
        params:
          assertions:
            - "'error' not in result"
            - "result.confidence > 0"
      - name: efficiency
        kind: budget_utility
        weight: 0.5
    thresholds:
      accept: 0.75
      retry: 0.45
      fail: 0.20
    step_scores:
      enabled: true
      hooks:
        - worker_result
    retry_policy:
      enabled: true
      max_repairs: 2
      actions:
        below_retry: retry_with_repair
        below_fail: fail_workflow

state:
  model: shared_dict
  sharing:
    strategy: full
