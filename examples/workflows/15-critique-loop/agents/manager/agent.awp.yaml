awp_agent: "1.0.0"

identity:
  id: manager
  role: critique_demo_manager
  description: >
    Manager agent for the critique loop demo. Delegates analysis tasks
    to workers, evaluates results with critique feedback, and iterates
    until quality thresholds are met.

model:
  name: ""
  parameters:
    temperature: 0.2
    max_tokens: 4096

prompt:
  system: "You are a manager agent."
  user_template: ""

output:
  format: json
  contract:
    decision:
      type: string
      description: "One of: delegate, complete, fail"
      required: true
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      required: true
  validation:
    mode: lenient
    on_invalid: retry
    max_retries: 2

capabilities:
  tools:
    enabled: false
