awp_agent: "1.0.0"

identity:
  id: manager
  role: startup_evaluator
  description: "Evaluates startups through a multi-phase delegation loop: creates evaluation tools, generates domain skills, delegates analysis to specialist workers, and synthesizes a final ranking."

model:
  name: ""
  parameters:
    temperature: 0.1
    max_tokens: 4096

prompt:
  system: "workflow/instructions/SYSTEM_PROMPT.md"
  user_template: "workflow/prompt/00_INTRO.md"

output:
  format: json
  schema: "workflow/output_schema/output_schema.json"
  contract:
    decision:
      type: string
      required: true
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      required: true
  validation:
    mode: lenient
    on_invalid: retry
    max_retries: 2

capabilities:
  tools:
    enabled: false
