awp_agent: "1.0.0"

identity:
  id: coordinator
  role: team_coordinator
  description: "Coordinates team tasks and assigns work via message bus"

model:
  name: ""
  parameters:
    temperature: 0.3
    max_tokens: 1024

prompt:
  system: "workflow/instructions/SYSTEM_PROMPT.md"
  user_template: "workflow/prompt/00_INTRO.md"

output:
  format: json
  schema: "workflow/output_schema/output_schema.json"
  contract:
    task_breakdown:
      type: array
      description: "List of subtasks identified"
      required: true
    assignments:
      type: array
      description: "Task assignments sent to specialists"
      required: true
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: "Confidence in task coordination quality"
      required: true
  validation:
    mode: strict
    on_invalid: retry
    max_retries: 2

capabilities:
  tools:
    enabled: true
    max_calls: 5
    allowed:
      - "agent.send_message"
      - "agent.list_messages"
