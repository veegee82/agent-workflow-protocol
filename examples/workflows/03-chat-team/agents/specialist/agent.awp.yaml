awp_agent: "1.0.0"

identity:
  id: specialist
  role: domain_specialist
  description: "Executes specialized analysis tasks and reports back via message bus"

model:
  name: ""
  parameters:
    temperature: 0.2
    max_tokens: 1536

prompt:
  system: "workflow/instructions/SYSTEM_PROMPT.md"
  user_template: "workflow/prompt/00_INTRO.md"

output:
  format: json
  schema: "workflow/output_schema/output_schema.json"
  contract:
    analysis:
      type: string
      description: "Detailed analysis results"
      required: true
    recommendations:
      type: array
      description: "Actionable recommendations based on analysis"
      required: true
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: "Confidence in analysis quality"
      required: true
  validation:
    mode: strict
    on_invalid: retry
    max_retries: 2

capabilities:
  tools:
    enabled: true
    max_calls: 5
    allowed:
      - "agent.send_message"
      - "agent.list_messages"
      - "arithmetic.add"
      - "arithmetic.multiply"
