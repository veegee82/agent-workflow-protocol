awp_agent: "1.0.0"

identity:
  id: researcher
  role: memory_researcher
  description: "Researches topics and stores findings in persistent memory"

model:
  name: ""
  parameters:
    temperature: 0.3
    max_tokens: 1536

prompt:
  system: "workflow/instructions/SYSTEM_PROMPT.md"
  user_template: "workflow/prompt/00_INTRO.md"

output:
  format: json
  schema: "workflow/output_schema/output_schema.json"
  contract:
    findings:
      type: array
      description: "Research findings from this session"
      required: true
    key_facts:
      type: array
      description: "Key facts extracted and saved to memory"
      required: true
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: "Confidence in research findings"
      required: true
  validation:
    mode: strict
    on_invalid: retry
    max_retries: 2

capabilities:
  tools:
    enabled: true
    max_calls: 10
    allowed:
      - "memory.read"
      - "memory.write"
      - "memory.search"
      - "web.search"

memory:
  enabled: true
  tiers:
    long_term:
      enabled: true
      type: file
      path: "workspace/MEMORY.md"
      inject: true
