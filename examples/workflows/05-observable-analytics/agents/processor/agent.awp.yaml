awp_agent: "1.0.0"

identity:
  id: processor
  role: data_processor
  description: "Processes raw data and computes statistics"

model:
  name: ""
  parameters:
    temperature: 0.0
    max_tokens: 2048

prompt:
  system: "workflow/instructions/SYSTEM_PROMPT.md"
  user_template: "workflow/prompt/00_INTRO.md"

output:
  format: json
  schema: "workflow/output_schema/output_schema.json"
  contract:
    processed_data:
      type: object
      description: "Processed and cleaned data"
      required: true
    statistics:
      type: object
      description: "Computed statistics and metrics"
      required: true
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: "Confidence in processing accuracy"
      required: true
  validation:
    mode: strict
    on_invalid: retry
    max_retries: 2

capabilities:
  tools:
    enabled: true
    max_calls: 10
    allowed:
      - "arithmetic.*"
      - "code.execute"
      - "memory.write"
