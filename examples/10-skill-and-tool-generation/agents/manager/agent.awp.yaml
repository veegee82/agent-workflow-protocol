awp_agent: "1.0.0"

identity:
  id: manager
  role: skill_and_tool_manager
  description: "Generates domain-specific skills (Markdown knowledge) and delegates tasks with those skills to workers. Tests the full A3 Self-Tooling pipeline."

model:
  name: ""
  parameters:
    temperature: 0.2
    max_tokens: 4096

prompt:
  system: "workflow/instructions/SYSTEM_PROMPT.md"
  user_template: "workflow/prompt/00_INTRO.md"

output:
  format: json
  schema: "workflow/output_schema/output_schema.json"
  contract:
    decision:
      type: string
      description: "delegate, complete, or fail"
      required: true
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      required: true
  validation:
    mode: lenient
    on_invalid: retry
    max_retries: 2

capabilities:
  tools:
    enabled: false
