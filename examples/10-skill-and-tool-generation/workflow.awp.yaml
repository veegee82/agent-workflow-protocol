awp: "1.0.0"

workflow:
  name: skill-and-tool-generation
  version: "1.0.0"
  description: "A3 Self-Tooling: Manager generates skills and tools dynamically for workers. Workers use the generated domain knowledge and tools to solve tasks. Tests the full skill+tool generation pipeline."
  author: "AWP Examples"
  tags: ["a3", "self-tooling", "delegation-loop", "dynamic-skills", "dynamic-tools"]

orchestration:
  engine: delegation_loop

  delegation_loop:
    manager: agents/manager

    models:
      manager: null
      worker: null

    worker_policy:
      enforced:
        sandbox:
          type: subprocess
          max_memory_mb: 512
          max_cpu_seconds: 30
          network: false
        codemode:
          max_tools_per_worker: 5
        rate_limiting:
          max_llm_calls_per_minute: 30
        forbidden_tools:
          - "shell.execute"
      manager_controlled:
        - instructions
        - skills
        - tools_allowed
        - output_contract
        - codemode.enabled
        - codemode.tool_creation

    budget:
      max_loops: 3
      max_total_workers: 6
      max_total_tokens: 300000
      max_wall_time: 600
      max_tool_calls: 30
      max_depth: 1

    termination:
      enabled: true
      window: 3
      min_confidence_delta: 0.03
      action: warn_then_stop

    validation:
      deterministic:
        always: true
        checks: [schema, required_fields, confidence]
      llm:
        enabled: false

    history:
      rolling_summary: true
      full_results_window: 3
      persist_to_disk: true

    logging:
      format: dual
      persist_artifacts: true

state:
  model: shared_dict
  sharing:
    strategy: full
