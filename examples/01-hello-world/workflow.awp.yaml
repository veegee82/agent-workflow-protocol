awp: "1.0.0"

workflow:
  name: hello-world
  version: "1.0.0"
  description: "Simple greeting workflow demonstrating L0 Core compliance"
  author: "AWP Examples"
  tags: ["example", "l0", "core"]

orchestration:
  execution:
    mode: sequential
    timeout:
      per_agent: 30
      total: 300
    max_parallel_agents: 4
    error_handling:
      default: continue
      max_retries: 1
      retry_delay: 2.0
  graph:
    - id: greeter
      agent: greeter
      depends_on: []
      share_output:
        - greeting
        - tone

state:
  model: shared_dict
  sharing:
    strategy: full
