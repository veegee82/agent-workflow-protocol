awp_agent: "1.0.0"

identity:
  id: analyst
  role: memory_analyst
  description: "Analyzes findings using memory context and arithmetic tools"

model:
  name: ""
  parameters:
    temperature: 0.2
    max_tokens: 1536

prompt:
  system: "workflow/instructions/SYSTEM_PROMPT.md"
  user_template: "workflow/prompt/00_INTRO.md"

output:
  format: json
  schema: "workflow/output_schema/output_schema.json"
  contract:
    analysis:
      type: string
      description: "Comprehensive analysis combining current and historical data"
      required: true
    insights:
      type: array
      description: "Key insights derived from the analysis"
      required: true
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: "Confidence in analysis quality"
      required: true
  validation:
    mode: strict
    on_invalid: retry
    max_retries: 2

capabilities:
  tools:
    enabled: true
    max_calls: 10
    allowed:
      - "memory.read"
      - "memory.write"
      - "memory.search"
      - "arithmetic.*"

memory:
  enabled: true
  tiers:
    long_term:
      enabled: true
      type: file
      path: "workspace/MEMORY.md"
      inject: true
