awp_agent: "1.0.0"

identity:
  id: "analyst"
  role: "analyst"
  description: "Analyzes research findings and writes results to memory for future reference."

runtime:
  class_name: "Agent"
  strategy_folder: "workflow"

model:
  name: "provider/model-name"
  parameters:
    temperature: 0.3

prompt:
  system: "instructions/SYSTEM_PROMPT.md"
  user_template: "prompt/00_INTRO.md"

tools:
  enabled: true
  max_calls: 10
  allowed:
    - "memory.write"
    - "memory.read"
    - "memory.search"

output:
  format: "json"
  contract:
    analysis:
      type: "string"
      description: "Detailed analysis of the research findings"
      shareable: true
      required: true
    recommendations:
      type: "array"
      description: "List of actionable recommendations"
      shareable: true
      required: true
    confidence:
      type: "number"
      minimum: 0.0
      maximum: 1.0
      description: "Confidence score"
      shareable: true
      required: true

memory:
  enabled: true
  long_term_inject: true
  long_term_max_tokens: 2000
  daily_log:
    enabled: true
    auto_write: true
  search_enabled: true

vision:
  enabled: false

preprocessor:
  enabled: false
