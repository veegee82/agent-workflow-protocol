awp_agent: "1.0.0"

identity:
  id: "researcher"
  role: "researcher"
  description: "Researches topics using memory for context from past sessions."

runtime:
  class_name: "Agent"
  strategy_folder: "workflow"

model:
  name: "provider/model-name"
  parameters:
    temperature: 0.2

prompt:
  system: "instructions/SYSTEM_PROMPT.md"
  user_template: "prompt/00_INTRO.md"

tools:
  enabled: true
  max_calls: 10
  allowed:
    - "memory.read"
    - "memory.search"

output:
  format: "json"
  contract:
    findings:
      type: "string"
      description: "Research findings compiled from investigation"
      shareable: true
      required: true
    memory_context:
      type: "string"
      description: "Relevant context retrieved from memory"
      shareable: true
      required: true
    confidence:
      type: "number"
      minimum: 0.0
      maximum: 1.0
      description: "Confidence score"
      shareable: true
      required: true

memory:
  enabled: true
  long_term_inject: true
  long_term_max_tokens: 2000
  daily_log:
    enabled: true
    auto_write: true
  search_enabled: true

vision:
  enabled: false

preprocessor:
  enabled: false
