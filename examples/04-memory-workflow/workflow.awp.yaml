awp: "1.0.0"

workflow:
  name: memory-workflow
  version: "1.0.0"
  description: "Memory-enabled research workflow demonstrating A1 Adaptive autonomy level with memory feature"
  author: "AWP Examples"
  tags: ["example", "a1", "adaptive", "memory"]

orchestration:
  execution:
    mode: sequential
    timeout:
      per_agent: 60
      total: 300
    max_parallel_agents: 4
    error_handling:
      default: continue
      max_retries: 1
      retry_delay: 2.0
  graph:
    - id: researcher
      agent: researcher
      depends_on: []
      share_output:
        - findings
        - key_facts
    - id: analyst
      agent: analyst
      depends_on: ["researcher"]
      share_output:
        - analysis
        - insights

state:
  model: shared_dict
  sharing:
    strategy: selective

communication:
  bus:
    type: internal

memory:
  enabled: true
  tiers:
    long_term:
      enabled: true
      type: file
      path: workspace/MEMORY.md
      inject: true
    daily_log:
      enabled: true
      type: file
      path: workspace/memory
      auto_write: true
