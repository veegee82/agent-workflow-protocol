awp: "1.0.0"

workflow:
  name: research-pipeline
  version: "1.0.0"
  description: "Multi-agent research pipeline demonstrating A1 Adaptive autonomy level with state sharing"
  author: "AWP Examples"
  tags: ["example", "a1", "adaptive", "research"]

orchestration:
  execution:
    mode: sequential
    timeout:
      per_agent: 60
      total: 300
    max_parallel_agents: 4
    error_handling:
      default: continue
      max_retries: 1
      retry_delay: 2.0
  graph:
    - id: planner
      agent: planner
      depends_on: []
      share_output:
        - research_questions
        - search_strategy
    - id: researcher
      agent: researcher
      depends_on: ["planner"]
      share_output:
        - findings
        - sources
    - id: writer
      agent: writer
      depends_on: ["researcher"]
      share_output:
        - report

state:
  model: shared_dict
  sharing:
    strategy: selective
