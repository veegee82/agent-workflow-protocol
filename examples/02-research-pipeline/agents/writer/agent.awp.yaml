awp_agent: "1.0.0"

identity:
  id: writer
  role: report_writer
  description: "Writes comprehensive research reports from findings"

model:
  name: ""
  parameters:
    temperature: 0.5
    max_tokens: 2048

prompt:
  system: "workflow/instructions/SYSTEM_PROMPT.md"
  user_template: "workflow/prompt/00_INTRO.md"

output:
  format: json
  schema: "workflow/output_schema/output_schema.json"
  contract:
    report:
      type: string
      description: "The complete research report"
      required: true
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: "Confidence in the report quality"
      required: true
  validation:
    mode: strict
    on_invalid: retry
    max_retries: 2
