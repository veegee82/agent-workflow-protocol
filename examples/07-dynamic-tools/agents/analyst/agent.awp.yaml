awp_agent: "1.0.0"

identity:
  id: analyst
  role: data_analyst
  description: "Uses dynamically created scoring tools to evaluate and rank items"

model:
  name: ""
  parameters:
    temperature: 0.0
    max_tokens: 2048

prompt:
  system: "workflow/instructions/SYSTEM_PROMPT.md"
  user_template: "workflow/prompt/00_INTRO.md"

output:
  format: json
  schema: "workflow/output_schema/output_schema.json"
  contract:
    rankings:
      type: array
      description: "Items ranked by total weighted score"
      required: true
      shareable: true
    summary:
      type: string
      description: "Summary of the analysis"
      required: true
      shareable: true
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: "Confidence in the analysis"
      required: true
  validation:
    mode: strict
    on_invalid: retry
    max_retries: 1

capabilities:
  tools:
    enabled: true
    max_calls: 50
    allowed:
      - "scoring.*"
      - "file.read"
  codemode:
    enabled: true
    language: python
  sandbox:
    type: subprocess
    constraints:
      max_memory_mb: 128
      max_cpu_seconds: 30
