awp_agent: "1.0.0"

identity:
  id: collector
  role: data_collector
  description: "Collects and validates input data for analytics"

model:
  name: ""
  parameters:
    temperature: 0.1
    max_tokens: 1536

prompt:
  system: "workflow/instructions/SYSTEM_PROMPT.md"
  user_template: "workflow/prompt/00_INTRO.md"

output:
  format: json
  schema: "workflow/output_schema/output_schema.json"
  contract:
    raw_data:
      type: object
      description: "Collected raw data"
      required: true
    data_quality:
      type: string
      description: "Assessment of data quality"
      required: true
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: "Confidence in data quality"
      required: true
  validation:
    mode: strict
    on_invalid: retry
    max_retries: 2

capabilities:
  tools:
    enabled: true
    max_calls: 5
    allowed:
      - "web.search"
      - "file.read"

memory:
  enabled: true
  tiers:
    long_term:
      enabled: true
      inject: true
