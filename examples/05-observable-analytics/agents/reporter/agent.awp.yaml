awp_agent: "1.0.0"

identity:
  id: reporter
  role: analytics_reporter
  description: "Generates analytics reports from processed data"

model:
  name: ""
  parameters:
    temperature: 0.4
    max_tokens: 2048

prompt:
  system: "workflow/instructions/SYSTEM_PROMPT.md"
  user_template: "workflow/prompt/00_INTRO.md"

output:
  format: json
  schema: "workflow/output_schema/output_schema.json"
  contract:
    report:
      type: string
      description: "The complete analytics report"
      required: true
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: "Confidence in report quality"
      required: true
  validation:
    mode: strict
    on_invalid: retry
    max_retries: 2

capabilities:
  tools:
    enabled: true
    max_calls: 5
    allowed:
      - "file.write"
      - "memory.write"
