awp: "1.0.0"

workflow:
  name: chat-team
  version: "1.0.0"
  description: "Agent team with message bus communication demonstrating A1 Adaptive autonomy level with communication feature"
  author: "AWP Examples"
  tags: ["example", "a1", "adaptive", "communication", "messaging"]

orchestration:
  execution:
    mode: sequential
    timeout:
      per_agent: 45
      total: 300
    max_parallel_agents: 4
    error_handling:
      default: continue
      max_retries: 1
      retry_delay: 2.0
  graph:
    - id: coordinator
      agent: coordinator
      depends_on: []
      share_output:
        - task_breakdown
        - assignments
    - id: specialist
      agent: specialist
      depends_on: ["coordinator"]
      share_output:
        - analysis
        - recommendations

state:
  model: shared_dict
  sharing:
    strategy: selective

communication:
  bus:
    type: internal
    persistence: "run"
    max_message_size: 65536
    delivery: at_least_once
    ordering: fifo
  channels:
    - name: task_assignments
      type: direct
      participants:
        publishers: ["coordinator"]
        subscribers: ["specialist"]
    - name: status_updates
      type: broadcast
      participants:
        publishers: ["specialist"]
        subscribers: ["coordinator"]
