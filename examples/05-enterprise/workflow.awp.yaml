# AWP Workflow Manifest — Enterprise Pipeline
# Compliance Level: L5 Enterprise

awp: "1.0.0"

workflow:
  name: "enterprise"
  version: "1.0.0"
  description: >
    Full enterprise data processing pipeline with all AWP layers.
    Demonstrates orchestration, state management, memory, communication,
    observability, and security features.

orchestration:
  engine: "dag"
  graph:
    - id: "ingester"
      agent: "ingester"
      enabled: true
      depends_on: []
      share_input: {}
      description: "Ingests and validates data from external sources."
    - id: "processor"
      agent: "processor"
      enabled: true
      depends_on:
        - "ingester"
      share_input:
        ingester:
          - "raw_data"
          - "data_summary"
          - "source_metadata"
      description: "Processes and transforms ingested data using tools."
    - id: "reporter"
      agent: "reporter"
      enabled: true
      depends_on:
        - "processor"
      share_input:
        processor:
          - "processed_data"
          - "transformations_applied"
          - "quality_score"
      description: "Generates structured reports from processed data."
  execution:
    mode: "sequential"
    timeout:
      per_agent: 180
      total: 600

communication:
  bus:
    type: "in_memory"
    max_message_size: 131072
  channels:
    - name: "data_pipeline"
      type: "direct"
      from: "ingester"
      to: "processor"
    - name: "quality_alerts"
      type: "direct"
      from: "processor"
      to: "reporter"

memory:
  tiers:
    long_term:
      enabled: true
      backend: "file"
      inject_into_prompt: true
      max_tokens: 4000
    working:
      enabled: true
      backend: "file"
      daily_log: true
      auto_write: true

observability:
  tracing:
    enabled: true
    export_format: "jsonl"
    sample_rate: 1.0
  metrics:
    enabled: true
    collect_interval_seconds: 30
    export_path: "data/metrics"
  logging:
    structured: true
    format: "json"
    include_trace_context: true

security:
  audit:
    enabled: true
    log_tool_calls: true
    log_state_mutations: true
    log_llm_prompts: false
    export_path: "data/audit"
  rate_limiting:
    enabled: true
    max_tool_calls_per_minute: 60
    max_llm_calls_per_minute: 30
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    recovery_timeout_seconds: 60
    half_open_max_calls: 2

state:
  persistence:
    enabled: true
  sharing:
    strategy: "selective"
