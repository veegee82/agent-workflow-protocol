awp_agent: "1.0.0"

identity:
  id: "ingester"
  role: "ingester"
  description: "Ingests and validates data from external sources with full observability."

runtime:
  class_name: "Agent"
  strategy_folder: "workflow"

model:
  name: "provider/model-name"
  parameters:
    temperature: 0.1

prompt:
  system: "instructions/SYSTEM_PROMPT.md"
  user_template: "prompt/00_INTRO.md"

tools:
  enabled: true
  max_calls: 15
  allowed:
    - "file.read"
    - "file.list"
    - "http.request"
    - "web.search"
    - "memory.read"
    - "memory.search"
    - "agent.send_message"

output:
  format: "json"
  contract:
    raw_data:
      type: "object"
      description: "Ingested raw data from external sources"
      shareable: true
      required: true
    data_summary:
      type: "string"
      description: "Summary of the ingested data"
      shareable: true
      required: true
    source_metadata:
      type: "object"
      description: "Metadata about the data sources"
      shareable: true
      required: true
    confidence:
      type: "number"
      minimum: 0.0
      maximum: 1.0
      description: "Confidence score"
      shareable: true
      required: true

memory:
  enabled: true
  long_term_inject: true
  long_term_max_tokens: 4000
  daily_log:
    enabled: true
    auto_write: true
  search_enabled: true

vision:
  enabled: false

preprocessor:
  enabled: false
