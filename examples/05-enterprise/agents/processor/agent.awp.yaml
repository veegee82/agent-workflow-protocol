awp_agent: "1.0.0"

identity:
  id: "processor"
  role: "processor"
  description: "Processes and transforms ingested data using tools with full observability."

runtime:
  class_name: "Agent"
  strategy_folder: "workflow"

model:
  name: "provider/model-name"
  parameters:
    temperature: 0.1

prompt:
  system: "instructions/SYSTEM_PROMPT.md"
  user_template: "prompt/00_INTRO.md"

tools:
  enabled: true
  max_calls: 20
  allowed:
    - "file.read"
    - "file.write"
    - "shell.execute"
    - "memory.write"
    - "memory.read"
    - "memory.search"
    - "agent.send_message"
    - "agent.list_messages"
    - "arithmetic.add"
    - "arithmetic.subtract"
    - "arithmetic.multiply"
    - "arithmetic.divide"

output:
  format: "json"
  contract:
    processed_data:
      type: "object"
      description: "Transformed and processed data"
      shareable: true
      required: true
    transformations_applied:
      type: "array"
      description: "List of transformations applied to the data"
      shareable: true
      required: true
    quality_score:
      type: "number"
      description: "Quality score of the processed data"
      shareable: true
      required: true
    confidence:
      type: "number"
      minimum: 0.0
      maximum: 1.0
      description: "Confidence score"
      shareable: true
      required: true

memory:
  enabled: true
  long_term_inject: true
  long_term_max_tokens: 4000
  daily_log:
    enabled: true
    auto_write: true
  search_enabled: true

vision:
  enabled: false

preprocessor:
  enabled: false
