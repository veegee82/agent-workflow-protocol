awp: "1.0.0"

workflow:
  name: "basic_code_execute"
  version: "1.0.0"
  description: "Test 1: Worker uses code.execute to run Python and save output"

orchestration:
  engine: delegation_loop
  delegation_loop:
    manager: agents/manager
    budget:
      max_loops: 3
      max_total_workers: 3
      max_total_tokens: 1000000
      max_wall_time: 120
      max_tool_calls: 20
      max_depth: 1
    worker_policy:
      enforced:
        sandbox:
          type: subprocess
          max_memory_mb: 512
          max_cpu_seconds: 30
        forbidden_tools: ["shell.execute", "file.write_outside_workspace"]
      manager_controlled: [instructions, skills, tools_allowed, output_contract, codemode.enabled, codemode.tool_creation, temperature]
    termination:
      enabled: true
      window: 3
      min_confidence_delta: 0.05
    logging:
      format: dual
      persist_artifacts: true

dynamic_tools:
  enabled: true
  persist: true
  max_total: 10
  allowed_namespaces: [dynamic]

state:
  sharing:
    strategy: full
