awp_agent: "1.0.0"

identity:
  id: manager
  role: tool_orchestrator
  description: "Orchestrates dynamic tool creation and usage across two workers"

model:
  name: ""
  parameters:
    temperature: 0.2
    max_tokens: 2048

prompt:
  system: "workflow/instructions/SYSTEM_PROMPT.md"
  user_template: "workflow/prompt/00_INTRO.md"

output:
  format: json
  contract:
    decision:
      type: string
      description: "One of: delegate, complete, fail"
      required: true
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      required: true

capabilities:
  tools:
    enabled: false
