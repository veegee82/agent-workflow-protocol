# ============================================================================
# AWP Enterprise Feature Test Workflow
# Compliance Level: L5 Enterprise (F0–F6 — ALL features enabled)
# Purpose: Fictional test workflow to validate every AWP protocol feature
# ============================================================================

awp: "1.0.0"

workflow:
  name: "enterprise_feature_test"
  version: "1.0.0"
  description: >
    Fiktiver Enterprise-Workflow zum Testen aller AWP-Protocol-Features:
    DAG-Orchestrierung, State Sharing, Message Bus, Memory, Observability,
    Governance, Custom MCP Tools, Code Mode, Skills, CLI und Secrets.

# ─── F0: Orchestration (DAG) ───────────────────────────────────────────────
orchestration:
  engine: dag
  graph:
    # ── Agent 1: Data Collector (Entry Point) ──
    - id: data_collector
      agent: data_collector
      enabled: true
      depends_on: []
      share_input: {}
      share_output:
        - raw_data
        - data_sources
        - screenshot_summary
      description: >
        Sammelt Marktdaten über Web-Suche, HTTP-Requests und einen
        Custom MCP Tool. Unterstützt Vision für Screenshot-Analyse.

    # ── Agent 2: Code Executor (Parallel Branch A) ──
    - id: code_executor
      agent: code_executor
      enabled: true
      depends_on:
        - agent: data_collector
          condition: success
      share_input:
        data_collector:
          - raw_data
          - data_sources
      share_output:
        - computed_metrics
        - execution_log
      description: >
        Führt TypeScript-Code gegen ein typed SDK aus (Code Mode).
        Berechnet Metriken aus den Rohdaten des Data Collectors.

    # ── Agent 3: Analyst (Parallel Branch B) ──
    - id: analyst
      agent: analyst
      enabled: true
      depends_on:
        - agent: data_collector
          condition: success
      share_input:
        data_collector:
          - raw_data
          - data_sources
      share_output:
        - analysis_summary
        - risk_score
        - recommendations
      description: >
        Analysiert die Rohdaten mit Memory-Zugriff, Arithmetic-Tools,
        Preprocessor und einem Project Skill für Marktanalyse.

    # ── Agent 4: Communicator (Convergence Point) ──
    - id: communicator
      agent: communicator
      enabled: true
      depends_on:
        - agent: code_executor
          condition: success
        - agent: analyst
          condition: success
      share_input:
        code_executor:
          - computed_metrics
          - execution_log
        analyst:
          - analysis_summary
          - risk_score
          - recommendations
      share_output:
        - consolidated_report
        - broadcast_status
      description: >
        Konsolidiert Ergebnisse aus Code Executor und Analyst.
        Nutzt den Message Bus für Inter-Agent-Kommunikation.

    # ── Agent 5: Report Writer (Final Output, Conditional) ──
    - id: report_writer
      agent: report_writer
      enabled: true
      depends_on:
        - agent: communicator
          condition: success
          # Conditional: Nur ausführen wenn risk_score > 0.3
          when: "state.analyst.risk_score > 0.3"
      share_input:
        communicator:
          - consolidated_report
          - broadcast_status
        analyst:
          - risk_score
      share_output:
        - final_report_path
        - report_hash
      description: >
        Schreibt den finalen Report auf Disk. Bedingte Ausführung
        basierend auf dem Risk Score. Nutzt Secrets für Signatur.

  execution:
    mode: conditional                                # Tests conditional execution (F0)
    timeout:
      per_agent: 180
      total: 600
    error_handling:
      default: retry
      max_retries: 2
      on_final_failure: continue

# ─── F1: State ──────────────────────────────────────────────────────────────
state:
  persistence:
    enabled: true
    path: data/state
    format: json
  sharing:
    strategy: selective                              # Only share declared fields
  required_fields:
    - confidence                                     # R17: Every agent must output confidence
  auto_inject:
    run_id: "{{RUN_ID}}"
    timestamp: "{{TIMESTAMP}}"

# ─── F2: Communication (Message Bus) ────────────────────────────────────────
communication:
  bus:
    type: internal
    persistence: run                                 # Messages persist for the run duration
    delivery: at_least_once
    max_message_size: 65536
  channels:
    - name: default
      type: direct                                   # Point-to-point messaging
    - name: alerts
      type: broadcast                                # One-to-many broadcast
    - name: metrics
      type: direct
      description: "Channel for computed metric exchange"

# ─── F3: Memory ─────────────────────────────────────────────────────────────
memory:
  enabled: true
  workspace_dir: workspace
  long_term:
    enabled: true
    inject: true                                     # Inject MEMORY.md into system prompt
    max_tokens: 3000
  daily_log:
    enabled: true
    auto_write: true
  curation:
    enabled: true
    schedule: "after_run"                             # Curate after each workflow run
    days: 7

# ─── F4: Observability ──────────────────────────────────────────────────────
observability:
  tracing:
    enabled: true
    exporter: internal                               # Built-in trace exporter
    propagation: w3c                                 # W3C Trace Context propagation
    sample_rate: 1.0                                 # 100% sampling for testing
  metrics:
    enabled: true
    collector: internal
    export_interval: 30                              # Export metrics every 30s
    custom_metrics:
      - name: agent_token_usage
        type: counter
        description: "Total tokens consumed per agent"
      - name: tool_call_duration
        type: histogram
        description: "Duration of MCP tool calls in ms"
      - name: confidence_distribution
        type: histogram
        description: "Distribution of agent confidence scores"
  audit:
    enabled: true
    hash_chain: true                                 # Tamper-proof audit log
    include_inputs: true
    include_outputs: true
  logging:
    level: debug
    format: structured                               # JSON structured logs
    destination: stdout

# ─── F5: Governance (Security) ──────────────────────────────────────────────
security:
  circuit_breaker:
    enabled: true
    failure_threshold: 3                             # Open after 3 failures
    reset_timeout: 30                                # Reset after 30s
    half_open_max_calls: 1                           # Allow 1 test call in half-open
  rate_limit:
    enabled: true
    max_calls_per_minute: 120
    per_agent: true                                  # Rate limit per agent, not global
  access_control:
    enabled: true
    default_policy: allow
    rules:
      - agent: report_writer
        deny_tools:
          - shell.execute                            # Deny shell for report_writer by policy
        override: false                              # Cannot be overridden at runtime
      # Test: report_writer declares shell.execute but governance blocks it
  secrets:
    provider: file                                   # Load from secrets.yaml
    path: secrets.yaml
    required:
      - MARKET_DATA_API_KEY
      - REPORT_SIGNING_KEY

# ─── Environment Variables ──────────────────────────────────────────────────
env:
  required:
    - name: MARKET_DATA_API_KEY
      description: "API key for custom market data MCP tool"
      sensitive: true
    - name: REPORT_SIGNING_KEY
      description: "Key for signing the final report hash"
      sensitive: true
  defaults:
    SEARCH_PROVIDER: "duckduckgo"
    LOG_LEVEL: "debug"
    MAX_CONCURRENT_TOOLS: "4"

# ─── Settings ───────────────────────────────────────────────────────────────
settings:
  runtime:
    parallel_agents: true                            # Enable parallel agent execution
    max_concurrent: 2                                # Max 2 agents in parallel
  llm:
    default_temperature: 0.2
    default_max_tokens: 4096
