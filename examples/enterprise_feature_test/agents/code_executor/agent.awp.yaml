awp_agent: "1.0.0"

identity:
  id: code_executor
  role: "Code-Ausführer"
  description: >
    Führt TypeScript-Code gegen ein typed SDK aus (Code Mode).
    Berechnet Metriken, transformiert Daten und validiert Ergebnisse
    in einer Sandbox-Umgebung.
  version: "1.0.0"
  tags: [codemode, typescript, computation, sandbox]

runtime:
  class_name: Agent
  strategy_folder: workflow

model:
  name: ""
  fallback: ""
  parameters:
    temperature: 0.0
    max_tokens: 8192
    top_p: 1.0
  reasoning:
    enabled: true
    effort: high
    force: true

prompt:
  system: "instructions/SYSTEM_PROMPT.md"
  user_template: "prompt/00_INTRO.md"
  additional: []
  variables: {}
  injection_order:
    - system_prompt
    - skills
    - memory
    - previous_agents
    - user_prompt
    - context

output:
  format: json
  contract:
    computed_metrics:
      type: object
      description: "Berechnete Metriken als Key-Value-Objekt (z.B. mean, stddev, trend)"
      shareable: true
      sensitive: false
      required: true
    execution_log:
      type: string
      description: "Console-Output der Code-Ausführung"
      shareable: true
      sensitive: false
      required: true
    code_snippet:
      type: string
      description: "Der ausgeführte TypeScript-Code"
      shareable: false
      sensitive: false
      required: false
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: "Konfidenz der Berechnungsergebnisse"
      shareable: true
      required: true
  validation:
    mode: strict
    on_invalid: retry
    max_retries: 3

capabilities:
  tools:
    enabled: true
    max_calls: 20
    max_parallel: 4
    timeout_per_call: 60
    allowed:
      - web.search
      - http.request
      - file.read
      - file.write
      - file.list
      - memory.write
      - memory.read
      - arithmetic.add
      - arithmetic.subtract
      - arithmetic.multiply
      - arithmetic.divide
    denied:
      - shell.execute                    # Blocked: Code Mode uses sandbox instead

  # ── Code Mode (F6) ──
  codemode:
    enabled: true
    language: typescript
    sdk_surface:
      mode: auto                         # All allowed tools become SDK methods
      exclude:
        - memory.write                   # Exclude memory.write from SDK (test explicit exclusion)
    execution:
      sandbox_ref: capabilities.sandbox
      timeout: 30
      max_retries: 1
      capture_console: true
    state:
      enabled: true
      backend: memory

  # ── Sandbox ──
  sandbox:
    type: isolate
    constraints:
      max_memory_mb: 512
      max_cpu_seconds: 30
      max_output_bytes: 2097152          # 2 MB
    network:
      enabled: false                     # No network access in sandbox
      allowed_hosts: []
    filesystem:
      read: ["data/"]
      write: ["data/output/"]
      deny: [".env", "**/*.key", "secrets.yaml"]

  skills:
    agent_skills:
      - codemode                         # Auto-generated Code Mode skill
    project_skills: true
  data_sources: []

vision:
  enabled: false

preprocessor:
  enabled: false
  pipeline: default

memory:
  enabled: true
  long_term:
    enabled: true
    inject: true
    max_tokens: 1500
  daily_log:
    enabled: true
    auto_write: true
  search_enabled: true
