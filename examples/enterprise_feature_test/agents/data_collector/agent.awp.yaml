awp_agent: "1.0.0"

identity:
  id: data_collector
  role: "Daten-Sammler"
  description: >
    Sammelt Marktdaten aus verschiedenen Quellen: Web-Suche, HTTP-APIs,
    und einem Custom MCP Tool. Analysiert Screenshots via Vision.
  version: "1.0.0"
  tags: [data, collection, web, vision, custom-tool]

runtime:
  class_name: Agent
  strategy_folder: workflow

model:
  name: ""
  fallback: ""
  parameters:
    temperature: 0.1
    max_tokens: 4096
    top_p: 1.0
  reasoning:
    enabled: true
    effort: high
    force: true

prompt:
  system: "instructions/SYSTEM_PROMPT.md"
  user_template: "prompt/00_INTRO.md"
  additional: []
  variables:
    max_sources: "5"
    search_language: "de"
  injection_order:
    - system_prompt
    - skills
    - memory
    - previous_agents
    - user_prompt
    - context

output:
  format: json
  contract:
    raw_data:
      type: object
      description: "Gesammelte Rohdaten als strukturiertes Objekt"
      shareable: true
      sensitive: false
      required: true
    data_sources:
      type: array
      description: "Liste der verwendeten Datenquellen mit URLs und Qualitätsbewertung"
      shareable: true
      sensitive: false
      required: true
    screenshot_summary:
      type: string
      description: "Zusammenfassung des analysierten Screenshots (Vision)"
      shareable: true
      sensitive: false
      required: false
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: "Konfidenz der Datenqualität (0.0-1.0)"
      shareable: true
      required: true
  validation:
    mode: strict
    on_invalid: retry
    max_retries: 2

capabilities:
  tools:
    enabled: true
    max_calls: 15
    max_parallel: 3
    timeout_per_call: 30
    allowed:
      - web.search
      - http.request
      - file.write
      - memory.write
      - custom.fetch_market_data        # Custom MCP Tool (F6)
    denied: []
  skills:
    agent_skills: []
    project_skills: true                 # Inject project-level skills
  data_sources:
    - type: web
      description: "Webrecherche via DuckDuckGo"
    - type: api
      description: "Custom Market Data API"

# ── Vision (F6 Extension) ──
vision:
  enabled: true
  supported_formats: [png, jpg, webp]
  max_images: 5
  description: "Screenshot-Analyse von Marktdaten-Dashboards"

# ── Preprocessor ──
preprocessor:
  enabled: false
  pipeline: default

# ── Memory (L3) ──
memory:
  enabled: true
  long_term:
    enabled: true
    inject: true
    max_tokens: 2000
  daily_log:
    enabled: true
    auto_write: true
  search_enabled: true
