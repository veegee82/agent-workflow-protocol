awp_agent: "1.0.0"

identity:
  id: report_writer
  role: "Report-Schreiber"
  description: >
    Erstellt den finalen Report und schreibt ihn auf Disk.
    Bedingte Ausführung (nur bei risk_score > 0.3). Nutzt Secrets
    für Report-Signatur. Governance blockiert shell.execute.
  version: "1.0.0"
  tags: [report, governance, secrets, conditional, file-output]

runtime:
  class_name: Agent
  strategy_folder: workflow

model:
  name: ""
  fallback: ""
  parameters:
    temperature: 0.1
    max_tokens: 8192
    top_p: 1.0
  reasoning:
    enabled: true
    effort: high
    force: true

prompt:
  system: "instructions/SYSTEM_PROMPT.md"
  user_template: "prompt/00_INTRO.md"
  additional: []
  variables:
    output_format: "markdown"
    sign_report: "true"
  injection_order:
    - system_prompt
    - skills
    - memory
    - previous_agents
    - user_prompt
    - context

output:
  format: json
  contract:
    final_report_path:
      type: string
      description: "Dateipfad zum generierten Report"
      shareable: true
      sensitive: false
      required: true
    report_hash:
      type: string
      description: "SHA-256 Hash des Reports (signiert mit REPORT_SIGNING_KEY)"
      shareable: true
      sensitive: false
      required: true
    report_content:
      type: string
      description: "Inhalt des Reports als Markdown"
      shareable: false
      sensitive: false
      required: true
    governance_log:
      type: object
      description: "Log der Governance-Checks: blockierte Tools, Rate Limits, Circuit Breaker"
      shareable: false
      sensitive: false
      required: false
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: "Konfidenz der Report-Qualität"
      shareable: true
      required: true
  validation:
    mode: strict
    on_invalid: retry
    max_retries: 2

capabilities:
  tools:
    enabled: true
    max_calls: 10
    max_parallel: 2
    timeout_per_call: 30
    allowed:
      - file.write
      - file.read
      - shell.execute                    # Declared but BLOCKED by governance policy!
      - memory.write
    denied: []

  skills:
    agent_skills: []
    project_skills: true                 # Inject compliance_rules skill
  data_sources: []

vision:
  enabled: false

preprocessor:
  enabled: false
  pipeline: default

memory:
  enabled: true
  long_term:
    enabled: true
    inject: true
    max_tokens: 2000
  daily_log:
    enabled: true
    auto_write: true
  search_enabled: true
