[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awp-workspace"
version = "0.0.0"
description = "AWP development workspace — not published to PyPI"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "awp-core @ file:packages/awp-core",
    "awp-runtime @ file:packages/awp-runtime",
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["packages/awp-core/tests", "packages/awp-runtime/tests"]
