# --- Dynamic Tools (A2+ Code Mode — runtime tool creation) ---
# Required when workers should create reusable tools via Code Mode.
# MUST be enabled for tool_creation to work in delegation loop workers.
# dynamic_tools:
#   enabled: true                              # MUST be true for tool creation
#   persist: true                              # Save tools as JSON for debugging
#   max_total: 50                              # Global limit on created tools
#   allowed_namespaces: [dynamic]              # Namespaces workers can create tools in
#   code_review: true                          # Log all generated code

