# AWP Workflow Manifest Template
# Autonomy Level: A0+ (add sections for higher levels)
#
# Replace all "{{PLACEHOLDER}}" values with your workflow-specific configuration.

awp: "1.0.0"

workflow:
  name: "{{WORKFLOW_NAME}}"                         # kebab-case, MUST match directory name (R1)
  version: "1.0.0"
  description: "{{WORKFLOW_DESCRIPTION}}"

# --- Orchestration (DAG) ---
orchestration:
  engine: dag
  graph:
    - id: "{{AGENT_ID}}"                           # snake_case required (R2)
      agent: "{{AGENT_ID}}"
      enabled: true
      depends_on: []
      share_input: {}
      description: "{{AGENT_DESCRIPTION}}"

    # Add more agents:
    # - id: second_agent
    #   agent: second_agent
    #   depends_on:
    #     - agent: "{{AGENT_ID}}"
    #       condition: success
    #   share_input:
    #     "{{AGENT_ID}}": ["{{OUTPUT_FIELD}}"]
    #   description: "..."

  execution:
    mode: sequential                                # sequential | parallel | conditional
    timeout:
      per_agent: 120
      total: 300
    error_handling:
      default: continue                             # continue | stop | retry

# --- Delegation Loop (alternative to DAG, use for A2+ open-ended tasks) ---
# To use the delegation loop engine instead of the DAG engine above,
# replace the orchestration section with the following:
#
# orchestration:
#   engine: delegation_loop
#
#   delegation_loop:
#     manager: agents/{{MANAGER_AGENT_ID}}     # Agent directory for the manager
#
#     models:
#       manager: null                          # CLI --manager-model → YAML → LLM_MODEL env
#       worker: null                           # CLI --worker-model → YAML → manager model
#
#     budget:
#       max_loops: 20                          # Maximum manager iterations
#       max_total_workers: 30                  # Total workers across all iterations
#       max_total_tokens: 1000000              # LLM token limit
#       max_wall_time: 600                     # Wall clock seconds
#       max_tool_calls: 200                    # Total tool invocations
#       max_depth: 5                           # Recursive sub-delegation depth (A4)
#
#     worker_policy:
#       enforced:                              # Manager CANNOT change these
#         sandbox:
#           type: subprocess
#           max_memory_mb: 512
#           max_cpu_seconds: 30
#           network: false
#         codemode:
#           max_tools_per_worker: 10           # A3 tool creation limit
#         rate_limiting:
#           max_llm_calls_per_minute: 30
#         forbidden_tools:
#           - "shell.execute"                  # Workers use code.execute instead
#           - "file.write_outside_workspace"
#       manager_controlled:                    # Manager CAN set these per worker
#         - instructions
#         - skills
#         - tools_allowed
#         - output_contract
#         - codemode.enabled
#         - codemode.tool_creation
#         - temperature                        # Per-worker LLM temperature (0.0-2.0)
#   # NOTE: shell.execute is forbidden — manager must use code.execute in tools_allowed.
#   # Workers with codemode need: tools_allowed: [code.execute, file.read, file.write]
#
#     # Sibling coordination blackboard (default: true). Workers get the
#     # run-scoped `board.post` / `board.read` tools automatically when on.
#     blackboard_enabled: true
#     # Optional blacklist for submanager state inheritance:
#     # forbidden_inheritance_keys: [secret_token, raw_dump]
#
#     termination:
#       enabled: true
#       window: 3                              # Compare last N iterations
#       min_confidence_delta: 0.05             # Must improve by at least this
#       action: warn_then_stop                 # warn once, stop on second stall
#
#     validation:
#       deterministic:
#         always: true
#         checks: [schema, required_fields, confidence, budget]
#       llm:
#         enabled: true
#         skip_when_confidence_above: 0.95
#         skip_when_budget_remaining_below: 0.1
#
#     history:
#       rolling_summary: true
#       full_results_window: 3                 # Keep full results for last N iterations
#       persist_to_disk: true
#
#     logging:
#       format: dual                           # dual | json | md
#       persist_artifacts: true
#
#     # --- Critique (optional, per-worker defect analysis + repair) ---
#     critique:
#       enabled: false                         # set true for reflective critique loop
#       mode: inline                           # "inline" (worker model) or "dedicated"
#       max_repair_attempts: 2                 # per-worker repair cycles
#       repair_budget_fraction: 0.15           # max 15% of budget for repairs
#       pattern_memory: true                   # learn from failures across workers
#       defect_categories:
#         - missing_data
#         - wrong_format
#         - incomplete
#         - hallucinated
#         - policy_violation

# --- State ---
state:
  persistence:
    enabled: true
    path: data/state
    format: json
  sharing:
    strategy: full                                  # full | selective | isolated
  required_fields: []
  auto_inject: {}

# --- Environment & Secrets (any level) ---
# Declare required environment variables. Variables with sensitive: true
# are loaded from secrets.yaml > .env > os.environ and never logged.
# env:
#   required:
#     - name: SEARCH_API_KEY
#       description: "API key for premium web search"
#       sensitive: true
#     - name: AUTH_TOKEN
#       description: "Bearer token for external API"
#       sensitive: true
#   defaults:
#     SEARCH_PROVIDER: "duckduckgo"

