# A1 Adaptive -- DAG with two agents, state sharing, conditional execution
awp: "1.0.0"

workflow:
  name: l1-dag
  version: "1.0.0"
  description: "A1 Adaptive workflow with a two-agent DAG and state sharing."

orchestration:
  engine: dag
  graph:
    - id: researcher
      agent: researcher
      depends_on: []
      share_input: {}
      description: "Research agent"

    - id: writer
      agent: writer
      depends_on:
        - researcher
      share_input:
        researcher:
          - findings
          - summary
      description: "Writer agent"

  execution:
    mode: sequential
    timeout:
      per_agent: 120
      total: 300
