# A1 Adaptive with Memory feature -- Workflow with memory (2+ tiers), communication, and DAG
awp: "1.0.0"

workflow:
  name: l3-memory
  version: "1.0.0"
  description: "A1 Adaptive workflow with cross-cutting memory and communication features."

orchestration:
  engine: dag
  graph:
    - id: analyzer
      agent: analyzer
      depends_on: []
      description: "Analysis agent"

  execution:
    mode: sequential

communication:
  bus:
    type: internal
    persistence: run
  channels:
    - name: direct
      type: direct

memory:
  enabled: true
  workspace_dir: workspace
  long_term:
    enabled: true
    inject: true
    max_tokens: 2000
  daily_log:
    enabled: true
    auto_write: true
  episodic:
    enabled: true
    max_entries: 100
